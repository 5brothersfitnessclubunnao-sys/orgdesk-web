<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gym ERP — Member &amp; Staff Attendance</title>
<style>
  :root {
    --gold: #ffcc00;
    --bg: #07090f;
    --card: #111622;
    --card2: #182032;
    --border: #263046;
    --green: #00ff66;
    --cyan: #38bdf8;
    --red: #ff5555;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  body { background: var(--bg); color: #fff; padding: 12px; max-width: 520px; margin: 0 auto; min-height: 100vh; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .nav-btn { text-decoration: none; background: var(--card2); border: 1px solid var(--border); color: var(--gold); padding: 7px 11px; border-radius: 8px; font-size: 11px; font-weight: 800; }
  .brand-box { background: radial-gradient(circle at top, #1f1a08 0%, #0c1018 100%); border: 1.5px solid var(--gold); border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 12px; }
  .brand-box h1 { font-size: 18px; color: var(--gold); font-weight: 900; text-transform: uppercase; }
  .clock-pill { display: inline-block; margin-top: 6px; background: #141923; border: 1px solid var(--gold); color: var(--gold); font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 999px; }

  .dual-mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mode-card-btn {
    background: var(--card2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
  }
  .mode-card-btn.active.member { border-color: var(--gold); background: rgba(255, 204, 0, 0.14); color: var(--gold); }
  .mode-card-btn.active.staff { border-color: var(--cyan); background: rgba(56, 189, 248, 0.14); color: var(--cyan); }

  .panel { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .fg { margin-bottom: 10px; }
  label { display: block; font-size: 11px; color: #cbd5e1; font-weight: 700; margin-bottom: 4px; }
  input, select { width: 100%; background: #090d16; border: 1.5px solid var(--border); border-radius: 9px; padding: 10px; color: #fff; font-size: 13px; outline: none; }
  input:focus, select:focus { border-color: var(--gold); }

  .btn-gold { width: 100%; background: linear-gradient(135deg, var(--gold), #e0b000); color: #000; border: 0; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 900; cursor: pointer; }
  .btn-green { width: 100%; background: linear-gradient(135deg, var(--green), #00c853); color: #000; border: 0; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 900; cursor: pointer; margin-top: 8px; }
  .btn-cyan { width: 100%; background: linear-gradient(135deg, var(--cyan), #0284c7); color: #000; border: 0; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 900; cursor: pointer; margin-top: 8px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat-box { background: #0a0e17; border: 1px solid #222b3f; border-radius: 10px; padding: 10px; text-align: center; }
  .stat-box span { font-size: 10px; color: var(--muted); display: block; }
  .stat-box b { font-size: 18px; font-weight: 900; display: block; margin-top: 3px; }

  .log-item { background: #0a0e17; border: 1px solid #232c40; border-left: 3.5px solid var(--green); border-radius: 9px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .log-item img { width: 46px; height: 46px; border-radius: 7px; object-fit: cover; border: 1.5px solid var(--green); }
  .log-item b { font-size: 12.5px; color: #fff; }
  .log-item small { font-size: 10.5px; color: var(--muted); display: block; margin-top: 2px; }
</style>
</head>
<body>
  <div class="top-bar">
    <a class="nav-link" href="login.html">🔑 Login / Gym</a>
    <a class="nav-link" href="admission.html">📝 Admission Form</a>
    <a class="nav-link" href="pay.html">💳 Fees Portal</a>
  </div>

  <div class="brand-box">
    <h1 id="attGymTitle">GYM ATTENDANCE KIOSK</h1>
    <p id="attGymSub" style="font-size:11px;color:#94a3b8;margin-top:2px;">Member &amp; Staff Selfie Attendance</p>
    <div class="clock-pill" id="liveClock">Loading clock...</div>
  </div>

  <!-- Mark Your Attendance: Member vs Staff -->
  <div class="dual-mode-grid">
    <button type="button" class="mode-card-btn active member" id="tabMemberAtt" onclick="switchMode('member')">
      🏋️ Mark Your Attendance<br><span style="font-size:10.5px;font-weight:700;">Gym Member</span>
    </button>
    <button type="button" class="mode-card-btn staff" id="tabStaffAtt" onclick="switchMode('staff')">
      👥 Mark Your Attendance<br><span style="font-size:10.5px;font-weight:700;">Staff Attendance</span>
    </button>
  </div>

  <!-- MEMBER ATTENDANCE PANEL -->
  <div class="panel" id="memberPanel">
    <div class="fg">
      <label>Gym Member चुनें या नाम लिखें *</label>
      <input type="text" id="memberNameInput" list="memberDatalist" placeholder="Member ka naam ya mobile likhein...">
      <datalist id="memberDatalist"></datalist>
    </div>
    <div class="fg">
      <label>बैच (Batch)</label>
      <select id="memberBatchSelect">
        <option value="morning">🌅 Morning Batch</option>
        <option value="evening">🌙 Evening Batch</option>
      </select>
    </div>
    <button type="button" class="btn-green" onclick="startSelfiePunch('member')">📸 Member Selfie Attendance</button>

    <div class="stats-grid">
      <div class="stat-box"><span>Total Members</span><b id="cntTotalMembers" style="color:#fff;">0</b></div>
      <div class="stat-box"><span>Aaj Present</span><b id="cntPresentMembers" style="color:var(--green);">0</b></div>
      <div class="stat-box"><span>Aaj Absent</span><b id="cntAbsentMembers" style="color:var(--red);">0</b></div>
    </div>
  </div>

  <!-- STAFF ATTENDANCE PANEL -->
  <div class="panel" id="staffPanel" style="display:none;">
    <div class="fg">
      <label>Staff Member चुनें या नाम लिखें *</label>
      <input type="text" id="staffNameInput" list="staffDatalist" placeholder="Staff ka naam ya ID likhein...">
      <datalist id="staffDatalist"></datalist>
    </div>
    <div class="fg">
      <label>लोकेशन मोड (Location Mode)</label>
      <select id="staffLocSelect">
        <option value="Inside Gym">🏢 Inside Gym</option>
        <option value="Outside Gym">📍 Outside Gym (Reason Mandatory)</option>
      </select>
    </div>
    <button type="button" class="btn-cyan" onclick="startSelfiePunch('staff')">📸 Staff Selfie Attendance</button>

    <div class="stats-grid">
      <div class="stat-box"><span>Total Staff</span><b id="cntTotalStaff" style="color:#fff;">0</b></div>
      <div class="stat-box"><span>Aaj Present</span><b id="cntPresentStaff" style="color:var(--green);">0</b></div>
      <div class="stat-box"><span>Aaj Absent</span><b id="cntAbsentStaff" style="color:var(--red);">0</b></div>
    </div>
  </div>

  <!-- DATE-WISE SELFIE & DAYS COUNT LOGS -->
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <b style="color:var(--gold);font-size:13px;">📅 Selfie, Date &amp; Days Count</b>
      <input type="date" id="attDatePicker" onchange="renderAttendanceLogs()" style="width:auto;padding:6px 10px;font-size:12px;">
    </div>
    <div id="attendanceLogBox"></div>
  </div>

<script>
  let activeAttMode = "member";

  function getGymProfile() {
    try {
      const p = JSON.parse(localStorage.getItem("om_active_gym_profile") || "null");
      if (p && p.gymName) return p;
    } catch (e) {}
    return { gymName: "Fitness Club", address: "Active Gym" };
  }

  function getGymKey(suffix) {
    const p = getGymProfile();
    const slug = String(p.gymName || "default").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_");
    return "gym_" + slug + "_" + suffix;
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function formatDMY(iso) {
    if (!iso || iso.length < 10) return iso || "";
    const parts = iso.split("-");
    return parts[2] + "-" + parts[1] + "-" + parts[0];
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true });
    const el = document.getElementById("liveClock");
    if (el) el.textContent = "📅 " + formatDMY(todayISO()) + " | ⏰ " + t;
  }

  function switchMode(mode) {
    activeAttMode = mode;
    const isStaff = mode === "staff";
    document.getElementById("tabMemberAtt").classList.toggle("active", !isStaff);
    document.getElementById("tabStaffAtt").classList.toggle("active", isStaff);
    document.getElementById("memberPanel").style.display = isStaff ? "none" : "block";
    document.getElementById("staffPanel").style.display = isStaff ? "block" : "none";
    renderAttendanceLogs();
  }

  function loadRosterOptions() {
    let members = [], staff = [];
    try { members = JSON.parse(localStorage.getItem(getGymKey("members")) || "[]"); } catch (e) {}
    try { staff = JSON.parse(localStorage.getItem(getGymKey("staff")) || "[]"); } catch (e) {}

    document.getElementById("memberDatalist").innerHTML = members.map(m => `<option value="${esc(m.name)}">`).join("");
    document.getElementById("staffDatalist").innerHTML = staff.map(s => `<option value="${esc(s.name)}">`).join("");
    return { members, staff };
  }

  function countPersonDaysInMonth(personName, personType, yearMonth) {
    const key = getGymKey("att_logs");
    let logs = [];
    try { logs = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) {}
    const dates = new Set();
    logs.forEach(item => {
      if (item.personType === personType && item.name.toLowerCase() === String(personName || "").toLowerCase()) {
        if (!yearMonth || String(item.date || "").startsWith(yearMonth)) {
          dates.add(item.date);
        }
      }
    });
    return dates.size;
  }

  function startSelfiePunch(personType) {
    const isStaff = personType === "staff";
    const nameInput = document.getElementById(isStaff ? "staffNameInput" : "memberNameInput");
    const personName = (nameInput ? nameInput.value : "").trim();
    if (!personName) {
      alert("Kripya pehle naam likhein ya list se chunein.");
      if (nameInput) nameInput.focus();
      return;
    }

    let extraInfo = "";
    if (isStaff) {
      const locMode = document.getElementById("staffLocSelect").value;
      if (locMode === "Outside Gym") {
        const reason = prompt("Outside Gym attendance ka reason likhein (mandatory):");
        if (!reason || !reason.trim()) {
          alert("Outside Gym punch ke liye reason likhna zaroori hai.");
          return;
        }
        extraInfo = "Outside Gym (" + reason.trim() + ")";
      } else {
        extraInfo = "Inside Gym";
      }
    } else {
      extraInfo = "Batch: " + document.getElementById("memberBatchSelect").value;
    }

    let fileInp = document.getElementById("kioskSelfieFile");
    if (!fileInp) {
      fileInp = document.createElement("input");
      fileInp.type = "file";
      fileInp.id = "kioskSelfieFile";
      fileInp.accept = "image/*";
      fileInp.setAttribute("capture", "user");
      fileInp.style.display = "none";
      document.body.appendChild(fileInp);
    }

    fileInp.onchange = function(ev) {
      const file = ev.target.files && ev.target.files[0];
      const dStr = todayISO();
      const tStr = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });

      const saveLog = (photoSrc) => {
        const key = getGymKey("att_logs");
        let logs = [];
        try { logs = JSON.parse(localStorage.getItem(key) || "[]"); } catch (err) {}

        logs.unshift({
          id: "ATT_" + Date.now(),
          personType,
          name: personName,
          date: dStr,
          time: tStr,
          extraInfo,
          photo: photoSrc || ""
        });
        localStorage.setItem(key, JSON.stringify(logs.slice(0, 300)));
        document.getElementById("attDatePicker").value = dStr;
        renderAttendanceLogs();
        alert("✅ " + personName + " ki selfie attendance (" + tStr + ") save ho gayi!");
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(loadEv) {
          const img = new Image();
          img.onload = function() {
            const c = document.createElement("canvas");
            const maxS = 240;
            const sc = Math.min(1, maxS / Math.max(img.width, img.height));
            c.width = Math.max(1, Math.round(img.width * sc));
            c.height = Math.max(1, Math.round(img.height * sc));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            saveLog(c.toDataURL("image/jpeg", 0.55));
          };
          img.src = loadEv.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        saveLog("");
      }
    };

    fileInp.click();
  }

  function renderAttendanceLogs() {
    const { members, staff } = loadRosterOptions();
    const selDate = document.getElementById("attDatePicker").value || todayISO();
    const ym = selDate.slice(0, 7);

    const key = getGymKey("att_logs");
    let logs = [];
    try { logs = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) {}

    const dayLogs = logs.filter(x => x.date === selDate);
    const presentMembers = new Set(dayLogs.filter(x => x.personType === "member").map(x => x.name.toLowerCase()));
    const presentStaff = new Set(dayLogs.filter(x => x.personType === "staff").map(x => x.name.toLowerCase()));

    document.getElementById("cntTotalMembers").textContent = String(members.length);
    document.getElementById("cntPresentMembers").textContent = String(presentMembers.size);
    document.getElementById("cntAbsentMembers").textContent = String(Math.max(0, members.length - presentMembers.size));

    document.getElementById("cntTotalStaff").textContent = String(staff.length);
    document.getElementById("cntPresentStaff").textContent = String(presentStaff.size);
    document.getElementById("cntAbsentStaff").textContent = String(Math.max(0, staff.length - presentStaff.size));

    const filtered = dayLogs.filter(x => x.personType === activeAttMode);
    const box = document.getElementById("attendanceLogBox");

    if (!filtered.length) {
      box.innerHTML = '<div style="color:#777;font-size:12px;text-align:center;padding:12px;">' + formatDMY(selDate) + ' ke liye koi ' + (activeAttMode === "staff" ? "Staff" : "Member") + ' selfie log nahi hai.</div>';
      return;
    }

    box.innerHTML = filtered.map(item => {
      const daysCount = countPersonDaysInMonth(item.name, item.personType, ym);
      const thumb = item.photo ? `<img src="${item.photo}" alt="Selfie">` : `<div style="width:46px;height:46px;border-radius:7px;background:#182032;display:flex;align-items:center;justify-content:center;font-size:10px;color:#94a3b8;">No Photo</div>`;
      return `
        <div class="log-item">
          <div style="display:flex;align-items:center;gap:10px;">
            ${thumb}
            <div>
              <b>${esc(item.name)} <span style="color:var(--green);font-size:11px;">(${daysCount} din)</span></b>
              <small>📅 ${esc(formatDMY(item.date))} • ⏰ ${esc(item.time)}</small>
              <small>${esc(item.extraInfo || "")}</small>
            </div>
          </div>
          <span style="background:rgba(0,255,102,0.14);color:var(--green);border:1px solid var(--green);padding:4px 8px;border-radius:6px;font-size:10.5px;font-weight:900;">PRESENT</span>
        </div>
      `;
    }).join("");
  }

  window.addEventListener("DOMContentLoaded", function() {
    const p = getGymProfile();
    document.getElementById("attGymTitle").textContent = "👑 " + String(p.gymName || "FITNESS CLUB").toUpperCase();
    document.getElementById("attGymSub").textContent = (p.gymName || "Active Gym") + " — Member & Staff Attendance";
    document.getElementById("attDatePicker").value = todayISO();
    updateClock();
    setInterval(updateClock, 1000);
    renderAttendanceLogs();
  });
</script>
</body>
</html>
