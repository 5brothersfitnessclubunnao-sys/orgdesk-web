<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Developer Access — Om Software</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#050814;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:#0b1226;border:1.5px solid #26365e;border-radius:18px;padding:22px 18px}
h1{font-size:19px;font-weight:900;color:#ffd166;margin-bottom:6px;text-align:center}
p{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:14px}
.fg{margin-bottom:12px}
label{display:block;font-size:11.5px;color:#cbd5e1;font-weight:700;margin-bottom:4px}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:13px;outline:none}
.btn{width:100%;padding:12px;border-radius:11px;border:none;background:linear-gradient(135deg,#ffd166,#f5a623);color:#050814;font-size:13.5px;font-weight:900;cursor:pointer}
.err{display:none;margin-top:10px;padding:9px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>DEVELOPER PORTAL</h1>
  <p>Enter Developer Password to Open Console</p>
  <form id="devForm">
    <div class="fg">
      <label>Developer Password *</label>
      <input type="password" id="devPass" required placeholder="Enter developer password">
    </div>
    <button type="submit" class="btn">Unlock Developer Console</button>
    <div class="err" id="devErr">Invalid password. Please enter 8336.</div>
  </form>
</div>
<script>
(function () {
  document.getElementById("devForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var p = document.getElementById("devPass").value.trim();
    if (p === "8336") {
      try { sessionStorage.setItem("om_dev_authed_8336", "1"); } catch (e) {}
      location.href = "developer-saas-admin.html";
    } else {
      document.getElementById("devErr").style.display = "block";
    }
  });
})();
</script>
</body>
</html>
