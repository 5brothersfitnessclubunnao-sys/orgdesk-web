<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Master Login — MPIN 8336</title>
  <style>
    :root {
      --bg: #050814; --card: #0a1124; --border: rgba(245, 166, 35, 0.55);
      --gold: #f5a623; --gold-bright: #ffd166; --cyan: #22d3ee; --emerald: #34d399;
      --rose: #fb7185; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    body {
      background: radial-gradient(700px 360px at 50% -10%, rgba(245, 166, 35, 0.16), transparent 65%), var(--bg);
      color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .box {
      width: 100%; max-width: 420px; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 22px; padding: 22px;
    }
    .pill {
      display: inline-block; background: rgba(245, 166, 35, 0.16); color: var(--gold-bright);
      border: 1px solid var(--border); font-size: 10.5px; font-weight: 900; padding: 3px 10px; border-radius: 999px;
    }
    h1 { font-size: 21px; font-weight: 900; margin-top: 8px; color: #fff; }
    p { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 14px; margin-bottom: 5px; }
    .mpin-inp {
      width: 100%; background: #070d1d; border: 1.5px solid var(--border); color: var(--gold-bright);
      border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 900; letter-spacing: 8px; text-align: center;
    }
    .btn {
      width: 100%; margin-top: 14px; background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #050814; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 900; cursor: pointer;
    }
    .err { color: var(--rose); font-size: 12px; font-weight: 700; margin-top: 8px; min-height: 16px; }
    .links { margin-top: 14px; display: flex; justify-content: space-between; font-size: 12px; }
    .links a { color: var(--cyan); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <span class="pill">APP DEVELOPER PORTAL</span>
    <h1>Prime Master Login</h1>
    <p>Sirf App Developer ke liye alag MPIN login. Apna 4-digit MPIN darj karein.</p>

    <form onsubmit="handlePrimeMasterLogin(event)">
      <label for="primeMpinInp">Prime Master MPIN *</label>
      <input id="primeMpinInp" class="mpin-inp" type="password" inputmode="numeric" maxlength="4" placeholder="••••" required autofocus>
      <div id="primeErr" class="err"></div>
      <button type="submit" class="btn">Login as Prime Master →</button>
    </form>

    <div class="links">
      <a href="plans.html">Customer Plans Page</a>
      <a href="admin-payments.html">Payment Alert</a>
    </div>
  </div>

  <script>
    const PRIME_MASTER_MPIN = "8336";
    function handlePrimeMasterLogin(ev) {
      ev.preventDefault();
      var val = (document.getElementById("primeMpinInp").value || "").trim();
      var errEl = document.getElementById("primeErr");
      if (val !== PRIME_MASTER_MPIN) {
        errEl.textContent = "Galat MPIN. Kripya sahi 4-digit MPIN darj karein.";
        return;
      }
      errEl.textContent = "";
      try {
        localStorage.setItem("om_prime_master_auth", "1");
        localStorage.setItem("om_is_master_admin", "1");
        localStorage.setItem("om_logged_user", "Prime Master (Developer)");
      } catch (e) {}
      location.replace("developer-saas-admin.html");
    }
  </script>
</body>
</html>
