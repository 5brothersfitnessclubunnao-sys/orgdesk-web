<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plans, UTR &amp; Extra Features — Om Software</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="realtime-sync.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#050814;color:#f8fafc;padding:14px;padding-bottom:60px}
.wrap{max-width:640px;margin:0 auto}
header{background:#0b1226;border:1.5px solid #f5a623;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;color:#ffd166;font-weight:900}
.btn{padding:7px 11px;border-radius:9px;border:none;background:#f5a623;color:#050814;font-size:11.5px;font-weight:900;cursor:pointer;text-decoration:none}
.btn.sec{background:#111b33;color:#38bdf8;border:1px solid #2c3e6b}
.btn.cyan{background:#22d3ee;color:#050814}
.card{background:#0b1226;border:1.5px solid #26365e;border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:#ffd166;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{margin-bottom:8px}
label{display:block;font-size:11px;color:#cbd5e1;font-weight:700;margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:12.5px}
.feat-item{display:flex;justify-content:space-between;align-items:center;background:#070c1a;border:1px solid #1e2d52;border-radius:9px;padding:9px 10px;margin-top:6px;font-size:12px}
.status-box{margin-top:10px;padding:10px;border-radius:10px;background:#070c1a;border:1px solid #22d3ee;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>PLANS &amp; UPGRADE</h1>
      <p style="font-size:11px;color:#94a3b8">UTR Verification, Licence Key &amp; Extra Features (₹10–₹80)</p>
    </div>
    <div style="display:flex;gap:6px">
      <a href="app.html" class="btn sec">Back to App</a>
      <button type="button" class="btn cyan" id="btnOpenExtraWindow">Extra Features Window</button>
    </div>
  </header>

  <div class="card">
    <h2>Submit Plan Payment (UTR / Screenshot)</h2>
    <div class="row2">
      <div class="fg"><label>Gym / Business Name *</label><input id="plGym" placeholder="Your Gym Name"></div>
      <div class="fg"><label>City *</label><input id="plCity" placeholder="Your City"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Owner Email ID *</label><input type="email" id="plEmail" placeholder="owner@gym.com"></div>
      <div class="fg"><label>Select Plan *</label>
        <select id="plSelect">
          <option value="Starter (₹99)|99|30">Starter Plan — ₹99 (30 Days)</option>
          <option value="Growth (₹299)|299|30">Growth Plan — ₹299 (30 Days)</option>
          <option value="Commercial Pro (₹999)|999|365">Commercial Pro — ₹999 (365 Days)</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="fg"><label>UTR Number *</label><input id="plUtr" placeholder="12-digit UTR / Ref No"></div>
      <div class="fg"><label>Upload UTR Payment Photo</label><input type="file" id="plUtrPhoto" accept="image/*"></div>
    </div>
    <button type="button" class="btn" id="btnSubmitUtrReq">Send Payment Request to Developer</button>
    <div class="status-box" id="planActivationStatus">Awaiting request or developer approval.</div>
  </div>

  <!-- Dedicated Extra Feature Selection Window (₹10 to ₹80) -->
  <div class="card" id="extraFeatureWindow">
    <h2>Extra Features Selection (₹10 – ₹80)</h2>
    <div class="fg"><label>Your Email / Gym Name *</label><input id="efCustId" placeholder="owner@gym.com or Gym Name"></div>
    <div id="extraFeaturesCatalog">
      <label class="feat-item"><span><input type="checkbox" class="ef-chk" data-name="WhatsApp Fee Reminder" data-price="15"> WhatsApp Fee Reminder</span><b>₹15</b></label>
      <label class="feat-item"><span><input type="checkbox" class="ef-chk" data-name="PDF Receipt Branding" data-price="25"> PDF Receipt Branding</span><b>₹25</b></label>
      <label class="feat-item"><span><input type="checkbox" class="ef-chk" data-name="Multi-Staff Role Filter" data-price="45"> Multi-Staff Role Filter</span><b>₹45</b></label>
      <label class="feat-item"><span><input type="checkbox" class="ef-chk" data-name="Advance Analytics &amp; Export Pack" data-price="80"> Advance Analytics &amp; Export Pack</span><b>₹80</b></label>
    </div>
    <div style="margin-top:8px;font-size:12.5px;font-weight:800;color:#ffd166">Selected Extra Total: <span id="efSelectedSum">₹0</span></div>
    <button type="button" class="btn cyan" style="margin-top:8px" id="btnSendExtraFeatReq">Send Extra Feature Request</button>
    <div class="status-box" id="efStatusBox">Select features (₹10–₹80) to request approval.</div>
  </div>
</div>

<script>
(function () {
  function calcEfSum() {
    var sum = 0;
    document.querySelectorAll(".ef-chk:checked").forEach(function (c) {
      var p = Math.min(80, Math.max(10, Number(c.getAttribute("data-price") || 0)));
      sum += p;
    });
    document.getElementById("efSelectedSum").textContent = "₹" + sum;
    return sum;
  }

  document.querySelectorAll(".ef-chk").forEach(function (c) {
    c.addEventListener("change", calcEfSum);
  });

  document.getElementById("btnOpenExtraWindow").addEventListener("click", function () {
    document.getElementById("extraFeatureWindow").scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("btnSubmitUtrReq").addEventListener("click", function () {
    var gym = document.getElementById("plGym").value.trim() || "Gym Workspace";
    var city = document.getElementById("plCity").value.trim() || "General";
    var email = document.getElementById("plEmail").value.trim().toLowerCase() || "owner@gym.com";
    var parts = String(document.getElementById("plSelect").value || "Starter (₹99)|99|30").split("|");
    var plan = parts[0], amt = Number(parts[1] || 99), days = Number(parts[2] || 30);
    var utr = document.getElementById("plUtr").value.trim();
    var file = document.getElementById("plUtrPhoto").files && document.getElementById("plUtrPhoto").files[0];

    if (!utr && !file) return alert("UTR Number ya UTR ki photo upload karein.");

    var s = window.omSync.readSaas();
    s.pendingRequests.unshift({
      gymName: gym,
      city: city,
      email: email,
      plan: plan,
      amount: amt,
      days: days,
      utr: utr || "Photo Uploaded",
      utrProofName: file ? file.name : ""
    });
    window.omSync.writeSaas(s);
    document.getElementById("planActivationStatus").innerHTML =
      "Request sent to Developer for <b>" + plan + "</b> (UTR: <b>" + (utr || file.name) + "</b>). Once accepted, your plan activation message, Licence Key, and validity dates will appear here.";
  });

  document.getElementById("btnSendExtraFeatReq").addEventListener("click", function () {
    var ref = document.getElementById("efCustId").value.trim().toLowerCase() || "owner@gym.com";
    var chosen = [];
    document.querySelectorAll(".ef-chk:checked").forEach(function (c) {
      chosen.push({
        name: c.getAttribute("data-name"),
        price: Math.min(80, Math.max(10, Number(c.getAttribute("data-price") || 10)))
      });
    });
    if (!chosen.length) return alert("Kam se kam ek extra feature chunein.");

    var s = window.omSync.readSaas();
    chosen.forEach(function (ch) {
      s.extraFeatureRequests.unshift({
        customerRef: ref,
        featureName: ch.name,
        price: ch.price,
        status: "Pending"
      });
    });
    window.omSync.writeSaas(s);
    renderCustomerSaasStatus(ref);
  });

  function renderCustomerSaasStatus(matchRef) {
    var s = window.omSync.readSaas();
    var ref = (matchRef || document.getElementById("efCustId").value || "").trim().toLowerCase();
    var cust = (s.customers || []).find(function (c) {
      return !ref || String(c.email || "").toLowerCase() === ref || String(c.gymName || "").toLowerCase() === ref;
    });
    if (cust) {
      document.getElementById("planActivationStatus").innerHTML =
        "<b style='color:#34d399'>Your plan has been activated</b><br>" +
        "Plan: <b>" + cust.plan + "</b> • Licence Key: <b>" + cust.licenceKey + "</b><br>" +
        "Validity: <b>" + cust.startDate + "</b> to <b>" + cust.endDate + "</b><br>" +
        "Active Services: " + (cust.features || []).join(", ");
    }
    var due = Number((s.udharDueByCustomer || {})[ref] || 0);
    var myReqs = (s.extraFeatureRequests || []).filter(function (r) { return !ref || String(r.customerRef || "").toLowerCase() === ref; });
    if (myReqs.length || due > 0) {
      document.getElementById("efStatusBox").innerHTML =
        "Extra Requests: " + myReqs.map(function (r) { return r.featureName + " (₹" + r.price + " - " + r.status + ")"; }).join(", ") +
        "<br><b style='color:#fca5a5'>Pending / Udhar Amount to Pay: ₹" + due.toLocaleString("en-IN") + "</b>";
    }
  }

  window.addEventListener("om:saas-synced", function () { renderCustomerSaasStatus(); });
  renderCustomerSaasStatus();
})();
</script>
</body>
</html>
