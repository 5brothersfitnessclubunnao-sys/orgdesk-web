<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#050814;color:#fff;padding:14px;padding-bottom:60px;max-width:600px;margin:0 auto}
header{background:#0b1226;border:1.5px solid #26365e;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:16px;font-weight:900;color:#ffd166}
.btn{padding:7px 11px;border-radius:9px;border:1px solid #334155;background:#111b33;color:#fff;font-size:11.5px;font-weight:800;text-decoration:none;cursor:pointer}
.btn.gold{background:#f5a623;color:#050814;border-color:#f5a623}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#0b1226;border:1.5px solid #26365e;border-radius:14px;padding:14px;text-decoration:none;color:#fff;display:block}
.card b{display:block;font-size:14px;color:#ffd166;margin-bottom:4px}
.card span{font-size:11.5px;color:#94a3b8}
</style>
<script src="realtime-sync.js"></script>
</head>
<body>

<script>
(function () {
  var MODE_KEY = "om_locked_app_mode_v1";
  var LOGGED_KEY = "om_session_active_v1";

  function getLockedMode() {
    try {
      var m = localStorage.getItem(MODE_KEY);
      if (m === "light" || m === "full") return m;
      var legacy = localStorage.getItem("om_app_display_mode");
      if (legacy === "light" || legacy === "full") {
        localStorage.setItem(MODE_KEY, legacy);
        return legacy;
      }
    } catch (e) {}
    return "light";
  }

  function setLockedMode(mode, explicitSwitch) {
    if (!explicitSwitch) return;
    var target = (mode === "full") ? "full" : "light";
    try {
      localStorage.setItem(MODE_KEY, target);
      localStorage.setItem("om_app_display_mode", target);
      localStorage.setItem(LOGGED_KEY, "1");
    } catch (e) {}
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: target } }));
  }

  function clearSessionOnLogout() {
    try {
      localStorage.removeItem(LOGGED_KEY);
      localStorage.removeItem("om_session_active");
    } catch (e) {}
  }

  window.omGetLockedMode = getLockedMode;
  window.omSetLockedMode = setLockedMode;
  window.omClearSessionOnLogout = clearSessionOnLogout;

  // Keep mode locked across browser back/forward (pageshow)
  window.addEventListener("pageshow", function () {
    var m = getLockedMode();
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: m } }));
  });
})();
</script>
