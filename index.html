<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OrgDesk</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest-app.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="ui.css">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="templates.js"></script>
<style>
  body{background:#0b0b0b;padding:12px 12px 36px}
  .hm{max-width:560px;margin:0 auto}
  .banner{border:2.5px solid var(--ac);border-radius:22px;padding:20px 14px;text-align:center;margin-bottom:16px;background:linear-gradient(160deg,#241c00,#0f0c00);user-select:none;-webkit-user-select:none;cursor:pointer}
  .banner h1{font-size:26px;line-height:1.2;color:var(--ac);text-transform:uppercase;font-weight:900;letter-spacing:.3px}
  .banner .lg{width:54px;height:54px;border-radius:12px;object-fit:cover;vertical-align:middle;margin-right:6px}
  .banner .ad{color:#cfcfcf;font-size:14px;margin-top:6px}
  .banner .wl{color:var(--ac);font-weight:800;font-size:17px;margin-top:10px}
  .sess{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;font-size:14px;color:#cfcfcf}
  .sess button{background:transparent;border:1.5px solid var(--ac);color:var(--ac);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{--c:#ffcc00;position:relative;display:block;text-decoration:none;text-align:center;color:var(--c);background:#141414;background:color-mix(in srgb,var(--c) 9%,#0b0b0b);border:2.5px solid var(--c);border-radius:22px;padding:20px 8px 16px;min-height:150px;font-family:inherit;width:100%;cursor:pointer}
  .tile.full{grid-column:1/-1;min-height:0;display:flex;align-items:center;justify-content:center;gap:14px;text-align:left;padding:18px 12px}
  .tile .ic{font-size:50px;line-height:1.1;display:block}
  .tile.full .ic{font-size:44px}
  .tile .t{display:block;font-size:20px;font-weight:900;margin-top:8px;line-height:1.15}
  .tile .s{display:block;font-size:13.5px;color:#a8a8a8;margin-top:5px}
  .tile.soon{opacity:.55}
  .tile .soonTag{position:absolute;top:8px;right:10px;font-size:10px;font-weight:800;background:#222;color:#bbb;border-radius:8px;padding:2px 7px;letter-spacing:.4px}
  .foot{text-align:center;color:#6f6f6f;font-size:14px;margin-top:22px}
  .hint{color:#8a8a8a;font-size:12.5px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="hm" id="app"><div class="card ctr mut" style="margin-top:40px">Loading…</div></div>
<div id="mroot"></div>
<script>
(function () {
  "use strict";
  if (!window.G || !G.ok) return;
  var esc = G.esc, app = document.getElementById("app"), mroot = document.getElementById("mroot");
  var $ = function (id) { return document.getElementById(id); };
  var ST = { oid: "", org: null, user: null, ownerOrg: "", admin: false, ready: false };
  var taps = 0, tapT = null;

  function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  ST.oid = (G.qs("o") || "").trim() || lsGet("od_org");

  /* ---------- tiles ---------- */
  function savedCard() {
    try { var l = JSON.parse(lsGet("org_card") || lsGet("org_last") || "null"); if (l && l.o === ST.oid && l.m) return l; } catch (e) {}
    return null;
  }
  function memberTiles(w) {
    return [
      { ic: "✅", t: "Attendance", s: "हाजिरी / Mark today", c: "#22ff66", go: function () { var l = savedCard(); if (l) location.href = "card.html?o=" + encodeURIComponent(l.o) + "&m=" + encodeURIComponent(l.m); else G.toast("Apna " + w + " card kholein (admission ke baad mila link)"); } },
      { ic: "🛒", t: "Supplement Store", s: "Products / Shop", c: "#b46cff", soon: 1 },
      { ic: "💳", t: "Pay / UPI & Fees", s: "फीस भरें / रसीद", c: "#ff5c6c", full: 1, go: function () { var l = savedCard(); if (l) location.href = "pay.html?o=" + encodeURIComponent(l.o) + "&m=" + encodeURIComponent(l.m); else G.toast("Apna " + w + " card kholein (admission ke baad mila link)"); } }
    ];
  }
  function adminTiles(w, ws) {
    var o = encodeURIComponent(ST.oid);
    var L = function (u) { return function () { location.href = u; }; };
    return [
      { ic: "📝", t: "Admission Form", s: "🔒 नया " + w + " / फॉर्म", c: "#ffcc00", go: L("join.html?o=" + o) },
      { ic: "👥", t: ws + " Portal", s: "🔒 Renew · Edit", c: "#3b9eff", go: L("admin.html#mem") },
      { ic: "✅", t: "Attendance", s: "हाजिरी / In-Out", c: "#22ff66", soon: 1 },
      { ic: "📊", t: "Master", s: "🔒 Admin dashboard", c: "#ff9900", go: L("admin.html#home") },
      { ic: "🕒", t: "Approvals", s: "🔒 Approve / Deny", c: "#ff5c8a", go: L("admin.html#adm") },
      { ic: "🧾", t: "Receipts", s: "🔒 Online pay · Bills", c: "#22d3ee", go: L("admin.html#rec") },
      { ic: "🛒", t: "Supplement Store", s: "Products / Shop", c: "#b46cff", soon: 1 },
      { ic: "📦", t: "Store Orders", s: "🔒 Approve / Ship", c: "#b46cff", soon: 1 },
      { ic: "🖼️", t: "Store Admin", s: "🔒 Photo + Price", c: "#22d3ee", soon: 1 },
      { ic: "🔑", t: "Product Verify", s: "Code check", c: "#22ff66", soon: 1 },
      { ic: "🥗", t: "Health & Diet", s: "BMI & Diet Chart", c: "#ff9900", soon: 1 },
      { ic: "🧾", t: "Diet Orders", s: "🔒 Approve UTR", c: "#ff5c8a", soon: 1 },
      { ic: "⚙️", t: "Settings", s: "🔒 Plans · Terms · Profile", c: "#ffcc00", full: 1, go: L("admin.html#set") }
    ];
  }

  /* ---------- screens ---------- */
  function tileHtml(t, i) {
    return '<button type="button" class="tile' + (t.full ? " full" : "") + (t.soon ? " soon" : "") + '" style="--c:' + t.c + '" data-i="' + i + '">' +
      (t.soon ? '<span class="soonTag">SOON</span>' : "") + '<span class="ic">' + t.ic + '</span><span><span class="t">' + esc(t.t) + '</span><span class="s">' + esc(t.s) + "</span></span></button>";
  }
  function draw() {
    var org = ST.org;
    if (!org) return;
    var tpl = (window.ORG_TEMPLATES || {})[org.type] || {};
    var w = tpl.memberWord || "Member", ws = tpl.membersWord || "Members";
    if (ST.admin) mroot.innerHTML = "";
    var tiles = ST.admin ? adminTiles(w, ws) : memberTiles(w);
    var icon = { gym: "👑", school: "🏫", college: "🎓" }[org.type] || "🏢";
    var logo = G.img(org.logo);
    var line = [org.address, org.phone].filter(Boolean).map(esc).join(" · ");
    app.innerHTML =
      '<div class="banner" id="bn"><h1>' + (logo ? '<img class="lg" src="' + logo + '" alt="">' : icon + " ") + esc(org.name) + "</h1>" +
      (line ? '<div class="ad">' + line + "</div>" : "") +
      '<div class="wl">' + (ST.admin ? "मुख्य मेनू (Admin)" : "आपका स्वागत है") + "</div></div>" +
      (ST.admin ? '<div class="sess"><span>✅ Admin session active</span><button type="button" id="lo">Logout</button></div>' : "") +
      '<div class="tiles">' + tiles.map(tileHtml).join("") + "</div>" +
      '<div class="foot">' + esc(org.name) + " · Welcome</div>";
    G.theme(org);
    Array.prototype.forEach.call(app.querySelectorAll(".tile"), function (b) {
      b.onclick = function () { var t = tiles[+b.getAttribute("data-i")]; if (t.soon) G.toast("Ye module abhi ban raha hai"); else if (t.go) t.go(); };
    });
    $("bn").onclick = function () {
      if (ST.admin) return;
      taps++; clearTimeout(tapT); tapT = setTimeout(function () { taps = 0; }, 2500);
      if (taps >= 5) { taps = 0; loginModal(); }
    };
    if ($("lo")) $("lo").onclick = function () { G.auth.signOut(); };
  }
  function noOrg() {
    app.innerHTML = '<div class="banner" style="cursor:default"><h1>OrgDesk</h1><div class="wl">Organisation nahi mili</div></div>' +
      '<div class="tiles"><a class="tile" style="--c:#ffcc00" href="admin.html"><span class="ic">🔒</span><span class="t">Admin Sign in</span><span class="s">Apna email / password</span></a>' +
      '<a class="tile" style="--c:#22ff66" href="setup.html"><span class="ic">🏢</span><span class="t">New Setup</span><span class="s">Nayi organisation banayein</span></a></div>' +
      '<p class="hint">Link me <b>?o=organisation-id</b> lagakar kholein, ya admin sign in karein.</p>';
  }

  function loginModal(msg) {
    mroot.innerHTML = '<div style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:380px;width:100%;border:2px solid var(--ac)">' +
      '<h2 style="color:var(--ac)">🔒 Admin Login</h2><label>Email</label><input class="inp" id="em" type="email" autocomplete="username"><label>Password</label><input class="inp" id="pw" type="password" autocomplete="current-password">' +
      '<div class="err" id="lerr" style="margin-top:8px;min-height:18px">' + esc(msg || "") + '</div>' +
      '<button class="btn" id="lgo" style="margin-top:8px">Sign in</button><button class="btn sec" id="lcl" style="margin-top:8px">Cancel</button></div></div>';
    $("lcl").onclick = function () { mroot.innerHTML = ""; };
    $("lgo").onclick = function () {
      var b = $("lgo"); b.disabled = true; b.textContent = "Signing in…";
      G.auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value).then(function () { mroot.innerHTML = ""; }).catch(function (e) { b.disabled = false; b.textContent = "Sign in"; $("lerr").textContent = G.firebaseError(e); });
    };
    $("pw").onkeydown = function (e) { if (e.key === "Enter") $("lgo").click(); };
  }

  /* ---------- boot ---------- */
  function loadOrg() {
    if (!ST.oid) return noOrg();
    G.db.collection("orgs").doc(ST.oid).get().then(function (s) {
      if (!s.exists) { lsSet("od_org", ""); return noOrg(); }
      ST.org = s.data(); lsSet("od_org", ST.oid);
      ST.admin = !!(ST.user && ST.ownerOrg === ST.oid);
      draw();
    }).catch(function () { app.innerHTML = '<div class="card ctr" style="margin-top:40px"><h2>Unable to load</h2><p class="mut">Internet check karke dobara kholein.</p></div>'; });
  }
  G.auth.onAuthStateChanged(function (u) {
    ST.user = u || null; ST.ownerOrg = "";
    if (!u) { if (ST.ready) { ST.admin = false; return draw(); } ST.ready = true; return loadOrg(); }
    G.db.collection("users").doc(u.uid).get().then(function (s) {
      var d = s.exists ? s.data() : null;
      if (d && d.role === "owner") ST.ownerOrg = d.orgId;
      if (!ST.oid && ST.ownerOrg) ST.oid = ST.ownerOrg;
      if (ST.oid && ST.ownerOrg && ST.ownerOrg !== ST.oid && mroot.innerHTML) { G.auth.signOut(); return loginModal("Ye account is organisation ka nahi hai."); }
      if (ST.ready && ST.org) { ST.admin = !!(ST.ownerOrg && ST.ownerOrg === ST.oid); draw(); } else { ST.ready = true; loadOrg(); }
    }).catch(function () { if (!ST.ready) { ST.ready = true; loadOrg(); } });
  });
  G.pwa();
})();
</script>
</body>
</html>
