<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Staff &amp; Manager Access — Auto ID &amp; Login Link</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#050814;color:#f8fafc;padding:16px}
.wrap{max-width:640px;margin:0 auto}
.card{background:#0b1226;border:1.5px solid #26365e;border-radius:16px;padding:16px;margin-bottom:14px}
h1,h2{color:#ffd166;font-size:18px;margin-bottom:8px}
.sub{font-size:12px;color:#94a3b8;margin-bottom:12px}
.fg{margin-bottom:10px}
label{display:block;font-size:11.5px;color:#cbd5e1;font-weight:700;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:13px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(135deg,#ffd166,#f5a623);color:#050814;font-weight:900;font-size:12.5px;cursor:pointer}
.btn.sec{background:#111b33;color:#38bdf8;border:1px solid #2c3e6b}
.btn.sm{padding:6px 10px;font-size:11px;margin-top:8px}
.item{background:#070c1a;border:1px solid #1e2d52;border-radius:11px;padding:11px;margin-top:8px;font-size:12px}
.id-pill{display:inline-block;background:rgba(34,211,238,.14);border:1px solid #22d3ee;color:#22d3ee;padding:2px 8px;border-radius:999px;font-weight:900;font-size:11px}
</style>
</head>
<body>

<script>
(function () {
  var MODE_KEY = "om_locked_app_mode_v1";
  var LOGGED_KEY = "om_session_active_v1";

  function getLockedMode() {
    try {
      var m = localStorage.getItem(MODE_KEY);
      if (m === "light" || m === "full") return m;
      var legacy = localStorage.getItem("om_app_display_mode");
      if (legacy === "light" || legacy === "full") {
        localStorage.setItem(MODE_KEY, legacy);
        return legacy;
      }
    } catch (e) {}
    return "light";
  }

  function setLockedMode(mode, explicitSwitch) {
    if (!explicitSwitch) return;
    var target = (mode === "full") ? "full" : "light";
    try {
      localStorage.setItem(MODE_KEY, target);
      localStorage.setItem("om_app_display_mode", target);
      localStorage.setItem(LOGGED_KEY, "1");
    } catch (e) {}
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: target } }));
  }

  function clearSessionOnLogout() {
    try {
      localStorage.removeItem(LOGGED_KEY);
      localStorage.removeItem("om_session_active");
    } catch (e) {}
  }

  window.omGetLockedMode = getLockedMode;
  window.omSetLockedMode = setLockedMode;
  window.omClearSessionOnLogout = clearSessionOnLogout;

  window.addEventListener("pageshow", function () {
    var m = getLockedMode();
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: m } }));
  });
})();
</script>

<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <a href="app.html" class="btn sec" style="text-decoration:none">← Back to App</a>
    <a href="login.html" class="btn sec" style="text-decoration:none">Login Page</a>
  </div>

  <div class="card">
    <h1>Add Staff / Manager (Auto Employee ID)</h1>
    <p class="sub">System automatically generates a unique Employee ID on add, and provides a login link to share with the employee.</p>

    <div class="grid2">
      <div class="fg">
        <label>Role *</label>
        <select id="taRole">
          <option value="staff">Staff</option>
          <option value="manager">Manager</option>
        </select>
      </div>
      <div class="fg">
        <label>Auto-Generated Employee ID</label>
        <input type="text" id="taAutoId" readonly style="color:#22d3ee;font-weight:900">
      </div>
    </div>

    <div class="grid2">
      <div class="fg">
        <label>Employee Name *</label>
        <input type="text" id="taName" placeholder="Full Name">
      </div>
      <div class="fg">
        <label>Branch ID *</label>
        <input type="text" id="taBranch" value="BR-001">
      </div>
    </div>

    <div class="grid2">
      <div class="fg">
        <label>Initial Password / MPIN *</label>
        <input type="text" id="taPass" value="123456">
      </div>
      <div class="fg">
        <label>Registered Email (Optional)</label>
        <input type="email" id="taEmail" placeholder="employee@domain.com">
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn" id="btnAddMember">Save &amp; Generate ID</button>
      <button type="button" class="btn sec" id="btnRegenId">Generate New ID</button>
    </div>
    <div id="taStatus" style="margin-top:10px;font-size:12px;color:#34d399;font-weight:700"></div>
  </div>

  <div class="card">
    <h2>Added Staff &amp; Managers</h2>
    <div id="taListBox"></div>
  </div>
</div>

<script>
(function () {
  var ACC_KEY = "om_accounts_v3";

  function generateEmpId() {
    var r = document.getElementById("taRole").value;
    var prefix = (r === "manager") ? "MGR" : "STF";
    var num = Math.floor(1000 + Math.random() * 9000);
    document.getElementById("taAutoId").value = prefix + "-" + num;
  }

  function readAcc() {
    try { return JSON.parse(localStorage.getItem(ACC_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function writeAcc(a) {
    try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) {}
  }

  function buildShareLink(empId, empRole) {
    var base = location.href.replace(/[^/]*$/, "");
    return base + "login.html?role=" + encodeURIComponent(empRole) + "&empId=" + encodeURIComponent(empId);
  }

  function renderList() {
    var list = readAcc().filter(function (a) { return a.role === "staff" || a.role === "manager"; });
    var box = document.getElementById("taListBox");
    if (!list.length) {
      box.innerHTML = '<div class="sub">No staff or manager added yet.</div>';
      return;
    }
    box.innerHTML = list.map(function (item, idx) {
      var link = buildShareLink(item.empId, item.role);
      return '<div class="item">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<b>' + (item.name || "Member") + '</b>' +
          '<span class="id-pill">' + item.empId + ' (' + item.role.toUpperCase() + ')</span>' +
        '</div>' +
        '<div class="sub" style="margin:4px 0">Branch: ' + (item.branchId || "BR-001") + ' • Pass: ' + (item.password || "") + '</div>' +
        '<div style="font-size:11px;color:#38bdf8;word-break:break-all">' + link + '</div>' +
        '<button type="button" class="btn sec sm" data-share-idx="' + idx + '">Share Login Link</button>' +
      '</div>';
    }).join("");
  }

  document.getElementById("taRole").addEventListener("change", generateEmpId);
  document.getElementById("btnRegenId").addEventListener("click", generateEmpId);

  document.getElementById("btnAddMember").addEventListener("click", function () {
    var r = document.getElementById("taRole").value;
    var empId = document.getElementById("taAutoId").value.trim();
    var name = document.getElementById("taName").value.trim();
    var branchId = document.getElementById("taBranch").value.trim() || "BR-001";
    var pass = document.getElementById("taPass").value.trim() || "123456";
    var email = document.getElementById("taEmail").value.trim().toLowerCase();

    if (!name) return alert("Employee Name darj karein.");
    if (!empId) generateEmpId();
    empId = document.getElementById("taAutoId").value.trim();

    var accs = readAcc();
    accs.unshift({
      role: r,
      empId: empId,
      id: empId,
      name: name,
      branchId: branchId,
      password: pass,
      email: email,
      mode: window.omGetLockedMode()
    });
    writeAcc(accs);

    var shareUrl = buildShareLink(empId, r);
    document.getElementById("taStatus").textContent = "Saved: " + name + " (" + empId + ") — Login Link ready to share.";
    document.getElementById("taName").value = "";
    generateEmpId();
    renderList();
    prompt("Share this login link with " + name + ":", shareUrl);
  });

  document.getElementById("taListBox").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-share-idx]");
    if (!btn) return;
    var list = readAcc().filter(function (a) { return a.role === "staff" || a.role === "manager"; });
    var item = list[Number(btn.getAttribute("data-share-idx"))];
    if (!item) return;
    var url = buildShareLink(item.empId, item.role);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).catch(function () {});
    }
    prompt("Share Login Link (" + item.name + " - " + item.empId + "):", url);
  });

  generateEmpId();
  renderList();
})();
</script>
</body>
</html>
