<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gym ERP — Fees &amp; Billing Portal</title>
<style>
  :root {
    --gold: #ffcc00;
    --bg: #07090f;
    --card: #111622;
    --card2: #171f30;
    --border: #263046;
    --green: #00ff66;
    --cyan: #38bdf8;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  body { background: var(--bg); color: #fff; padding: 12px; max-width: 520px; margin: 0 auto; min-height: 100vh; }
  .top-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .nav-link { text-decoration: none; background: var(--card2); border: 1px solid var(--border); color: var(--gold); padding: 7px 11px; border-radius: 8px; font-size: 11px; font-weight: 800; }
  .gym-head { background: radial-gradient(circle at top, #1f1a08 0%, #0c1018 100%); border: 1.5px solid var(--gold); border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 12px; }
  .gym-head h1 { font-size: 18px; color: var(--gold); font-weight: 900; text-transform: uppercase; }
  .gym-head p { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .panel { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .fg { margin-bottom: 10px; }
  label { display: block; font-size: 11px; color: #cbd5e1; font-weight: 700; margin-bottom: 4px; }
  input, select { width: 100%; background: #090d16; border: 1.5px solid var(--border); border-radius: 9px; padding: 10px; color: #fff; font-size: 13px; outline: none; }
  input:focus, select:focus { border-color: var(--gold); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-pay { width: 100%; background: linear-gradient(135deg, var(--green), #00c853); color: #000; border: 0; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 900; cursor: pointer; margin-top: 6px; }
  .receipt-box { display: none; background: #fff; color: #000; border-radius: 14px; padding: 16px; border: 2px solid var(--gold); margin-top: 12px; }
  .receipt-box h2 { font-size: 16px; text-align: center; border-bottom: 2px dashed #000; padding-bottom: 8px; margin-bottom: 10px; }
  .r-line { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px dotted #ccc; }
  .btn-print { width: 100%; background: #000; color: var(--gold); border: 0; border-radius: 8px; padding: 10px; font-size: 12px; font-weight: 900; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
  <div class="top-nav">
    <a class="nav-link" href="login.html">🔑 Login / Gym</a>
    <a class="nav-link" href="admission.html">📝 Admission Form</a>
    <a class="nav-link" href="attendance.html">📸 Attendance Kiosk</a>
  </div>

  <div class="gym-head">
    <h1 id="payGymTitle">GYM FEES PORTAL</h1>
    <p id="payGymSub">Active Gym Fee Collection &amp; Receipt</p>
  </div>

  <form class="panel" onsubmit="generateFeeSlip(event)">
    <div class="row2">
      <div class="fg">
        <label>सदस्य का नाम *</label>
        <input type="text" id="payMemberName" required placeholder="Member naam">
      </div>
      <div class="fg">
        <label>मोबाइल नंबर *</label>
        <input type="tel" id="payMemberPhone" maxlength="10" required placeholder="10-digit mobile">
      </div>
    </div>

    <div class="row2">
      <div class="fg">
        <label>प्लान *</label>
        <select id="payPlan">
          <option value="1 Month - ₹500">1 Month - ₹500</option>
          <option value="3 Months - ₹1200">3 Months - ₹1200</option>
          <option value="6 Months - ₹2000">6 Months - ₹2000</option>
          <option value="12 Months - ₹4000">12 Months - ₹4000</option>
        </select>
      </div>
      <div class="fg">
        <label>जमा राशि (₹) *</label>
        <input type="number" id="payAmount" required value="500">
      </div>
    </div>

    <div class="row2">
      <div class="fg">
        <label>भुगतान माध्यम</label>
        <select id="payMode">
          <option value="Cash">Cash</option>
          <option value="Online / UPI">Online / UPI</option>
        </select>
      </div>
      <div class="fg">
        <label>भुगतान तारीख *</label>
        <input type="date" id="payDate" required>
      </div>
    </div>

    <button type="submit" class="btn-pay">🧾 Generate Fee Receipt</button>
  </form>

  <div class="receipt-box" id="feeReceiptBox">
    <h2 id="rcGymName">FITNESS CLUB</h2>
    <div class="r-line"><span>Bill No:</span><b id="rcBillNo"></b></div>
    <div class="r-line"><span>Member:</span><b id="rcName"></b></div>
    <div class="r-line"><span>Mobile:</span><b id="rcPhone"></b></div>
    <div class="r-line"><span>Plan:</span><b id="rcPlan"></b></div>
    <div class="r-line"><span>Paid Amount:</span><b id="rcAmt"></b></div>
    <div class="r-line"><span>Mode:</span><b id="rcMode"></b></div>
    <div class="r-line"><span>Date:</span><b id="rcDate"></b></div>
    <button type="button" class="btn-print" onclick="window.print()">🖨️ Print / Save Receipt</button>
  </div>

<script>
  function getGymProfile() {
    try {
      const p = JSON.parse(localStorage.getItem("om_active_gym_profile") || "null");
      if (p && p.gymName) return p;
    } catch (e) {}
    return { gymName: "Fitness Club", address: "Active Gym" };
  }

  function generateFeeSlip(e) {
    e.preventDefault();
    const prof = getGymProfile();
    const name = document.getElementById("payMemberName").value.trim();
    const phone = document.getElementById("payMemberPhone").value.trim();
    const plan = document.getElementById("payPlan").value;
    const amt = document.getElementById("payAmount").value;
    const mode = document.getElementById("payMode").value;
    const dt = document.getElementById("payDate").value;

    document.getElementById("rcGymName").textContent = String(prof.gymName || "FITNESS CLUB").toUpperCase();
    document.getElementById("rcBillNo").textContent = "INV-" + Date.now().toString().slice(-5);
    document.getElementById("rcName").textContent = name;
    document.getElementById("rcPhone").textContent = phone;
    document.getElementById("rcPlan").textContent = plan;
    document.getElementById("rcAmt").textContent = "₹" + amt;
    document.getElementById("rcMode").textContent = mode;
    document.getElementById("rcDate").textContent = dt;
    document.getElementById("feeReceiptBox").style.display = "block";
  }

  window.addEventListener("DOMContentLoaded", function() {
    const prof = getGymProfile();
    document.getElementById("payGymTitle").textContent = "👑 " + String(prof.gymName || "FITNESS CLUB").toUpperCase();
    document.getElementById("payGymSub").textContent = (prof.gymName || "Active Gym") + " — Fees & Receipt";
    const t = new Date();
    document.getElementById("payDate").value = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  });
</script>
</body>
</html>
