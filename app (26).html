<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OM SOFTWARE — 18 Grid &amp; Live Cloud Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="realtime-sync.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#040711;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:14px;padding-bottom:64px}
.wrap{max-width:640px;margin:0 auto}

.live-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#091124;border:1.5px solid #22d3ee;border-radius:14px;padding:9px 12px;margin-bottom:12px;font-size:11.5px}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,.16);color:#34d399;border:1px solid rgba(16,185,129,.45);padding:3px 9px;border-radius:999px;font-weight:900}
.dot{width:7px;height:7px;border-radius:50%;background:#10b981}

header{background:linear-gradient(145deg,#1d1604,#090f20);border:2px solid #f5a623;border-radius:16px;padding:13px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:10px}
.om-mark{width:40px;height:40px;border-radius:12px;background:rgba(245,166,35,.15);border:1.5px solid #ffd166;color:#ffd166;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}
header h1{font-size:16px;font-weight:900;color:#ffd166;cursor:pointer}
header p{font-size:11px;color:#94a3b8;margin-top:2px}
.top-btns{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{padding:7px 10px;border-radius:9px;border:1px solid #334155;background:#111b33;color:#fff;font-size:11.5px;font-weight:800;cursor:pointer;text-decoration:none}
.sbtn.gold{background:#f5a623;color:#050814;border-color:#f5a623}
.sbtn.cyan{background:#082f49;color:#38bdf8;border-color:#38bdf8}
.sbtn.red{background:#450a0a;color:#fca5a5;border-color:#ef4444}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#0b1226;border:1.5px solid #26365e;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:16px;color:#ffd166}
.kpi span{font-size:10.5px;color:#94a3b8;font-weight:700}

.grid-18{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:480px){.grid-18{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:94px;padding:10px 8px;background:#0b1226;border:1.5px solid #26365e;border-radius:14px;color:#fff;font-weight:800;font-size:12.5px;text-align:center;cursor:pointer;text-decoration:none}
.tile .num{font-size:10px;color:#94a3b8;font-weight:800}
.tile .ico{font-size:22px}
.tile .lbl{line-height:1.2}
.tile.gold{border-color:#f5a623;color:#ffd166}
.tile.green{border-color:#22c55e;color:#4ade80}
.tile.cyan{border-color:#22d3ee;color:#22d3ee}
.tile.blue{border-color:#38bdf8;color:#7dd3fc}
.tile.purple{border-color:#a855f7;color:#d8b4fe}
.tile.red{border-color:#ef4444;color:#fca5a5}
.tile.orange{border-color:#f97316;color:#fdba74}

.panel{margin-top:14px;background:#0b1226;border:1.5px solid #26365e;border-radius:14px;padding:14px}
.panel h3{font-size:14px;color:#ffd166;margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{margin-bottom:8px}
.fg label{display:block;font-size:11px;color:#94a3b8;margin-bottom:3px;font-weight:700}
.fc{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:12.5px}
.act-btn{width:100%;padding:10px;border-radius:10px;border:none;font-weight:900;font-size:12.5px;cursor:pointer;margin-top:4px}
.act-btn.gold{background:#f5a623;color:#050814}
.act-btn.green{background:#22c55e;color:#050814}
.act-btn.cyan{background:#22d3ee;color:#050814}
.rec{background:#070c1a;border:1px solid #1e2d52;border-radius:9px;padding:8px 10px;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="live-strip">
    <span class="live-pill"><span class="dot"></span> OM 18-GRID • LIVE CLOUD</span>
    <span id="liveSyncStatus" style="color:#bae6fd;font-weight:700">Synced</span>
  </div>

  <header>
    <div class="hdr-left">
      <div class="om-mark">ॐ</div>
      <div>
        <h1 id="appHdrTitle">OM SOFTWARE</h1>
        <p id="appModeSub">Mode Locked: Light Mode • 18 Grid Active</p>
      </div>
    </div>
    <div class="top-btns">
      <button type="button" class="sbtn cyan" id="btnSwitchMode">Switch Mode</button>
      <a href="plans.html" class="sbtn gold">Plans</a>
      <button type="button" class="sbtn red" id="btnLogout">Logout</button>
    </div>
  </header>

  <div class="kpi-grid">
    <div class="kpi"><b id="kpiColTotal">₹0</b><span>Live Collection</span></div>
    <div class="kpi"><b id="kpiAdmTotal">0</b><span>Admissions</span></div>
    <div class="kpi"><b id="kpiAttTotal">0</b><span>Attendance</span></div>
  </div>

  <div class="grid-18" id="omGrid18">
    <button type="button" class="tile gold" data-grid="1"><span class="num">01</span><span class="ico">📊</span><span class="lbl">Live Dashboard</span></button>
    <button type="button" class="tile green" data-grid="2"><span class="num">02</span><span class="ico">📝</span><span class="lbl">Admission Form</span></button>
    <button type="button" class="tile cyan" data-grid="3"><span class="num">03</span><span class="ico">✅</span><span class="lbl">Member Attendance</span></button>
    <button type="button" class="tile blue" data-grid="4"><span class="num">04</span><span class="ico">🧑‍💼</span><span class="lbl">Staff Attendance</span></button>
    <button type="button" class="tile red" data-grid="5"><span class="num">05</span><span class="ico">💳</span><span class="lbl">Pay Fees</span></button>
    <button type="button" class="tile purple" data-grid="6"><span class="num">06</span><span class="ico">🆕</span><span class="lbl">New Admission</span></button>
    <button type="button" class="tile orange" data-grid="7"><span class="num">07</span><span class="ico">📞</span><span class="lbl">Enquiry Desk</span></button>
    <button type="button" class="tile gold" data-grid="8"><span class="num">08</span><span class="ico">💰</span><span class="lbl">Total Collection</span></button>
    <a class="tile red" href="fees-pending.html"><span class="num">09</span><span class="ico">📅</span><span class="lbl">Fees Pending</span></a>
    <a class="tile cyan" href="fees-collection.html"><span class="num">10</span><span class="ico">🧾</span><span class="lbl">Fee Receipts</span></a>
    <a class="tile green" href="attendance.html"><span class="num">11</span><span class="ico">⏱️</span><span class="lbl">Attendance Kiosk</span></a>
    <a class="tile purple" href="staff-salary.html"><span class="num">12</span><span class="ico">💼</span><span class="lbl">Salary &amp; HR</span></a>
    <a class="tile orange" href="manager-portal.html"><span class="num">13</span><span class="ico">👔</span><span class="lbl">Manager Portal</span></a>
    <a class="tile blue" href="team-access-admin.html"><span class="num">14</span><span class="ico">🔑</span><span class="lbl">Employee IDs</span></a>
    <a class="tile gold" href="plans.html"><span class="num">15</span><span class="ico">⬆</span><span class="lbl">Plans &amp; Billing</span></a>
    <a class="tile cyan" href="om-enterprise-suite.html"><span class="num">16</span><span class="ico">🌐</span><span class="lbl">Enterprise Suite</span></a>
    <button type="button" class="tile green" data-grid="17"><span class="num">17</span><span class="ico">📥</span><span class="lbl">Export Excel</span></button>
    <a class="tile purple" href="index.html"><span class="num">18</span><span class="ico">🎛️</span><span class="lbl">Master Control</span></a>
  </div>

  <div class="panel" id="activePanel"></div>
</div>

<script>
(function () {
  var DATA_KEY = "om_app_working_data_v1";

  function readData() {
    try {
      var d = JSON.parse(localStorage.getItem(DATA_KEY) || "{}");
      return (typeof d === "object" && d) ? d : {};
    } catch (e) { return {}; }
  }

  function writeData(d) {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(d)); } catch (e) {}
    if (window.omSync && typeof window.omSync.syncWorkspaceStateToCloud === "function") {
      var fSum = (d.fees || []).reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      window.omSync.syncWorkspaceStateToCloud({
        lightData: d,
        liveCollection: fSum,
        admissionsCount: (d.admissions || []).length,
        attendanceCount: (d.attendance || []).length + (d.staffAtt || []).length
      });
    }
    refreshKpis();
  }

  function refreshKpis() {
    var d = readData();
    var fSum = (d.fees || []).reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
    var admCnt = (d.admissions || []).length + (d.newAdm || []).length;
    var attCnt = (d.attendance || []).length + (d.staffAtt || []).length;
    document.getElementById("kpiColTotal").textContent = "₹" + fSum.toLocaleString("en-IN");
    document.getElementById("kpiAdmTotal").textContent = String(admCnt);
    document.getElementById("kpiAttTotal").textContent = String(attCnt);
    var st = document.getElementById("liveSyncStatus");
    if (st) st.textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function applyLockedModeView() {
    var m = window.omGetLockedMode ? window.omGetLockedMode() : "light";
    var modeLabel = (m === "full") ? "Commercial / Full Mode" : "Light Mode";
    document.getElementById("appModeSub").textContent = "Mode Locked: " + modeLabel + " • 18 Grid Active";
    try {
      var prof = JSON.parse(localStorage.getItem("om_active_gym_profile") || "{}");
      if (prof && prof.gymName) {
        document.getElementById("appHdrTitle").textContent = String(prof.gymName).toUpperCase();
      }
    } catch (e) {}
  }

  function openGridPanel(gNum) {
    var d = readData();
    d.admissions = d.admissions || [];
    d.attendance = d.attendance || [];
    d.staffAtt = d.staffAtt || [];
    d.fees = d.fees || [];
    d.newAdm = d.newAdm || [];
    d.oldPay = d.oldPay || [];
    d.enquiries = d.enquiries || [];

    var box = document.getElementById("activePanel");
    if (gNum === 2) {
      box.innerHTML = '<h3>02. Admission Form</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pAdmName"></div><div class="fg"><label>Mobile *</label><input class="fc" id="pAdmPhone"></div></div>' +
        '<button type="button" class="act-btn gold" id="btnSaveAdm">Save Admission</button>' +
        d.admissions.map(function (x) { return '<div class="rec"><b>' + x.name + '</b> • ' + (x.phone || "-") + '</div>'; }).join("");
      document.getElementById("btnSaveAdm").onclick = function () {
        var n = document.getElementById("pAdmName").value.trim(), p = document.getElementById("pAdmPhone").value.trim();
        if (!n) return alert("Name darj karein.");
        d.admissions.unshift({ name: n, phone: p }); writeData(d); openGridPanel(2);
      };
    } else if (gNum === 3) {
      box.innerHTML = '<h3>03. Member Attendance</h3>' +
        '<div class="fg"><label>Member Name *</label><input class="fc" id="pAttName"></div>' +
        '<button type="button" class="act-btn green" id="btnSaveAtt">Mark Present</button>' +
        d.attendance.map(function (x) { return '<div class="rec"><b>' + x.name + '</b> • ' + x.date + '</div>'; }).join("");
      document.getElementById("btnSaveAtt").onclick = function () {
        var n = document.getElementById("pAttName").value.trim();
        if (!n) return alert("Name darj karein.");
        d.attendance.unshift({ name: n, date: new Date().toISOString().slice(0, 10) }); writeData(d); openGridPanel(3);
      };
    } else if (gNum === 4) {
      box.innerHTML = '<h3>04. Staff Attendance</h3>' +
        '<div class="fg"><label>Employee ID *</label><input class="fc" id="pStfId" placeholder="e.g. STF-1001"></div>' +
        '<button type="button" class="act-btn cyan" id="btnSaveStfAtt">Mark Staff Attendance</button>' +
        d.staffAtt.map(function (x) { return '<div class="rec"><b>' + x.code + '</b> • ' + x.date + '</div>'; }).join("");
      document.getElementById("btnSaveStfAtt").onclick = function () {
        var c = document.getElementById("pStfId").value.trim();
        if (!c) return alert("Employee ID zaroori hai.");
        d.staffAtt.unshift({ code: c, date: new Date().toISOString().slice(0, 10) }); writeData(d); openGridPanel(4);
      };
    } else if (gNum === 5) {
      box.innerHTML = '<h3>05. Pay Fees</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pFeeName"></div><div class="fg"><label>Amount (₹) *</label><input type="number" class="fc" id="pFeeAmt" value="500"></div></div>' +
        '<div class="fg"><label>Type</label><select class="fc" id="pFeeType"><option value="old">Old Customer</option><option value="new">New Admission</option></select></div>' +
        '<button type="button" class="act-btn green" id="btnSaveFee">Collect Fees</button>';
      document.getElementById("btnSaveFee").onclick = function () {
        var n = document.getElementById("pFeeName").value.trim(), a = Number(document.getElementById("pFeeAmt").value || 0), t = document.getElementById("pFeeType").value;
        if (!n || a <= 0) return alert("Name aur amount darj karein.");
        d.fees.unshift({ name: n, amount: a });
        if (t === "new") d.newAdm.unshift({ name: n, amount: a }); else d.oldPay.unshift({ name: n, amount: a });
        writeData(d); openGridPanel(8);
      };
    } else if (gNum === 6) {
      box.innerHTML = '<h3>06. New Admission</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pNaName"></div><div class="fg"><label>Amount (₹) *</label><input type="number" class="fc" id="pNaAmt" value="500"></div></div>' +
        '<button type="button" class="act-btn cyan" id="btnSaveNa">Save New Admission</button>';
      document.getElementById("btnSaveNa").onclick = function () {
        var n = document.getElementById("pNaName").value.trim(), a = Number(document.getElementById("pNaAmt").value || 0);
        if (!n || a <= 0) return alert("Name aur amount darj karein.");
        d.newAdm.unshift({ name: n, amount: a }); d.fees.unshift({ name: n, amount: a });
        writeData(d); openGridPanel(8);
      };
    } else if (gNum === 7) {
      box.innerHTML = '<h3>07. Enquiry Desk</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pEnqName"></div><div class="fg"><label>Mobile *</label><input class="fc" id="pEnqPhone"></div></div>' +
        '<button type="button" class="act-btn gold" id="btnSaveEnq">Save Enquiry</button>' +
        d.enquiries.map(function (x) { return '<div class="rec"><b>' + x.name + '</b> • ' + (x.phone || "-") + '</div>'; }).join("");
      document.getElementById("btnSaveEnq").onclick = function () {
        var n = document.getElementById("pEnqName").value.trim(), p = document.getElementById("pEnqPhone").value.trim();
        if (!n) return alert("Name darj karein.");
        d.enquiries.unshift({ name: n, phone: p }); writeData(d); openGridPanel(7);
      };
    } else if (gNum === 17) {
      if (typeof XLSX !== "undefined") {
        var wb = XLSX.utils.book_new();
        var ws = XLSX.utils.json_to_sheet(d.fees.length ? d.fees : [{ Status: "Empty" }]);
        XLSX.utils.book_append_sheet(wb, ws, "OM_18_Grid");
        XLSX.writeFile(wb, "OM_18_Grid_Export.xlsx");
      }
      box.innerHTML = '<h3>17. Export Excel</h3><div class="rec">Excel export triggered.</div>';
    } else {
      var fSum = d.fees.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      var nSum = d.newAdm.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      var oSum = d.oldPay.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      box.innerHTML = '<h3>01 / 08. OM Live Summary &amp; Total Collection</h3>' +
        '<div class="rec">Fees Earning: <b>₹' + fSum.toLocaleString("en-IN") + '</b></div>' +
        '<div class="rec">New Admission Payment: <b>₹' + nSum.toLocaleString("en-IN") + '</b></div>' +
        '<div class="rec">Old Customer Payment: <b>₹' + oSum.toLocaleString("en-IN") + '</b></div>';
    }
  }

  document.getElementById("omGrid18").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-grid]");
    if (!btn) return;
    openGridPanel(Number(btn.getAttribute("data-grid")));
  });

  document.getElementById("btnSwitchMode").onclick = function () {
    var cur = window.omGetLockedMode ? window.omGetLockedMode() : "light";
    var next = (cur === "light") ? "full" : "light";
    if (window.omSetLockedMode) window.omSetLockedMode(next, true);
    applyLockedModeView();
  };

  document.getElementById("btnLogout").onclick = function () {
    if (!confirm("Logout karna hai?")) return;
    if (window.omClearSessionOnLogout) window.omClearSessionOnLogout();
    location.href = "login.html";
  };

  var taps = 0, tmr = null;
  document.getElementById("appHdrTitle").onclick = function () {
    taps++;
    clearTimeout(tmr);
    tmr = setTimeout(function () { taps = 0; }, 2200);
    if (taps >= 5) { taps = 0; location.href = "prime-master-login.html"; }
  };

  window.addEventListener("om:mode-changed", applyLockedModeView);
  window.addEventListener("om:workspace-realtime", function (ev) {
    var det = ev.detail || {};
    if (det.lightData && typeof det.lightData === "object") {
      try { localStorage.setItem(DATA_KEY, JSON.stringify(det.lightData)); } catch (e) {}
    }
    refreshKpis();
    applyLockedModeView();
  });

  applyLockedModeView();
  refreshKpis();
  openGridPanel(8);
})();
</script>
</body>
</html>
