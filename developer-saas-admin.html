<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Developer SaaS Console — Om Software</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="realtime-sync.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#050814;color:#f8fafc;padding:14px;padding-bottom:60px}
.wrap{max-width:780px;margin:0 auto}
header{background:#0b1226;border:1.5px solid #f5a623;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;color:#ffd166;font-weight:900}
.btn{padding:7px 11px;border-radius:9px;border:none;background:#f5a623;color:#050814;font-size:11.5px;font-weight:900;cursor:pointer;text-decoration:none}
.btn.sec{background:#111b33;color:#38bdf8;border:1px solid #2c3e6b}
.btn.ok{background:#22c55e;color:#050814}
.btn.no{background:#ef4444;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#0b1226;border:1.5px solid #26365e;border-radius:12px;padding:10px}
.kpi span{font-size:10.5px;color:#94a3b8;display:block}
.kpi b{font-size:16px;color:#ffd166;margin-top:2px;display:block}
.card{background:#0b1226;border:1.5px solid #26365e;border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:#22d3ee;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{margin-bottom:8px}
label{display:block;font-size:11px;color:#cbd5e1;font-weight:700;margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:12px}
.item{background:#070c1a;border:1px solid #1e2d52;border-radius:10px;padding:10px;margin-top:8px;font-size:12px}
.msg-notice{margin-top:8px;padding:9px;border-radius:9px;background:rgba(34,197,94,.14);border:1px solid #22c55e;color:#86efac;font-size:11.5px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>DEVELOPER MASTER CONSOLE</h1>
      <p style="font-size:11px;color:#94a3b8">Licences, UTR Approvals, Extra Features (₹10–₹80) &amp; Udhar Due</p>
    </div>
    <div style="display:flex;gap:6px">
      <a href="login.html" class="btn sec">Login Page</a>
      <a href="plans.html" class="btn">Plans &amp; UTR</a>
    </div>
  </header>

  <div class="kpis" id="devKpis"></div>

  <div class="card">
    <h2>Add / Manage Customer &amp; Licence</h2>
    <div class="row2">
      <div class="fg"><label>Gym / Business Name *</label><input id="dcGymName" placeholder="Customer Gym Name"></div>
      <div class="fg"><label>City *</label><input id="dcCity" placeholder="City"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Owner Email / ID *</label><input id="dcEmail" placeholder="owner@gym.com"></div>
      <div class="fg"><label>Plan *</label>
        <select id="dcPlan">
          <option value="Starter (₹99)">Starter (₹99)</option>
          <option value="Growth (₹299)">Growth (₹299)</option>
          <option value="Commercial Pro (₹999)">Commercial Pro (₹999)</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="fg"><label>Validity Days *</label><input type="number" id="dcDays" value="30" min="1"></div>
      <div class="fg"><label>Reset / Set Password</label><input id="dcPass" placeholder="New password if resetting"></div>
    </div>
    <button type="button" class="btn" id="btnAddCustomer">Save &amp; Generate Licence Key</button>
    <div id="devActionBanner"></div>
  </div>

  <div class="card">
    <h2>Pending UTR Plan Requests</h2>
    <div id="pendingUtrList"></div>
  </div>

  <div class="card">
    <h2>Extra Feature Requests (₹10 – ₹80) &amp; Manual Payment Request</h2>
    <div class="row2">
      <div class="fg"><label>Customer Email / Gym *</label><input id="mpCustRef" placeholder="owner@gym.com"></div>
      <div class="fg"><label>Manual Payment Note *</label><input id="mpReason" value="please pay before this feature add"></div>
    </div>
    <div class="row2">
      <div class="fg"><label>Extra Amount (₹10 – ₹80) *</label><input type="number" id="mpAmt" value="40" min="10" max="80"></div>
      <div class="fg"><label>Feature Name</label><input id="mpFeat" value="Custom Report &amp; SMS"></div>
    </div>
    <button type="button" class="btn sec" id="btnSendManualPayReq">Send Manual Payment Request</button>
    <div id="extraFeatReqList"></div>
  </div>

  <div class="card">
    <h2>Customers, Licence Keys, Active Features &amp; Udhar Due</h2>
    <div id="customersList"></div>
  </div>
</div>

<script>
(function () {
  function genKey() {
    var r = function () { return Math.random().toString(36).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4).padEnd(4, "X"); };
    return "OM-" + r() + "-" + r() + "-" + r();
  }

  function addDaysIso(days) {
    var d = new Date(Date.now() + Number(days || 30) * 86400000);
    return d.toISOString().slice(0, 10);
  }

  function planFeatures(plan) {
    if (String(plan).indexOf("999") !== -1) return ["18-Grid Full", "Multi-Branch", "Payroll & HR", "Live Cloud Sync", "Excel Import/Export"];
    if (String(plan).indexOf("299") !== -1) return ["18-Grid Core", "Attendance & Fees", "Staff IDs", "Excel Import/Export"];
    return ["18-Grid Light", "Admission & Fees", "Attendance"];
  }

  function renderAll() {
    var s = window.omSync ? window.omSync.readSaas() : {};
    s.customers = s.customers || [];
    s.pendingRequests = s.pendingRequests || [];
    s.extraFeatureRequests = s.extraFeatureRequests || [];
    s.cityStats = s.cityStats || {};

    var udharTotal = Object.keys(s.udharDueByCustomer || {}).reduce(function (acc, k) {
      return acc + Number((s.udharDueByCustomer || {})[k] || 0);
    }, 0);

    var topCity = "None (0)";
    var topCnt = 0;
    Object.keys(s.cityStats).forEach(function (c) {
      if (Number(s.cityStats[c] || 0) > topCnt) {
        topCnt = Number(s.cityStats[c] || 0);
        topCity = c + " (" + topCnt + ")";
      }
    });

    document.getElementById("devKpis").innerHTML =
      '<div class="kpi"><span>App Downloads</span><b>' + Number(s.downloadsCount || 0) + '</b></div>' +
      '<div class="kpi"><span>Plans Purchased</span><b>' + Number(s.purchasedCount || 0) + '</b></div>' +
      '<div class="kpi"><span>Purchase Income</span><b>₹' + Number(s.appPurchaseIncome || 0).toLocaleString("en-IN") + '</b></div>' +
      '<div class="kpi"><span>Renewals</span><b>' + Number(s.renewalCount || 0) + '</b></div>' +
      '<div class="kpi"><span>Pending Requests</span><b>' + Number(s.pendingRequests.length || 0) + '</b></div>' +
      '<div class="kpi"><span>Top City</span><b>' + topCity + '</b></div>' +
      '<div class="kpi"><span>Customer Udhar Due</span><b>₹' + udharTotal.toLocaleString("en-IN") + '</b></div>' +
      '<div class="kpi"><span>Active Licences</span><b>' + Number(s.customers.length || 0) + '</b></div>';

    // Pending UTR requests
    var utrBox = document.getElementById("pendingUtrList");
    utrBox.innerHTML = s.pendingRequests.length ? s.pendingRequests.map(function (req, idx) {
      return '<div class="item">' +
        '<b>' + (req.gymName || "Gym") + '</b> (' + (req.email || "-") + ') • City: ' + (req.city || "-") + '<br>' +
        'Plan: <b>' + req.plan + '</b> • Amount: <b>₹' + Number(req.amount || 0) + '</b> • UTR: <b>' + (req.utr || "-") + '</b>' +
        (req.utrProofName ? ' • Proof: ' + req.utrProofName : '') +
        '<div style="margin-top:8px;display:flex;gap:6px">' +
          '<button type="button" class="btn ok" data-accept-utr="' + idx + '">Accept &amp; Activate</button>' +
          '<button type="button" class="btn no" data-reject-utr="' + idx + '">Reject</button>' +
        '</div>' +
      '</div>';
    }).join("") : '<div class="item" style="color:#94a3b8">No pending UTR requests (0).</div>';

    // Extra feature requests
    var efBox = document.getElementById("extraFeatReqList");
    efBox.innerHTML = s.extraFeatureRequests.length ? s.extraFeatureRequests.map(function (er, idx) {
      return '<div class="item">' +
        '<b>' + (er.customerRef || "Customer") + '</b> • Feature: <b>' + er.featureName + '</b> • Price: <b>₹' + Number(er.price || 0) + '</b> • Status: <b>' + er.status + '</b>' +
        (er.manualNote ? '<div style="color:#ffd166;margin-top:3px">Note: ' + er.manualNote + '</div>' : '') +
        (er.status === "Pending" ? '<div style="margin-top:6px"><button type="button" class="btn ok" data-approve-ef="' + idx + '">Approve &amp; Add to Udhar</button></div>' : '') +
      '</div>';
    }).join("") : '<div class="item" style="color:#94a3b8">No extra feature requests (0).</div>';

    // Customers list
    var cBox = document.getElementById("customersList");
    cBox.innerHTML = s.customers.length ? s.customers.map(function (c) {
      var due = Number((s.udharDueByCustomer || {})[c.email] || 0);
      return '<div class="item">' +
        '<div style="display:flex;justify-content:space-between"><b>' + c.gymName + '</b><span style="color:#22d3ee">' + c.licenceKey + '</span></div>' +
        '<div style="color:#94a3b8;margin-top:3px">Email: ' + c.email + ' • City: ' + (c.city || "-") + ' • Plan: <b>' + c.plan + '</b></div>' +
        '<div style="margin-top:3px">Validity: <b>' + c.startDate + '</b> to <b>' + c.endDate + '</b> • Features: ' + (c.features || []).join(", ") + '</div>' +
        '<div style="margin-top:4px;color:#fca5a5"><b>Udhar / Pending to Pay: ₹' + due.toLocaleString("en-IN") + '</b></div>' +
      '</div>';
    }).join("") : '<div class="item" style="color:#94a3b8">No customers yet (0).</div>';
  }

  document.getElementById("btnAddCustomer").addEventListener("click", function () {
    var gymName = document.getElementById("dcGymName").value.trim();
    var city = document.getElementById("dcCity").value.trim() || "General";
    var email = document.getElementById("dcEmail").value.trim().toLowerCase();
    var plan = document.getElementById("dcPlan").value;
    var days = Number(document.getElementById("dcDays").value || 30);
    var newPass = document.getElementById("dcPass").value.trim();
    if (!gymName || !email) return alert("Gym Name aur Email zaroori hai.");

    var s = window.omSync.readSaas();
    var key = genKey();
    var startDate = new Date().toISOString().slice(0, 10);
    var endDate = addDaysIso(days);
    var feats = planFeatures(plan);

    var rec = {
      gymName: gymName,
      city: city,
      email: email,
      plan: plan,
      licenceKey: key,
      startDate: startDate,
      endDate: endDate,
      features: feats,
      passwordReset: newPass || undefined
    };
    s.customers.unshift(rec);
    s.purchasedCount = Number(s.purchasedCount || 0) + 1;
    s.cityStats[city] = Number(s.cityStats[city] || 0) + 1;
    window.omSync.writeSaas(s);

    document.getElementById("devActionBanner").innerHTML =
      '<div class="msg-notice">Your plan has been activated — Licence Key: ' + key + ' • Valid: ' + startDate + ' to ' + endDate + ' • Plan: ' + plan + '</div>';
    renderAll();
  });

  document.getElementById("pendingUtrList").addEventListener("click", function (ev) {
    var accBtn = ev.target.closest("[data-accept-utr]");
    var rejBtn = ev.target.closest("[data-reject-utr]");
    var s = window.omSync.readSaas();
    if (accBtn) {
      var idx = Number(accBtn.getAttribute("data-accept-utr"));
      var req = s.pendingRequests[idx];
      if (!req) return;
      var key = genKey();
      var startDate = new Date().toISOString().slice(0, 10);
      var endDate = addDaysIso(req.days || 30);
      var feats = planFeatures(req.plan);
      s.customers.unshift({
        gymName: req.gymName || "Gym",
        city: req.city || "General",
        email: req.email || "owner@gym.com",
        plan: req.plan,
        licenceKey: key,
        startDate: startDate,
        endDate: endDate,
        features: feats
      });
      s.purchasedCount = Number(s.purchasedCount || 0) + 1;
      s.appPurchaseIncome = Number(s.appPurchaseIncome || 0) + Number(req.amount || 0);
      if (req.isRenewal) s.renewalCount = Number(s.renewalCount || 0) + 1;
      var cCity = req.city || "General";
      s.cityStats[cCity] = Number(s.cityStats[cCity] || 0) + 1;
      s.pendingRequests.splice(idx, 1);
      window.omSync.writeSaas(s);

      document.getElementById("devActionBanner").innerHTML =
        '<div class="msg-notice">Your plan has been activated! Licence Key: <b>' + key + '</b> • Valid: <b>' + startDate + '</b> to <b>' + endDate + '</b> • Plan: <b>' + req.plan + '</b></div>';
      renderAll();
    } else if (rejBtn) {
      var rIdx = Number(rejBtn.getAttribute("data-reject-utr"));
      s.pendingRequests.splice(rIdx, 1);
      window.omSync.writeSaas(s);
      renderAll();
    }
  });

  document.getElementById("btnSendManualPayReq").addEventListener("click", function () {
    var ref = document.getElementById("mpCustRef").value.trim();
    var note = document.getElementById("mpReason").value.trim() || "please pay before this feature add";
    var amt = Math.min(80, Math.max(10, Number(document.getElementById("mpAmt").value || 20)));
    var feat = document.getElementById("mpFeat").value.trim() || "Extra Add-On Feature";
    if (!ref) return alert("Customer Email / Gym darj karein.");

    var s = window.omSync.readSaas();
    s.extraFeatureRequests.unshift({
      customerRef: ref,
      featureName: feat,
      price: amt,
      manualNote: note,
      status: "Pending"
    });
    window.omSync.writeSaas(s);
    renderAll();
  });

  document.getElementById("extraFeatReqList").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-approve-ef]");
    if (!btn) return;
    var idx = Number(btn.getAttribute("data-approve-ef"));
    var s = window.omSync.readSaas();
    var item = s.extraFeatureRequests[idx];
    if (!item) return;
    item.status = "Approved";
    var price = Math.min(80, Math.max(10, Number(item.price || 10)));
    s.udharDueByCustomer = s.udharDueByCustomer || {};
    var k = String(item.customerRef || "customer").toLowerCase();
    s.udharDueByCustomer[k] = Number(s.udharDueByCustomer[k] || 0) + price;

    // Also attach feature to matching customer if found
    s.customers.forEach(function (c) {
      if (String(c.email || "").toLowerCase() === k || String(c.gymName || "").toLowerCase() === k) {
        c.features = c.features || [];
        if (c.features.indexOf(item.featureName) === -1) c.features.push(item.featureName);
      }
    });

    window.omSync.writeSaas(s);
    renderAll();
  });

  window.addEventListener("om:saas-synced", renderAll);
  renderAll();
})();
</script>
</body>
</html>
