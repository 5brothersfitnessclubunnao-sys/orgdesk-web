<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Admin Console &bull; Customer Approvals</title>
  <style>
    :root {
      --bg: #050814; --card: #0b1226; --border: rgba(255,255,255,0.12);
      --gold: #f5a623; --gold-bright: #ffd166; --cyan: #22d3ee; --emerald: #34d399;
      --rose: #fb7185; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 18px 14px 80px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-bottom: 16px; }
    .item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; font-size: 12.5px; }
    button.btn-ok { background: linear-gradient(135deg, var(--emerald), #059669); color: #050814; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 800; cursor: pointer; }
    button.btn-no { background: rgba(251,113,133,0.18); color: var(--rose); border: 1px solid var(--rose); border-radius: 8px; padding: 8px 14px; font-weight: 800; cursor: pointer; }
    button.btn-res { background: #070d1d; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div style="font-size:11px;color:var(--cyan);font-weight:800">DEVELOPER MASTER CONSOLE</div>
        <h1 style="font-size:18px;font-weight:900">Pending Customer Payments &amp; Accounts</h1>
      </div>
      <div><a href="index.html" style="color:var(--gold);text-decoration:none;font-weight:800">← Dashboard</a></div>
    </div>

    <div id="paymentQueue"></div>
  </div>

  <script>
    function getList() {
      try { return JSON.parse(localStorage.getItem("om_plan_customers_v1") || "[]"); } catch(e) { return []; }
    }

    function processReq(idx, isApprove) {
      const list = getList();
      const item = list[idx];
      if (!item) return;

      if (isApprove) {
        const planObj = {
          name: item.planName,
          amount: item.planAmount,
          status: "active",
          licenseKey: item.licenseKey,
          utr: item.utr,
          activatedAt: new Date().toISOString()
        };
        localStorage.setItem("om_active_subscription_plan", JSON.stringify(planObj));
        localStorage.setItem("om_plan_activated_notif_v1", JSON.stringify({ active: true, planName: item.planName, licenseKey: item.licenseKey }));
        alert("This Member has been purchased " + item.planName + " — Plan Successfully Activated!");
      } else {
        alert("Payment Request Declined!");
      }

      list.splice(idx, 1);
      localStorage.setItem("om_plan_customers_v1", JSON.stringify(list));
      renderQueue();
    }

    function resetCustPass(email) {
      const newPass = prompt("Enter Master Password for Customer (" + email + "):", "gym12345");
      if (!newPass) return;
      try {
        let own = JSON.parse(localStorage.getItem("om_owner_account_v1") || "null");
        if (own) {
          own.password = newPass;
          localStorage.setItem("om_owner_account_v1", JSON.stringify(own));
          alert("Password updated to: " + newPass + " (Notified to Customer & Developer)");
        }
      } catch(e) {}
    }

    function renderQueue() {
      const list = getList();
      const box = document.getElementById("paymentQueue");
      if (!list.length) {
        box.innerHTML = '<div class="item" style="color:var(--muted);text-align:center">Koi pending payment request nahi hai.</div>';
        return;
      }

      box.innerHTML = list.map((c, i) => `
        <div class="item" style="border-color:var(--gold)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <b>${c.gymName}</b>
            <span style="color:var(--emerald);font-weight:900">This Member has been purchased ${c.planName} (₹${c.paidNow})</span>
          </div>
          <div style="margin:6px 0;font-size:12px">
            📞 Mobile: <b>${c.phone}</b> &bull; ✉️ Registered Email: <b style="color:var(--cyan)">${c.email}</b>
          </div>
          <div style="font-size:12px">
            🧾 UTR: <b>${c.utr}</b> &bull; 🔑 Generated Key: <b>${c.licenseKey}</b>
          </div>
          ${c.screenshotData ? `<div style="margin-top:6px"><img src="${c.screenshotData}" style="width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--emerald)"></div>` : ''}
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button class="btn-ok" onclick="processReq(${i}, true)">✅ Approve &amp; Activate Plan</button>
            <button class="btn-no" onclick="processReq(${i}, false)">✕ Decline</button>
            <button class="btn-res" onclick="resetCustPass('${c.email}')">🔑 Change Customer Password</button>
          </div>
        </div>
      `).join('');
    }

    window.addEventListener("DOMContentLoaded", renderQueue);
  </script>
</body>
</html>
