<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Form</title>
<style>
:root{--bg:#0e0d0b;--card:#1a1814;--line:#322d22;--gold:#f5b700;--ok:#3ddc84;--bad:#ff5c5c;--tx:#f4efe4;--mu:#a49b86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:30px}
.w{max-width:560px;margin:0 auto;padding:12px}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
label{display:block;color:var(--mu);font-size:13px;margin-top:8px}input,select,textarea{width:100%;padding:11px;margin:4px 0;background:#100f0c;color:var(--tx);border:1px solid var(--line);border-radius:8px;font:inherit}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}
button{background:var(--gold);color:#111;border:0;border-radius:8px;padding:11px 14px;font-weight:700;font:inherit;font-weight:700;cursor:pointer}button.g{background:#26221a;color:var(--tx);border:1px solid var(--line)}
.r{display:flex;gap:8px}.r>*{flex:1}.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:2px solid var(--gold)}
.hd img{width:42px;height:42px;border-radius:8px;object-fit:cover}.hd b{flex:1}.dots{display:flex;gap:4px;margin:10px 0}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--gold)}
h2{color:var(--gold);font-size:17px;margin:6px 0}img.pv{max-width:100%;max-height:200px;border-radius:8px;margin:6px 0}
.sig{font:34px "Brush Script MT","Segoe Script","Lucida Handwriting",cursive;color:#fff;border-bottom:2px solid var(--gold);padding:8px 4px;min-height:56px}
pre{white-space:pre-wrap;font:13px/1.5 inherit;color:var(--tx);margin:4px 0}.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:800;color:var(--gold)}
#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;background:#fff;color:#000;padding:16px;font:14px/1.5 sans-serif}#pr td{padding:4px 8px;border:1px solid #999}#pr table{border-collapse:collapse;width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script></head>
<body><div id="app"><div class="w mu">Loading…</div></div><div id="pr"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyC5gfHQbzq67Bzk5K03vy3w3B4FnyC0oLs",authDomain:"gym-manager-app-76650.firebaseapp.com",projectId:"gym-manager-app-76650",storageBucket:"gym-manager-app-76650.firebasestorage.app",messagingSenderId:"837291846592",appId:"1:837291846592:web:2c4a81d694e0d643b8b625"});
const auth=firebase.auth(),db=firebase.firestore(),$=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const DEF={plans:[{n:'1 महीना',m:1,f:500},{n:'3 महीने',m:3,f:1400},{n:'6 महीने',m:6,f:2600},{n:'1 साल',m:12,f:4500}],slots:['Morning','Evening','Full Day'],cats:['Regular','Student','Couple / Family','Personal Training'],
terms:'1. एक बार जमा हुई फीस वापस नहीं होगी।\n2. जिम के नियम और समय का पालन करना ज़रूरी है।\n3. वर्कआउट के दौरान किसी चोट की ज़िम्मेदारी सदस्य की स्वयं की होगी।\n4. जिम के सामान को नुकसान होने पर भरपाई करनी होगी।\n5. फॉर्म में दी गई सारी जानकारी सही है।'};
let U,G={},C=DEF,F={joined:today(),plan:0,mode:'Cash'},P={},st=0,cfgOpen=false,last=null;
const STEPS=['प्लान','विवरण','स्वास्थ्य','नियम','भुगतान'],col=n=>db.collection('gyms').doc(U.uid).collection(n);
const V=id=>esc(F[id]??'');
const I=(id,l,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${V(id)}" ${x}>`;
const S=(id,l,o)=>`<label>${l}</label><select id="${id}">${o.map(x=>{const v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}" ${String(F[id]??'')===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const K=(id,l)=>`<label class="ck"><input type="checkbox" id="${id}" ${F[id]?'checked':''}> ${l}</label>`;
const IMG=(k,l,q)=>`<label>${l}${q?' *':''}</label><img class="pv" id="p_${k}" src="${P[k]||''}" style="display:${P[k]?'block':'none'}"><div class="r"><button class="g" onclick="pick('${k}',1)">📷 Live</button><button class="g" onclick="pick('${k}',0)">🖼️ Gallery</button></div>`;
function collect(){document.querySelectorAll('#v [id]').forEach(e=>{if(e.tagName=='INPUT'||e.tagName=='SELECT'||e.tagName=='TEXTAREA')F[e.id]=e.type=='checkbox'?e.checked:e.value})}
// ---------- photo: chunte hi chhota karke rakho ----------
function rs(file,mw,mh,cb){const fin=(s,w0,h0,cl)=>{let o='';try{let w=w0,h=h0;if(w>mw||h>mh){const r=Math.min(mw/w,mh/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(s,0,0,w,h);o=c.toDataURL('image/jpeg',.72)}catch(e){}try{cl&&cl()}catch(e){}return o};
 const raw=()=>{const r=new FileReader();r.onload=e=>cb(e.target.result);r.onerror=()=>cb('');r.readAsDataURL(file)};
 const img=()=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const o=fin(i,i.naturalWidth,i.naturalHeight,()=>URL.revokeObjectURL(u));o?cb(o):raw()};i.onerror=()=>raw();i.src=u};
 window.createImageBitmap?createImageBitmap(file,{imageOrientation:'from-image'}).then(b=>{const o=fin(b,b.width,b.height,()=>b.close());o?cb(o):img()}).catch(img):img()}
function pick(k,live){const i=document.createElement('input');i.type='file';i.accept='image/*';if(live)i.capture=k=='photo'?'user':'environment';
 i.onchange=()=>{const f=i.files[0];if(!f)return;rs(f,k=='photo'?480:800,k=='photo'?640:800,u=>{if(!u)return alert('यह फोटो पढ़ी नहीं गई, दूसरी चुनें।');P[k]=u;const e=$('#p_'+k);e.src=u;e.style.display='block'})};i.click()}
// ---------- screens ----------
function draw(){const body=[plan,pers,hlth,rules,pay][st]();
 A.innerHTML=`<div class="hd">${G.logo?`<img src="${G.logo}">`:'🏋️'}<b>${esc(G.name||'Gym')}<div class="mu">${esc(G.addr||'')}</div></b><button class="g" onclick="location.href='index.html'">🏠</button><button class="g" onclick="cfgOpen=!cfgOpen;draw()">⚙</button></div>
 <div class="w">${cfgOpen?cfgV():''}<div class="dots">${STEPS.map((x,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><h2>${st+1}/5 · ${STEPS[st]}</h2><div class="c" id="v">${body}</div>
 <div class="r">${st?`<button class="g" onclick="nav(-1)">⬅ पीछे</button>`:''}${st<4?`<button onclick="nav(1)">आगे ➔</button>`:`<button id="go" onclick="submit()">✅ फॉर्म जमा करें</button>`}</div></div>`;
 if(st==4)calc()}
const plan=()=>`<h2>नई सदस्यता</h2>${I('joined','📅 प्रवेश तिथि *','date')}${S('cat','मेम्बरशिप श्रेणी',C.cats)}${S('slot','बैच / समय',C.slots)}${S('plan','योजना अवधि (Plan)',C.plans.map((p,i)=>[i,`${p.n} — ₹${p.f}`]))}`;
const pers=()=>`${I('name','पूरा नाम (Full Name) *')}${I('father','पिता / माता / पति का नाम *')}${I('dob','जन्म तिथि (DOB)','date','onchange="agef()"')}${I('age','आयु (Age)','number')}${S('gender','लिंग',['पुरुष','महिला','अन्य'])}${I('occ','व्यवसाय (Occupation)')}${I('phone','मोबाइल नंबर (WhatsApp) *','tel','maxlength=10')}${I('pin','पिनकोड','tel')}${I('addr','पूरा पता / गांव / मोहल्ला *')}${I('emn','आपातकालीन संपर्क का नाम')}${I('emp','आपातकालीन संपर्क नंबर','tel')}${IMG('photo','सदस्य की फोटो',1)}${IMG('idf','ID (आगे का भाग)')}${IMG('idb','ID (पीछे का भाग)')}`;
const hlth=()=>`${I('ht','ऊंचाई (सेमी)','number')}${I('wt','वजन (किग्रा)','number')}${S('bg','ब्लड ग्रुप',['पता नहीं','A+','A-','B+','B-','O+','O-','AB+','AB-'])}${S('goal','लक्ष्य (Goal)',['फिटनेस','वजन घटाना','वजन बढ़ाना / मसल','स्ट्रेंथ','अन्य'])}<label>स्वास्थ्य समस्या</label>${[['h0','✅ कोई समस्या नहीं (Fit)'],['h1','हाई / लो बीपी'],['h2','शुगर (Diabetes)'],['h3','दिल की बीमारी'],['h4','अस्थमा / सांस'],['h5','कमर / घुटने का दर्द'],['h6','पुरानी चोट / ऑपरेशन']].map(x=>K(x[0],x[1])).join('')}${I('hx','अन्य बीमारी / दवा (अगर कोई)')}<hr style="border-color:var(--line)">${K('hdec','मैंने स्वास्थ्य घोषणा पढ़ ली है; जानकारी सही है। *')}`;
const rules=()=>{if(F.sign==null||F.signAuto!==F.name){F.sign=F.name||'';F.signAuto=F.name}return`<pre>${esc(C.terms)}</pre>${K('agree','मैंने सभी नियम व शर्तें पढ़कर स्वीकार की हैं *')}<label>हस्ताक्षर (नाम से अपने आप भरा — चाहें तो बदलें)</label><input id="sign" value="${V('sign')}" oninput="$('#sg').textContent=this.value"><div class="sig" id="sg">${V('sign')}</div><div class="mu">दिनांक: ${today()} · सदस्य: ${V('name')}</div>`};
const pay=()=>{const p=C.plans[+F.plan||0];if(F.fe!==F.plan){F.fe=F.plan;F.fee=p.f;F.disc=0;F.paid=p.f}
 return`<div class="mu">${esc(p.n)} · ${F.joined} से ${addM(F.joined,p.m)} तक</div>${I('fee','प्लान फीस ₹','number','oninput="calc()"')}${I('disc','छूट (Discount) ₹','number','oninput="calc()"')}<div class="c r"><div><div class="mu">देय राशि</div><div class="big" id="net"></div></div><div><div class="mu">बकाया</div><div class="big" id="due"></div></div></div>${I('paid','अभी जमा राशि ₹','number','oninput="calc()"')}${S('mode','भुगतान का तरीका',['Cash','Google Pay','PhonePe','Paytm','Other UPI','Card']).replace('<select','<select onchange="calc()"')}<div id="ut">${I('utr','UTR / UPI Reference नंबर')}</div><div id="pm">${I('promise','बकाया कब जमा करेंगे? (तारीख) *','date')}</div>`};
function calc(){const f=+$('#fee').value||0,d=+$('#disc').value||0,n=Math.max(0,f-d),p=Math.min(n,+$('#paid').value||0);$('#net').textContent='₹'+n;$('#due').textContent='₹'+(n-p);$('#due').style.color=n-p?'var(--bad)':'var(--ok)';$('#ut').style.display=$('#mode').value=='Cash'?'none':'block';$('#pm').style.display=n-p>0?'block':'none'}
function agef(){const d=$('#dob').value;if(d){const a=Math.floor((Date.now()-new Date(d))/31557600000);$('#age').value=a>0?a:''}}
function nav(d){collect();if(d>0){const m=[];
  if(st==1){if(!F.name)m.push('नाम');if(!F.father)m.push('पिता का नाम');if(!/^\d{10}$/.test(F.phone||''))m.push('10 अंक का मोबाइल');if(!F.addr)m.push('पता');if(!P.photo)m.push('सदस्य की फोटो')}
  if(st==2&&!F.hdec)m.push('स्वास्थ्य घोषणा पर टिक');if(st==3&&!F.agree)m.push('नियमों पर टिक');
  if(m.length)return alert('ये भरना ज़रूरी है: '+m.join(', '))}
 st+=d;draw();scrollTo(0,0)}
// ---------- submit ----------
async function nextReg(){const ref=db.collection('gyms').doc(U.uid),n=await db.runTransaction(async t=>{const x=(((await t.get(ref)).data()||{}).regSeq||0)+1;t.set(ref,{regSeq:x},{merge:true});return x});return((G.name||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'GYM')+'-'+String(n).padStart(4,'0')}
async function submit(){collect();const b=$('#go');
 const pl=C.plans[+F.plan||0],net=Math.max(0,(+F.fee||0)-(+F.disc||0)),paid=Math.min(net,+F.paid||0),due=net-paid;
 if(due>0&&!F.promise)return alert('बकाया है — जमा करने की तारीख डालिए');
 b.disabled=true;b.textContent='⏳ सेव हो रहा है…';
 try{const ex=(await col('members').where('phone','==',F.phone).limit(1).get()).docs[0];let mid,reg,till;
  if(ex){const o=ex.data();if(!confirm(o.name+' पहले से सदस्य है। Renew / Rejoin करें?')){b.disabled=false;b.textContent='✅ फॉर्म जमा करें';return}
   mid=ex.id;reg=o.reg||'';till=addM(o.validTill>F.joined?o.validTill:F.joined,pl.m);await col('members').doc(mid).set({validTill:till,plan:pl.m,fee:+F.fee,slot:F.slot,cat:F.cat,renewed:today(),due,promise:F.promise||''},{merge:true})}
  else{reg=await nextReg();till=addM(F.joined,pl.m);const r=col('members').doc();mid=r.id;const h=['h0','h1','h2','h3','h4','h5','h6'].filter(k=>F[k]).map(k=>$?['Fit','BP','Sugar','Heart','Asthma','Back/Knee','Injury'][+k[1]]:'');
   await r.set({name:F.name,phone:F.phone,father:F.father,joined:F.joined,plan:pl.m,validTill:till,fee:+F.fee,slot:F.slot,reg,cat:F.cat,gender:F.gender,dob:F.dob||'',age:+F.age||0,occ:F.occ||'',pin:F.pin||'',addr:F.addr,emn:F.emn||'',emp:F.emp||'',blood:F.bg,height:+F.ht||0,weight:+F.wt||0,health:h,healthNote:F.hx||'',goal:F.goal,sign:F.sign||F.name,agreed:true,due,promise:F.promise||'',created:today()});
   await col('photos').doc(mid).set({photo:P.photo||'',idf:P.idf||'',idb:P.idb||''})}
  if(paid>0)await col('fees').add({date:today(),mid,name:F.name,amt:paid,mode:F.mode,utr:F.utr||''});
  last={reg,till,pl,net,paid,due,f:{...F},ph:P.photo||''};done()}
 catch(e){alert('सेव नहीं हुआ: '+e.message);b.disabled=false;b.textContent='✅ फॉर्म जमा करें'}}
function done(){const l=last;A.innerHTML=`<div class="w"><div class="c" style="text-align:center"><h2>🎉 धन्यवाद!</h2><div class="big">${esc(l.reg)}</div><p>${esc(l.f.name)} का एडमिशन हो गया।<br><span class="mu">वैधता: ${l.till} तक</span></p><p class="mu">यह सदस्य अपने आप Members, Attendance और Fees Register में जुड़ गया।</p><button style="width:100%" onclick="prn()">🖨️ फॉर्म / रसीद प्रिंट (PDF)</button><br><br><button class="g" style="width:100%" onclick="F={joined:today(),plan:0,mode:'Cash'};P={};st=0;draw()">➕ नया फॉर्म</button><br><br><button class="g" style="width:100%" onclick="location.href='index.html'">🏠 Home</button></div></div>`}
function prn(){const l=last,f=l.f,r=(a,b)=>`<tr><td><b>${a}</b></td><td>${esc(b)}</td></tr>`;
 $('#pr').innerHTML=`<h2 style="margin:0">${esc(G.name)}</h2><div>${esc(G.addr||'')} ${esc(G.phone||'')}</div><h3>सदस्यता फॉर्म / रसीद — ${esc(l.reg)}</h3>${l.ph?`<img src="${l.ph}" style="float:right;width:110px;border:1px solid #999">`:''}<table>${r('नाम',f.name)+r('पिता/माता/पति',f.father)+r('मोबाइल',f.phone)+r('जन्म तिथि / आयु',(f.dob||'-')+' / '+(f.age||'-'))+r('पता',f.addr)+r('श्रेणी / बैच',f.cat+' / '+f.slot)+r('प्लान',l.pl.n+' ('+f.joined+' से '+l.till+')')+r('ब्लड ग्रुप / लक्ष्य',f.bg+' / '+f.goal)+r('फीस / छूट',`₹${f.fee} / ₹${f.disc||0}`)+r('जमा / बकाया',`₹${l.paid} (${f.mode}${f.utr?' '+f.utr:''}) / ₹${l.due}`)}</table><pre style="color:#000">${esc(C.terms)}</pre><p>सदस्य के हस्ताक्षर: <span style="font:30px cursive">${esc(f.sign||f.name)}</span> &nbsp; दिनांक: ${today()}</p><p>अधिकृत हस्ताक्षर: ____________</p>`;print()}
// ---------- gym settings (plans / slots / terms) ----------
const cfgV=()=>`<div class="c"><b>⚙ जिम सेटिंग</b><label>प्लान (हर लाइन: नाम, महीने, फीस)</label><textarea id="cp" rows="5">${esc(C.plans.map(p=>p.n+', '+p.m+', '+p.f).join('\n'))}</textarea><label>बैच (comma से)</label><input id="cs" value="${esc(C.slots.join(', '))}"><label>श्रेणियां (comma से)</label><input id="cc" value="${esc(C.cats.join(', '))}"><label>नियम व शर्तें</label><textarea id="ct" rows="6">${esc(C.terms)}</textarea><button style="width:100%;margin-top:8px" onclick="saveCfg()">सेव करें</button></div>`;
async function saveCfg(){const pl=$('#cp').value.split('\n').map(x=>x.split(',')).filter(x=>x.length>=3).map(x=>({n:x[0].trim(),m:+x[1]||1,f:+x[2]||0}));if(!pl.length)return alert('कम से कम एक प्लान लिखें: नाम, महीने, फीस');
 const sp=s=>s.split(',').map(x=>x.trim()).filter(Boolean);C={plans:pl,slots:sp($('#cs').value),cats:sp($('#cc').value),terms:$('#ct').value};
 try{await db.collection('gyms').doc(U.uid).set({cfg:C},{merge:true});cfgOpen=false;F.plan=0;F.fe=null;draw()}catch(e){alert(e.message)}}
auth.onAuthStateChanged(async u=>{if(!u){location.href='index.html';return}U=u;
 try{G=(await db.collection('gyms').doc(u.uid).get()).data()||{};C=Object.assign({},DEF,G.cfg||{});draw()}catch(e){A.innerHTML='<div class="w"><div class="c" style="color:var(--bad)">'+esc(e.message)+'</div><button onclick="location.reload()">दोबारा</button></div>'}});
</script></body></html>
