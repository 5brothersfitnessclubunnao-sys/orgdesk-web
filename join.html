<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission &amp; Joining Form</title>
  <style>
    :root{--bg:#0b0b0d;--card:#151519;--border:#2c2c36;--ac:#ffcc00;--tx:#f4f4f8;--mut:#9a9aa8;--ok:#2ecc71}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Arial,sans-serif;padding:14px}
    .wrap{max-width:520px;margin:0 auto;background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:16px}
    h2{margin:0;color:var(--ac);font-size:18px;font-weight:900}
    .sub{color:var(--mut);font-size:11px;margin:4px 0 12px}
    .field{margin-bottom:10px}
    label{display:block;font-size:11px;color:#ccc;margin-bottom:4px;font-weight:700}
    input,select{width:100%;background:#0b0b0e;border:1.5px solid var(--border);color:#fff;padding:9px 11px;border-radius:8px;font-size:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{width:100%;background:var(--ac);color:#000;border:0;border-radius:8px;padding:11px;font-weight:900;font-size:13px;cursor:pointer;margin-top:6px}
    .btn-top{background:#222;color:var(--ac);border:1px solid var(--ac);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}
    .card-rec{background:#0e0e13;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <h2>Admission &amp; Joining Form</h2>
    <a href="index.html" class="btn-top">Dashboard</a>
  </div>
  <p class="sub">Har Admission aur Joining Form save hota hai. Naam ya Mobile se search karke details dekhein (delete lock enabled).</p>

  <div class="field">
    <label>Search Saved Admission / Joining Form (Naam ya Mobile)</label>
    <input type="text" id="admSearchIn" oninput="renderSavedAdmissions()" placeholder="Type member name or mobile...">
    <div id="admSearchList"></div>
  </div>

  <form id="joinAdmForm" onsubmit="saveAdmissionRecord(event)">
    <div class="row">
      <div class="field">
        <label>Form Type *</label>
        <select id="fType">
          <option value="Admission Form">Admission Form</option>
          <option value="Joining Form">Joining Form</option>
        </select>
      </div>
      <div class="field">
        <label>Joining Date *</label>
        <input type="date" id="fJoinDate" required>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Full Name *</label>
        <input type="text" id="fName" required placeholder="Member name">
      </div>
      <div class="field">
        <label>Mobile Number *</label>
        <input type="tel" id="fPhone" required maxlength="10" placeholder="10-digit mobile">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Parent / Guardian Name</label>
        <input type="text" id="fGuardian" placeholder="Father / Guardian">
      </div>
      <div class="field">
        <label>Plan &amp; Fee (₹) *</label>
        <input type="text" id="fPlan" required placeholder="e.g. 1 Month - ₹500">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Fee Paid (₹)</label>
        <input type="number" id="fPaid" value="500">
      </div>
      <div class="field">
        <label>Due Amount (₹)</label>
        <input type="number" id="fDue" value="0">
      </div>
    </div>

    <button type="submit" class="btn">Save Admission / Joining Record</button>
  </form>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const getOrgId = () => {
    try { return JSON.parse(localStorage.getItem("om_org_profile") || localStorage.getItem("om_last_org_profile") || "{}").orgId || ""; } catch (e) { return ""; }
  };
  const readList = () => {
    try { return JSON.parse(localStorage.getItem("5bfc_admissions") || "[]") || []; } catch (e) { return []; }
  };
  const writeList = arr => {
    try {
      localStorage.setItem("5bfc_admissions", JSON.stringify(arr));
      localStorage.setItem("5BFC_MEMBERS", JSON.stringify(arr));
    } catch (e) {}
  };

  function saveAdmissionRecord(e) {
    e.preventDefault();
    const rec = {
      id: "adm_" + Date.now(),
      formType: $("fType").value,
      joinDate: $("fJoinDate").value || new Date().toISOString().slice(0, 10),
      name: $("fName").value.trim(),
      phone: $("fPhone").value.replace(/\D/g, "").slice(-10),
      guardian: $("fGuardian").value.trim(),
      parentName: $("fGuardian").value.trim(),
      planName: $("fPlan").value.trim(),
      amount: Number($("fPaid").value || 0),
      dueAmount: Number($("fDue").value || 0),
      status: (Number($("fDue").value || 0) > 0) ? "Pending" : "Paid",
      orgId: getOrgId(),
      nonDeletable: true,
      createdAt: new Date().toISOString()
    };
    const arr = readList();
    arr.unshift(rec);
    writeList(arr);
    $("joinAdmForm").reset();
    $("fJoinDate").value = new Date().toISOString().slice(0, 10);
    renderSavedAdmissions();
    alert("Record saved! Ab naam ya mobile se search karke kabhi bhi dekh sakte hain.");
  }

  function renderSavedAdmissions() {
    const q = ($("admSearchIn").value || "").trim().toLowerCase();
    const org = getOrgId();
    const rows = readList().filter(r => (!org || !r.orgId || String(r.orgId) === String(org)) &&
      (!q || String(r.name || "").toLowerCase().includes(q) || String(r.phone || "").includes(q)));
    $("admSearchList").innerHTML = rows.slice(0, 8).map(r =>
      `<div class="card-rec">
        <div><b style="color:var(--ac)">${esc(r.name)}</b> • <small>${esc(r.phone || "-")}</small></div>
        <div style="font-size:11px;color:#ccc;margin-top:2px">${esc(r.formType || "Admission")} • Plan: <b>${esc(r.planName || "-")}</b> • Paid: ₹${Number(r.amount || 0)} • Due: ₹${Number(r.dueAmount || 0)}</div>
        <div style="font-size:10px;color:var(--ok);margin-top:2px">Saved &amp; Locked (Delete disabled for staff/manager)</div>
      </div>`
    ).join("") || "<div class='card-rec'><small style='color:#999'>Koi record nahi mila.</small></div>";
  }

  window.addEventListener("DOMContentLoaded", () => {
    $("fJoinDate").value = new Date().toISOString().slice(0, 10);
    renderSavedAdmissions();
  });
</script>
</body>
</html>
