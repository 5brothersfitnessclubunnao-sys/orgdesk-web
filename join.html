<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admission Form</title>
<style>
:root{--bg:#0e0d0b;--card:#1a1814;--line:#322d22;--gold:#f5b700;--ok:#3ddc84;--bad:#ff5c5c;--tx:#f4efe4;--mu:#a49b86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:30px}
.w{max-width:560px;margin:0 auto;padding:12px}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
label{display:block;color:var(--mu);font-size:13px;margin-top:8px}input,select,textarea{width:100%;padding:11px;margin:4px 0;background:#100f0c;color:var(--tx);border:1px solid var(--line);border-radius:8px;font:inherit}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}
button{background:var(--gold);color:#111;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}button.g{background:#26221a;color:var(--tx);border:1px solid var(--line)}
.r{display:flex;gap:8px}.r>*{flex:1}.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:2px solid var(--gold)}
.hd img{width:42px;height:42px;border-radius:8px;object-fit:cover}.hd b{flex:1}.dots{display:flex;gap:4px;margin:10px 0}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--gold)}
h2{color:var(--gold);font-size:17px;margin:6px 0}h3{color:var(--gold);font-size:14px;margin:12px 0 2px;border-bottom:1px solid var(--line)}img.pv{max-width:100%;max-height:200px;border-radius:8px;margin:6px 0}
.sig{font:34px "Brush Script MT","Segoe Script","Lucida Handwriting",cursive;color:#fff;border-bottom:2px solid var(--gold);padding:8px 4px;min-height:56px}
pre{white-space:pre-wrap;font:13px/1.5 inherit;margin:4px 0}.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:800;color:var(--gold)}
#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;background:#fff;color:#000;padding:14px;font:13px/1.45 sans-serif}#pr td,#pr th{padding:3px 6px;border:1px solid #888}#pr table{border-collapse:collapse;width:100%;margin:4px 0}#pr h4{margin:10px 0 3px;border-bottom:2px solid #000}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="auth-gate.js"></script>
<script src="cloud-sync.js"></script></head>
<body><div id="app"><div class="w mu">Loading…</div></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const DEF={lang:'hi',plans:[{n:'1 Month',m:1,f:500},{n:'3 Months',m:3,f:1400},{n:'6 Months',m:6,f:2600},{n:'1 Year',m:12,f:4500}],slots:['Morning','Evening','Full Day'],cats:['Regular','Student','Couple / Family','Personal Training'],
terms:'1. एक बार जमा हुई फीस वापस नहीं होगी और किसी और को ट्रांसफर नहीं होगी।\n2. जिम के नियम और समय का पालन करना ज़रूरी है; साफ़ इनडोर जूते पहनें।\n3. व्यायाम के दौरान किसी चोट की ज़िम्मेदारी सदस्य की स्वयं की होगी।\n4. जिम के सामान को नुकसान होने पर भरपाई करनी होगी।\n5. इस फॉर्म में दी गई सारी जानकारी सही है।',
termsEn:'1. Fees once paid are non-refundable and non-transferable.\n2. Members must follow gym timings, rules and equipment etiquette; wear clean indoor shoes.\n3. The member exercises at their own risk; management is not liable for any injury arising from exercise.\n4. Damage to gym property must be compensated.\n5. All information provided in this form is true and correct.'};
let U,G={},C=DEF,LG='hi',F={joined:today(),plan:0,mode:'Cash'},P={},st=0,cfgOpen=false,last=null;
const T=(h,e)=>LG=='hi'?h:e;
const STEPS=()=>[T('प्लान','Plan'),T('विवरण','Details'),T('फिटनेस','Fitness'),T('स्वास्थ्य','Health'),T('नियम','Terms'),T('भुगतान','Payment')];
const O=a=>a.map(s=>{const[h,e]=s.split('|');return[e||h,T(h,e||h)]});
const V=id=>esc(F[id]??'');
const I=(id,l,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${V(id)}" ${x}>`;
const S=(id,l,o)=>`<label>${l}</label><select id="${id}">${o.map(x=>{const v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}" ${String(F[id]??'')===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const K=(id,l)=>`<label class="ck"><input type="checkbox" id="${id}" ${F[id]?'checked':''}> ${l}</label>`;
const IMG=(k,l,q)=>`<label>${l}${q?' *':''}</label><img class="pv" id="p_${k}" src="${P[k]||''}" style="display:${P[k]?'block':'none'}"><div class="r"><button class="g" onclick="pick('${k}',1)">📷 Live</button><button class="g" onclick="pick('${k}',0)">🖼️ Gallery</button></div>`;
const YN=['नहीं|No','हाँ|Yes'];
function collect(){document.querySelectorAll('#v [id]').forEach(e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.tagName))F[e.id]=e.type=='checkbox'?e.checked:e.value})}
// ---------- photo ----------
function rs(file,mw,mh,cb,png){const fin=(s,w0,h0,cl)=>{let o='';try{let w=w0,h=h0;if(w>mw||h>mh){const r=Math.min(mw/w,mh/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(s,0,0,w,h);o=png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.72)}catch(e){}try{cl&&cl()}catch(e){}return o};
 const raw=()=>{const r=new FileReader();r.onload=e=>cb(e.target.result);r.onerror=()=>cb('');r.readAsDataURL(file)};
 const img=()=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const o=fin(i,i.naturalWidth,i.naturalHeight,()=>URL.revokeObjectURL(u));o?cb(o):raw()};i.onerror=()=>raw();i.src=u};
 window.createImageBitmap?createImageBitmap(file,{imageOrientation:'from-image'}).then(b=>{const o=fin(b,b.width,b.height,()=>b.close());o?cb(o):img()}).catch(img):img()}
function pick(k,live){const i=document.createElement('input');i.type='file';i.accept='image/*';if(live)i.capture=k=='photo'?'user':'environment';
 i.onchange=()=>{const f=i.files[0];if(!f)return;rs(f,k=='photo'?480:800,k=='photo'?640:800,u=>{if(!u)return alert(T('यह फोटो पढ़ी नहीं गई, दूसरी चुनें।','Could not read this photo, choose another.'));P[k]=u;const e=$('#p_'+k);e.src=u;e.style.display='block'})};i.click()}
// ---------- screens ----------
function draw(){const body=[plan,pers,fit,hlth,rules,pay][st]();
 A.innerHTML=`<div class="hd">${G.logo?`<img src="${G.logo}">`:'🏋️'}<b>${esc(G.name||'Gym')}<div class="mu">${esc(G.addr||'')}</div></b><button class="g" onclick="collect();LG=LG=='hi'?'en':'hi';draw()">${LG=='hi'?'EN':'हिं'}</button><button class="g" onclick="location.href='index.html'">🏠</button><button class="g" onclick="cfgOpen=!cfgOpen;draw()">⚙</button></div>
 <div class="w">${cfgOpen?cfgV():''}<div class="dots">${STEPS().map((x,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><h2>${st+1}/6 · ${STEPS()[st]}</h2><div class="c" id="v">${body}</div>
 <div class="r">${st?`<button class="g" onclick="nav(-1)">⬅ ${T('पीछे','Back')}</button>`:''}${st<5?`<button onclick="nav(1)">${T('आगे','Next')} ➔</button>`:`<button id="go" onclick="submit()">✅ ${T('फॉर्म जमा करें','Submit form')}</button>`}</div></div>`;
 if(st==5)calc()}
const plan=()=>`${I('joined',T('📅 प्रवेश तिथि *','📅 Joining date *'),'date')}${S('cat',T('मेम्बरशिप श्रेणी','Membership category'),C.cats)}${S('slot',T('बैच / समय','Batch / time slot'),C.slots)}${S('plan',T('योजना अवधि','Plan duration'),C.plans.map((p,i)=>[i,`${p.n} — ₹${p.f}`]))}${S('ref',T('हमारे बारे में कैसे पता चला','How did you hear about us'),O(['दोस्त / रिश्तेदार|Friend / Family','सोशल मीडिया|Social media','पोस्टर / बैनर|Poster / Banner','वॉक-इन|Walk-in','अन्य|Other']))}`;
const pers=()=>`<h3>${T('व्यक्तिगत विवरण','Personal details')}</h3>${I('name',T('पूरा नाम *','Full name *'))}${I('father',T('पिता / माता / पति का नाम *','Father / Mother / Spouse name *'))}${I('dob',T('जन्म तिथि','Date of birth'),'date','onchange="agef()"')}${I('age',T('आयु','Age'),'number')}${S('gender',T('लिंग','Gender'),O(['पुरुष|Male','महिला|Female','अन्य|Other']))}${I('occ',T('व्यवसाय','Occupation'))}${I('phone',T('मोबाइल नंबर (WhatsApp) *','Mobile number (WhatsApp) *'),'tel','maxlength=10')}${I('email','Email','email')}${I('pin',T('पिनकोड','Pincode'),'tel')}${I('addr',T('पूरा पता *','Full address *'))}
<h3>🚨 ${T('आपातकालीन संपर्क (परिवार / रिश्तेदार)','Emergency contact (family / relative)')}</h3>${I('emn',T('नाम *','Name *'))}${I('emr',T('संबंध','Relationship'))}${I('emp',T('मोबाइल नंबर *','Mobile number *'),'tel','maxlength=10')}
<h3>${T('फोटो व पहचान','Photo & ID')}</h3>${IMG('photo',T('सदस्य की फोटो','Member photo'),1)}${S('idt',T('पहचान पत्र का प्रकार','ID proof type'),['Aadhaar','Voter ID','Driving Licence','PAN','Passport','School / College ID'])}${I('idn',T('ID नंबर (वैकल्पिक)','ID number (optional)'))}${IMG('idf',T('ID (आगे)','ID (front)'))}${IMG('idb',T('ID (पीछे)','ID (back)'))}`;
const GL=[['g1','वजन घटाना','Weight loss'],['g2','मसल / वजन बढ़ाना','Muscle gain'],['g3','स्ट्रेंथ','Strength'],['g4','स्टैमिना / एंड्योरेंस','Stamina / endurance'],['g5','फ्लेक्सिबिलिटी','Flexibility'],['g6','सामान्य फिटनेस','General fitness'],['g7','स्पोर्ट्स परफॉर्मेंस','Sports performance'],['g8','रिहैब / पुनर्वास','Rehab / recovery']];
const fit=()=>`<h3>${T('फिटनेस अनुभव','Fitness experience')}</h3>${S('lvl',T('आपका स्तर','Your current level'),O(['शुरुआती|Beginner','मध्यम|Intermediate','एडवांस|Advanced']))}${S('gb',T('क्या पहले कभी जिम किया है?','Have you trained at a gym before?'),O(YN))}${I('tf',T('कितने समय तक किया? (जैसे 6 महीने)','For how long? (e.g. 6 months)'))}${S('days',T('सप्ताह में कितने दिन आएंगे','Days per week'),['3','4','5','6'])}
<h3>${T('लक्ष्य (एक या अधिक चुनें)','Goals (select all that apply)')}</h3>${GL.map(g=>K(g[0],T(g[1],g[2]))).join('')}
<h3>${T('जीवनशैली','Lifestyle')}</h3>${S('job',T('काम का स्वरूप','Activity at work'),O(['बैठकर|Sedentary','हल्का चलना|Light','भारी मेहनत|Heavy']))}${S('diet',T('आहार','Diet'),O(['शाकाहारी|Vegetarian','मांसाहारी|Non-vegetarian','अंडा|Eggetarian']))}${S('tob',T('तंबाकू / गुटका / शराब','Tobacco / alcohol use'),O(['नहीं|No','कभी-कभी|Occasionally','हाँ|Yes']))}${S('sup',T('क्या सप्लीमेंट लेते हैं?','Do you take supplements?'),O(YN))}${I('supw',T('कौन सा सप्लीमेंट?','Which supplement(s)?'))}`;
const HC=[['h0','कोई समस्या नहीं (Fit)','No problem (Fit)'],['h1','हाई / लो बीपी','High / low BP'],['h2','शुगर (Diabetes)','Diabetes'],['h3','दिल की बीमारी','Heart condition'],['h4','अस्थमा / सांस की तकलीफ़','Asthma / breathing issue'],['h5','कमर / रीढ़ का दर्द','Back / spine problem'],['h6','घुटने / जोड़ों का दर्द','Knee / joint problem'],['h7','मिर्गी / दौरे','Epilepsy / fits'],['h8','थायराइड','Thyroid'],['h9','हाल का ऑपरेशन / चोट','Recent surgery / injury']];
const hlth=()=>`<h3>${T('शारीरिक माप','Body details')}</h3><div class="r">${I('ht',T('ऊंचाई (सेमी)','Height (cm)'),'number')}${I('wt',T('वजन (किग्रा)','Weight (kg)'),'number')}</div>${S('bg',T('ब्लड ग्रुप','Blood group'),['N/A','A+','A-','B+','B-','O+','O-','AB+','AB-'])}
<h3>${T('स्वास्थ्य जांच (PAR-Q)','Health screening (PAR-Q)')}</h3>${HC.map(g=>K(g[0],T(g[1],g[2]))).join('')}${F.gender=='Female'?K('h10',T('गर्भावस्था / प्रसव के बाद','Pregnancy / post-natal')):''}
${S('q1',T('क्या डॉक्टर ने व्यायाम से मना किया है?','Has a doctor advised you not to exercise?'),O(YN))}${S('q2',T('व्यायाम में सीने में दर्द या चक्कर आता है?','Chest pain or dizziness during exercise?'),O(YN))}${S('q3',T('क्या कोई नियमित दवा लेते हैं?','Do you take any regular medicine?'),O(YN))}${I('medw',T('कौन सी दवा?','Which medicine?'))}${I('alg',T('एलर्जी (यदि कोई)','Allergies (if any)'))}${I('inj',T('पुरानी चोट / ऑपरेशन (यदि कोई)','Past injury / surgery (if any)'))}
<h3>${T('शुरुआती माप (सेमी, वैकल्पिक)','Initial measurements (cm, optional)')}</h3><div class="r">${I('m_chest',T('छाती','Chest'),'number')}${I('m_waist',T('कमर','Waist'),'number')}${I('m_sh',T('कंधा','Shoulder'),'number')}</div><div class="r">${I('m_bi',T('बाइसेप्स','Biceps'),'number')}${I('m_fa',T('फोरआर्म','Forearm'),'number')}</div>
${K('hdec','✔ '+T('मैं घोषणा करता/करती हूँ कि स्वास्थ्य संबंधी सारी जानकारी सही है। *','I declare that the health information given is true. *'))}`;
const rules=()=>{if(F.sign==null||F.signAuto!==F.name){F.sign=F.name||'';F.signAuto=F.name}return`<pre>${esc(LG=='hi'?C.terms:C.termsEn)}</pre>${K('ec','🚑 '+T('आपातकाल में प्राथमिक चिकित्सा / नज़दीकी अस्पताल ले जाने की मैं सहमति देता/देती हूँ। *','I consent to first aid / being taken to the nearest hospital in an emergency. *'))}${K('agree',T('मैंने सभी नियम व शर्तें पढ़कर स्वीकार की हैं। *','I have read and accept all terms & conditions. *'))}<label>${T('हस्ताक्षर (नाम से अपने आप भरा — चाहें तो बदलें)','Signature (auto-filled from name — edit if needed)')}</label><input id="sign" value="${V('sign')}" oninput="$('#sg').textContent=this.value"><div class="sig" id="sg">${V('sign')}</div><div class="mu">${T('दिनांक','Date')}: ${today()} · ${V('name')}</div>`};
const pay=()=>{if(F.att===undefined)F.att=true;const p=C.plans[+F.plan||0];if(F.fe!==F.plan){F.fe=F.plan;F.fee=p.f;F.disc=0;F.paid=p.f}
 return`<div class="mu">${esc(p.n)} · ${F.joined} → ${addM(F.joined,p.m)}</div>${I('fee',T('प्लान फीस ₹','Plan fee ₹'),'number','oninput="calc()"')}${I('disc',T('छूट ₹','Discount ₹'),'number','oninput="calc()"')}<div class="c r"><div><div class="mu">${T('देय राशि','Payable')}</div><div class="big" id="net"></div></div><div><div class="mu">${T('बकाया','Balance')}</div><div class="big" id="due"></div></div></div>${I('paid',T('अभी जमा राशि ₹','Paid now ₹'),'number','oninput="calc()"')}${S('mode',T('भुगतान का तरीका','Payment mode'),['Cash','Google Pay','PhonePe','Paytm','Other UPI','Card']).replace('<select','<select onchange="calc()"')}<div id="ut">${I('utr','UTR / UPI Ref. No.')}</div><div id="pm">${I('promise',T('बकाया कब जमा करेंगे? *','Balance payment date *'),'date')}</div>${K('att','✅ '+T('आज की हाज़िरी भी लगाओ','Mark today\'s attendance'))}`};
function calc(){const f=+$('#fee').value||0,d=+$('#disc').value||0,n=Math.max(0,f-d),p=Math.min(n,+$('#paid').value||0);$('#net').textContent='₹'+n;$('#due').textContent='₹'+(n-p);$('#due').style.color=n-p?'var(--bad)':'var(--ok)';$('#ut').style.display=$('#mode').value=='Cash'?'none':'block';$('#pm').style.display=n-p>0?'block':'none'}
function agef(){const d=$('#dob').value;if(d){const a=Math.floor((Date.now()-new Date(d))/31557600000);$('#age').value=a>0?a:''}}
function nav(d){collect();if(d>0){const m=[];
  if(st==1){if(!F.name)m.push(T('नाम','Name'));if(!F.father)m.push(T('पिता का नाम','Father name'));if(!/^\d{10}$/.test(F.phone||''))m.push(T('10 अंक का मोबाइल','10-digit mobile'));if(!F.addr)m.push(T('पता','Address'));if(!F.emn||!/^\d{10}$/.test(F.emp||''))m.push(T('आपातकालीन संपर्क','Emergency contact'));if(!P.photo)m.push(T('सदस्य की फोटो','Member photo'))}
  if(st==3&&!F.hdec)m.push(T('स्वास्थ्य घोषणा पर टिक','Health declaration'));if(st==4&&(!F.agree||!F.ec))m.push(T('सहमति / नियमों पर टिक','Consent & terms'));
  if(m.length)return alert(T('ये भरना ज़रूरी है: ','Required: ')+m.join(', '))}
 st+=d;draw();scrollTo(0,0)}
// ---------- submit ----------
const getList=()=>{try{return JSON.parse(localStorage.getItem('5BFC_MEMBERS')||localStorage.getItem('bbf_master_records_v4')||'[]')||[]}catch(e){return[]}};
const setList=l=>{const s=JSON.stringify(l);localStorage.setItem('5BFC_MEMBERS',s);localStorage.setItem('bbf_master_records_v4',s)};
function nextReg(list){const pre=((G.name||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'GYM'),used=new Set(list.map(m=>m.reg).filter(Boolean));let n=list.length+1,r;do{r=pre+'-'+String(n++).padStart(4,'0')}while(used.has(r));return r}
async function submit(){collect();const b=$('#go');
 const pl=C.plans[+F.plan||0],net=Math.max(0,(+F.fee||0)-(+F.disc||0)),paid=Math.min(net,+F.paid||0),due=net-paid;
 if(due>0&&!F.promise)return alert(T('बकाया है — जमा करने की तारीख डालिए','Balance pending — enter the payment date'));
 b.disabled=true;b.textContent='⏳ …';
 try{const list=getList(),ex=list.find(m=>m.phone&&m.phone===F.phone);let mid,reg,till;
  const status=due>0?'Pending':'Paid';
