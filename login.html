<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Om Software ERP — Secure Portal Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: radial-gradient(1000px 600px at 50% -10%, #152238 0%, #050813 70%);
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: #0A1124; border: 1px solid #1B294B;
      border-radius: 24px; padding: 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); text-align: center;
    }
    .brand-icon {
      width: 58px; height: 58px; margin: 0 auto 12px;
      background: linear-gradient(135deg, #F5A623, #D97706);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: #000;
    }
    h1 { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    p.sub { font-size: 12px; color: #94A3B8; margin-bottom: 18px; }
    
    .form-group { text-align: left; margin-bottom: 13px; }
    label { display: block; font-size: 11.5px; font-weight: 700; color: #94A3B8; margin-bottom: 4px; }
    input, select {
      width: 100%; background: #070D1C; border: 1.5px solid #1B294B; border-radius: 12px;
      padding: 11px 13px; color: #fff; font-size: 13.5px; outline: none;
    }
    input:focus, select:focus { border-color: #22D3EE; }
    
    .btn-submit {
      width: 100%; background: linear-gradient(135deg, #F5A623, #D97706); color: #000;
      border: 0; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 900;
      cursor: pointer; margin-top: 8px;
    }

    .sess-box {
      display: none; background: rgba(34,211,238,0.1); border: 1px solid #22D3EE;
      border-radius: 12px; padding: 10px; margin-bottom: 14px; font-size: 12px; text-align: left;
    }
    .sess-btns { display: flex; gap: 8px; margin-top: 8px; }
    .sess-btns button {
      flex: 1; padding: 7px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">ॐ</div>
    <h1>Om Software ERP</h1>
    <p class="sub">Multi-Branch Secure Access Portal</p>

    <!-- Last session detection prompt -->
    <div id="sessionRecoveryBox" class="sess-box">
      <b>Last Session Detected:</b>
      <div id="sessionUserDesc" style="font-size:11px;color:#94A3B8;margin:3px 0 8px;">Logged in previously.</div>
      <div class="sess-btns">
        <button type="button" onclick="continueLastSession()" style="background:#22D3EE;color:#000;border:0;">Resume Session</button>
        <button type="button" onclick="clearPreviousSession()" style="background:#132142;color:#fff;border:1px solid #1B294B;">New Session</button>
      </div>
    </div>

    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label>Select Login Mode</label>
        <select id="loginType" onchange="toggleLoginFields(this.value)">
          <option value="admin_manager">Admin / Manager (Email + Password + Security Q)</option>
          <option value="staff">Staff Desk (Branch Code + Emp ID + Password)</option>
        </select>
      </div>

      <!-- Admin / Manager Fields -->
      <div id="adminModeFields">
        <div class="form-group">
          <label>Role</label>
          <select id="loginRole">
            <option value="owner">Admin / Owner (Full Enterprise Control)</option>
            <option value="manager">Branch Manager</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email ID *</label>
          <input type="text" id="admEmail" placeholder="owner@omsoftware.com" required>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="admPass" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Security Question *</label>
          <select id="admSecQ">
            <option value="Favourite Person">Favourite Person</option>
            <option value="Favourite Pet">Favourite Pet</option>
            <option value="Favourite Song">Favourite Song</option>
          </select>
        </div>
        <div class="form-group">
          <label>Security Answer *</label>
          <input type="text" id="admSecA" placeholder="Enter answer" required>
        </div>
      </div>

      <!-- Staff Fields -->
      <div id="staffModeFields" style="display:none;">
        <div class="form-group">
          <label>Branch Code *</label>
          <input type="text" id="stfBranch" placeholder="e.g. 001">
        </div>
        <div class="form-group">
          <label>Employee ID *</label>
          <input type="text" id="stfEmpId" placeholder="e.g. STF-001-CL1">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="stfPass" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn-submit">Sign In to ERP Portal</button>
    </form>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      const lastUser = localStorage.getItem("om_logged_user");
      const lastRole = localStorage.getItem("bfc_role");
      if (lastUser) {
        document.getElementById("sessionRecoveryBox").style.display = "block";
        document.getElementById("sessionUserDesc").textContent = `User: ${lastUser} (${lastRole || 'Staff'})`;
      }
    });

    function toggleLoginFields(type) {
      const isStaff = (type === "staff");
      document.getElementById("adminModeFields").style.display = isStaff ? "none" : "block";
      document.getElementById("staffModeFields").style.display = isStaff ? "block" : "none";
      document.getElementById("admEmail").required = !isStaff;
      document.getElementById("admPass").required = !isStaff;
      document.getElementById("admSecA").required = !isStaff;
      document.getElementById("stfBranch").required = isStaff;
      document.getElementById("stfEmpId").required = isStaff;
      document.getElementById("stfPass").required = isStaff;
    }

    function continueLastSession() {
      localStorage.setItem("om_last_active_time", String(Date.now()));
      location.replace("index.html");
    }

    function clearPreviousSession() {
      localStorage.removeItem("om_logged_user");
      localStorage.removeItem("bfc_role");
      document.getElementById("sessionRecoveryBox").style.display = "none";
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const isStaff = document.getElementById("loginType").value === "staff";
      if (isStaff) {
        const bc = document.getElementById("stfBranch").value.trim();
        const eid = document.getElementById("stfEmpId").value.trim();
        const pw = document.getElementById("stfPass").value;
        if (!bc || !eid || !pw) return;
        localStorage.setItem("bfc_role", "staff");
        localStorage.setItem("om_logged_user", `${eid}@Branch-${bc}`);
      } else {
        const role = document.getElementById("loginRole").value;
        const em = document.getElementById("admEmail").value.trim();
        const pw = document.getElementById("admPass").value;
        const sq = document.getElementById("admSecQ").value;
        const sa = document.getElementById("admSecA").value.trim();
        if (!em || !pw || !sa) return;
        localStorage.setItem("bfc_role", role);
        localStorage.setItem("om_logged_user", `${em}`);
      }

      // Reset splash flag so Animated ॐ screen triggers proudly upon login!
      localStorage.removeItem("om_splash_shown");
      localStorage.setItem("om_last_active_time", String(Date.now()));
      location.replace("index.html");
    }
  </script>
</body>
</html>
