<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym SaaS Portal — Secure Access</title>
  <style>
    :root {
      --bg: #050814; --card: #0a1124; --card2: #0f1936; --border: rgba(245, 166, 35, 0.55);
      --gold: #f5a623; --gold-bright: #ffd166; --cyan: #22d3ee; --emerald: #34d399;
      --rose: #fb7185; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 18px 14px 70px; display: flex; justify-content: center; }
    .portal-card { width: 100%; max-width: 480px; background: var(--card); border: 1.5px solid var(--border); border-radius: 22px; padding: 20px; margin-top: 8px; }
    .tag { display: inline-block; background: rgba(245,166,35,0.16); color: var(--gold-bright); border: 1px solid var(--border); font-size: 10px; font-weight: 900; padding: 4px 11px; border-radius: 999px; }
    h1 { font-size: 22px; font-weight: 900; color: var(--gold-bright); margin-top: 8px; text-align: center; }
    .sub { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .m-btn { background: #070d1d; border: 1px solid rgba(255,255,255,0.14); color: var(--text); border-radius: 10px; padding: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .m-btn.active { border-color: var(--gold); color: var(--gold-bright); background: rgba(245,166,35,0.12); }
    label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 11px; margin-bottom: 4px; }
    .inp { width: 100%; background: #070d1d; border: 1px solid rgba(255,255,255,0.16); color: #fff; border-radius: 11px; padding: 10px 12px; font-size: 13px; }
    .btn-main { width: 100%; margin-top: 14px; background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #050814; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 900; cursor: pointer; }
    .msg-err { color: var(--rose); font-size: 12px; font-weight: 700; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="portal-card">
    <div style="text-align:center"><span class="tag">GYM SAAS PORTAL</span></div>
    <h1 id="portalTitle">Gym Owner Login</h1>
    <div class="sub">Secure Role-Based Access</div>

    <div class="mode-row">
      <button type="button" class="m-btn active" id="ownModeSignin" onclick="setOwnerMode('signin')">Sign In</button>
      <button type="button" class="m-btn" id="ownModeSignup" onclick="setOwnerMode('signup')">New Sign Up</button>
    </div>

    <!-- SIGN IN BOX -->
    <div id="ownSigninBox">
      <form onsubmit="submitOwnerSignin(event)">
        <label for="ownLoginId">Email ID / Mobile *</label>
        <input type="text" id="ownLoginId" class="inp" required placeholder="owner@gym.com ya 10-digit mobile">

        <label for="ownLoginPass">Password *</label>
        <input type="password" id="ownLoginPass" class="inp" placeholder="Enter password">

        <div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between">
          <label style="margin:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--gold-bright);font-weight:800;font-size:12px">
            <input type="checkbox" id="saveLoginChk" checked style="width:16px;height:16px;accent-color:var(--gold)">
            <span>Save Login</span>
          </label>
          <span style="font-size:11px;color:var(--muted)">Auto-fill on this device</span>
        </div>

        <div id="ownErr" class="msg-err"></div>
        <button type="submit" class="btn-main">Login to Gym Dashboard</button>
      </form>
    </div>

    <!-- SIGN UP BOX -->
    <div id="ownSignupBox" style="display:none">
      <form onsubmit="submitOwnerSignup(event)">
        <label>Gym Name *</label>
        <input type="text" id="suGymName" class="inp" required placeholder="Gym Name">

        <label>Owner Name *</label>
        <input type="text" id="suOwnerName" class="inp" required placeholder="Owner Name">

        <label>10-Digit Mobile *</label>
        <input type="tel" id="suPhone" class="inp" required maxlength="10" placeholder="10-digit mobile">

        <label>Email ID *</label>
        <input type="email" id="suEmail" class="inp" required placeholder="owner@gmail.com">

        <label>Create Password *</label>
        <input type="password" id="suCreatePass" class="inp" required placeholder="Password">

        <label>Create 4-Digit MPIN *</label>
        <input type="password" id="suCreateMpin" class="inp" inputmode="numeric" maxlength="4" required placeholder="••••">

        <div style="margin-top:14px;padding-top:10px;border-top:1px dashed rgba(245,166,35,0.4)">
          <div style="font-size:12px;font-weight:900;color:var(--gold-bright);margin-bottom:8px">📜 Compliance &amp; Licenses (Optional)</div>
          
          <label>GST Number (If available)</label>
          <input type="text" id="suGstNo" class="inp" maxlength="15" placeholder="09AAAAA0000A1Z5">
          <label style="font-size:11px">Upload GST Doc</label>
          <input type="file" id="suGstDoc" class="inp" accept="image/*,.pdf">

          <label>Udyam Registration Number (If available)</label>
          <input type="text" id="suUdyamNo" class="inp" maxlength="19" placeholder="UDYAM-UP-00-0000000">
          <label style="font-size:11px">Upload Udyam Certificate</label>
          <input type="file" id="suUdyamDoc" class="inp" accept="image/*,.pdf">

          <label>FSSAI Food License (For Supplement Dealer)</label>
          <input type="text" id="suFssaiNo" class="inp" maxlength="14" placeholder="14-digit FSSAI Number">
          <label style="font-size:11px">Upload FSSAI License</label>
          <input type="file" id="suFssaiDoc" class="inp" accept="image/*,.pdf">
        </div>

        <button type="submit" class="btn-main" style="margin-top:14px">Create Owner Account &amp; Continue</button>
      </form>
    </div>
  </div>

  <script>
    const SAVED_KEY = "om_saved_login_creds_v1";

    function setOwnerMode(m) {
      const isSignup = (m === 'signup');
      document.getElementById("ownModeSignin").classList.toggle("active", !isSignup);
      document.getElementById("ownModeSignup").classList.toggle("active", isSignup);
      document.getElementById("ownSigninBox").style.display = isSignup ? "none" : "block";
      document.getElementById("ownSignupBox").style.display = isSignup ? "block" : "none";
    }

    function submitOwnerSignin(ev) {
      ev.preventDefault();
      const loginId = document.getElementById("ownLoginId").value.trim().toLowerCase();
      const pass = document.getElementById("ownLoginPass").value.trim();
      const errEl = document.getElementById("ownErr");

      let savedOwner = null;
      try { savedOwner = JSON.parse(localStorage.getItem("om_owner_account_v1") || "null"); } catch(e) {}

      // UNREGISTERED EMAIL/MOBILE CHECK
      const isMatch = savedOwner && (
        String(savedOwner.email || "").toLowerCase() === loginId ||
        String(savedOwner.phone || "") === loginId
      );

      if (!savedOwner || !isMatch) {
        errEl.textContent = "Please Sign up Before using this Plan";
        alert("Please Sign up Before using this Plan");
        setOwnerMode('signup');
        return;
      }

      if (savedOwner.password && pass && savedOwner.password !== pass) {
        errEl.textContent = "Galat password! Dobara koshish karein.";
        return;
      }

      if (document.getElementById("saveLoginChk").checked) {
        localStorage.setItem(SAVED_KEY, JSON.stringify({ loginId: loginId, pass: pass }));
      } else {
        localStorage.removeItem(SAVED_KEY);
      }

      localStorage.setItem("bfc_role", "owner");
      localStorage.setItem("om_active_role", "owner");
      localStorage.setItem("om_logged_user", savedOwner.ownerName || "Gym Owner");
      localStorage.setItem("om_session_active", "1");
      localStorage.removeItem("om_logged_out_flag");
      location.href = "index.html";
    }

    function submitOwnerSignup(ev) {
      ev.preventDefault();
      const rec = {
        gymName: document.getElementById("suGymName").value.trim(),
        ownerName: document.getElementById("suOwnerName").value.trim(),
        phone: document.getElementById("suPhone").value.trim(),
        email: document.getElementById("suEmail").value.trim().toLowerCase(),
        password: document.getElementById("suCreatePass").value.trim(),
        mpin: document.getElementById("suCreateMpin").value.trim(),
        gstNo: document.getElementById("suGstNo").value.trim(),
        udyamNo: document.getElementById("suUdyamNo").value.trim(),
        fssaiNo: document.getElementById("suFssaiNo").value.trim()
      };
      localStorage.setItem("om_owner_account_v1", JSON.stringify(rec));
      localStorage.setItem("om_active_gym_profile", JSON.stringify(rec));
      localStorage.setItem("bfc_role", "owner");
      localStorage.setItem("om_active_role", "owner");
      localStorage.setItem("om_session_active", "1");
      localStorage.removeItem("om_logged_out_flag");
      alert("Sign Up complete! Dashboard khul raha hai...");
      location.href = "index.html";
    }

    window.addEventListener("DOMContentLoaded", function() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVED_KEY) || "null");
        if (saved && saved.loginId) {
          document.getElementById("ownLoginId").value = saved.loginId;
          if (saved.pass) document.getElementById("ownLoginPass").value = saved.pass;
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
