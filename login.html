<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym SaaS Portal — Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #050814; --card: #0a1124; --border: rgba(245, 166, 35, 0.55);
      --gold: #f5a623; --gold-bright: #ffd166; --cyan: #22d3ee; --emerald: #34d399;
      --rose: #fb7185; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 18px 14px 60px; display: flex; justify-content: center; align-items: flex-start; }
    .portal-card {
      width: 100%; max-width: 440px; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 22px; padding: 20px; margin-top: 10px;
    }
    .tag { display: inline-block; background: rgba(245,166,35,0.16); color: var(--gold-bright); border: 1px solid var(--border); font-size: 10px; font-weight: 900; padding: 3px 10px; border-radius: 999px; }
    h1 { font-size: 22px; font-weight: 900; color: var(--gold-bright); margin-top: 8px; text-align: center; }
    .sub { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

    .role-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
    .r-btn {
      background: #070d1d; border: 1px solid rgba(255,255,255,0.14); color: var(--text);
      border-radius: 10px; padding: 8px 6px; font-size: 11.5px; font-weight: 800; cursor: pointer; text-align: center;
    }
    .r-btn.active { background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: #050814; border-color: var(--gold); }
    .r-btn.prime { border-color: var(--cyan); color: var(--cyan); }
    .r-btn.prime.active { background: linear-gradient(135deg, var(--cyan), #0284c7); color: #050814; border-color: var(--cyan); }

    label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 12px; margin-bottom: 4px; }
    .inp {
      width: 100%; background: #070d1d; border: 1px solid rgba(255,255,255,0.16); color: #fff;
      border-radius: 11px; padding: 10px 12px; font-size: 13px;
    }
    .mpin-box { text-align: center; font-size: 22px; letter-spacing: 10px; font-weight: 900; color: var(--gold-bright); }
    .btn-main {
      width: 100%; margin-top: 14px; background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #050814; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 900; cursor: pointer;
    }
    .msg-err { color: var(--rose); font-size: 12px; font-weight: 700; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="portal-card">
    <div style="text-align:center"><span class="tag">GYM SAAS PORTAL</span></div>
    <h1 id="portalTitle">Gym Owner Login</h1>
    <div class="sub" id="portalSub">Gym Owner Portal — Email + Password/MPIN + Security Question</div>

    <div class="role-row">
      <button type="button" class="r-btn active" id="roleBtnOwner" onclick="selectPortalRole('owner')">Gym Owner</button>
      <button type="button" class="r-btn" id="roleBtnManager" onclick="selectPortalRole('manager')">Manager</button>
      <button type="button" class="r-btn" id="roleBtnStaff" onclick="selectPortalRole('staff')">Staff</button>
      <button type="button" class="r-btn prime" id="roleBtnPrime" onclick="selectPortalRole('prime')">Prime Master</button>
    </div>

    <!-- PRIME MASTER MPIN-ONLY VIEW (NO EMAIL, NO PASSWORD, NO SECURITY QUESTION) -->
    <div id="primeMasterLoginSection" style="display:none">
      <form onsubmit="loginPrimeMasterOnly(event)">
        <label for="pmMpinInput">Prime Master MPIN *</label>
        <input type="password" id="pmMpinInput" class="inp mpin-box" inputmode="numeric" maxlength="4" placeholder="••••">
        <div id="pmErr" class="msg-err"></div>
        <button type="submit" class="btn-main">Prime Master Login →</button>
      </form>
    </div>

    <!-- STANDARD OWNER / MANAGER / STAFF LOGIN VIEW -->
    <div id="standardLoginSection">
      <form onsubmit="loginStandardRole(event)">
        <label id="idLbl" for="stdEmailInp">Email ID *</label>
        <input type="text" id="stdEmailInp" class="inp" placeholder="owner@gym.com">

        <label for="stdPassInp">Password *</label>
        <input type="password" id="stdPassInp" class="inp" placeholder="Enter password">

        <label for="stdSecInp">Security Question Answer *</label>
        <input type="text" id="stdSecInp" class="inp" placeholder="Answer your security question">

        <div id="stdErr" class="msg-err"></div>
        <button type="submit" class="btn-main">Login to Gym Dashboard</button>
      </form>
    </div>
  </div>

  <script>
    const PRIME_MASTER_MPIN = "8336";
    let activePortalRole = "owner";

    function selectPortalRole(r) {
      activePortalRole = r;
      ["owner", "manager", "staff", "prime"].forEach(function (k) {
        var b = document.getElementById("roleBtn" + k.charAt(0).toUpperCase() + k.slice(1));
        if (b) b.classList.toggle("active", k === r);
      });
      var isPrime = (r === "prime");
      document.getElementById("primeMasterLoginSection").style.display = isPrime ? "block" : "none";
      document.getElementById("standardLoginSection").style.display = isPrime ? "none" : "block";

      if (isPrime) {
        document.getElementById("portalTitle").textContent = "Prime Master Login";
        document.getElementById("portalSub").textContent = "App Developer MPIN Access";
        var mInp = document.getElementById("pmMpinInput");
        if (mInp) mInp.focus();
      } else if (r === "manager") {
        document.getElementById("portalTitle").textContent = "Manager Login";
        document.getElementById("portalSub").textContent = "Manager Portal";
        document.getElementById("idLbl").textContent = "Manager ID / Email *";
      } else if (r === "staff") {
        document.getElementById("portalTitle").textContent = "Staff Login";
        document.getElementById("portalSub").textContent = "Staff Portal";
        document.getElementById("idLbl").textContent = "Staff ID / Email *";
      } else {
        document.getElementById("portalTitle").textContent = "Gym Owner Login";
        document.getElementById("portalSub").textContent = "Gym Owner Portal — Email + Password/MPIN + Security Question";
        document.getElementById("idLbl").textContent = "Email ID *";
      }
    }

    function loginPrimeMasterOnly(ev) {
      ev.preventDefault();
      var code = (document.getElementById("pmMpinInput").value || "").trim();
      var errEl = document.getElementById("pmErr");
      if (code !== PRIME_MASTER_MPIN) {
        errEl.textContent = "Galat MPIN.";
        return;
      }
      errEl.textContent = "";
      try {
        localStorage.setItem("om_prime_master_auth", "1");
        localStorage.setItem("om_is_master_admin", "1");
        localStorage.setItem("om_logged_user", "Prime Master");
      } catch (e) {}
      location.replace("developer-saas-admin.html");
    }

    function loginStandardRole(ev) {
      ev.preventDefault();
      var idVal = (document.getElementById("stdEmailInp").value || "").trim();
      var errEl = document.getElementById("stdErr");
      if (!idVal) {
        errEl.textContent = "Email / ID darj karein.";
        return;
      }
      errEl.textContent = "";
      try {
        localStorage.setItem("bfc_role", activePortalRole);
        localStorage.setItem("om_active_role", activePortalRole);
        localStorage.setItem("om_logged_user", idVal);
        localStorage.setItem("om_session_active", "1");
      } catch (e) {}
      location.replace("index.html");
    }
  </script>
</body>
</html>
