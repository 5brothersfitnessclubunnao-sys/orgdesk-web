<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal SaaS Portal - Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    :root { --bg:#0b0b0d; --card:#16161a; --border:#2c2c35; --ac:#ffcc00; --tx:#f0f0f5; --mut:#9999a8; --ok:#2ecc71; --err:#e74c3c; }
    *{box-sizing:border-box}
    body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .auth-box{max-width:420px;width:100%;background:var(--card);border:2px solid var(--ac);border-radius:22px;padding:24px;box-shadow:0 0 30px rgba(255,204,0,.15)}
    .header{text-align:center;margin-bottom:16px;border-bottom:1.5px dashed var(--border);padding-bottom:12px}
    .badge{background:var(--ac);color:#000;font-size:9px;font-weight:900;padding:2px 10px;border-radius:10px;display:inline-block;margin-bottom:6px}
    .header h2{color:var(--ac);margin:0;font-size:22px;font-weight:900}
    .header p{color:var(--mut);font-size:12px;margin:4px 0 0}
    .tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
    .tab{flex:1;text-align:center;padding:10px;font-weight:800;font-size:16px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
    .tab.on{color:var(--ac);border-bottom-color:var(--ac)}
    .seg{display:flex;gap:8px;margin-bottom:12px}
    .seg button{flex:1;background:#0b0b0d;border:2px solid var(--border);color:#fff;font-weight:800;font-size:13px;padding:11px 4px;border-radius:12px;cursor:pointer}
    .seg button.on{background:var(--ac);color:#000;border-color:var(--ac)}
    .hint{font-size:11px;color:var(--mut);margin:-4px 0 12px;line-height:1.5}
    .field{margin-bottom:12px}
    label{display:block;font-size:12px;color:#ddd;margin-bottom:5px;font-weight:700}
    .wrap{position:relative}
    input{width:100%;background:#0b0b0d;border:1.5px solid var(--border);color:#fff;padding:13px;border-radius:12px;font-size:14px;outline:none}
    input:focus{border-color:var(--ac)}
    .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;cursor:pointer;color:#fff}
    .code-in{border:1.5px dashed var(--ac);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
    .btn-main{width:100%;background:var(--ac);color:#000;font-weight:900;padding:14px;border:none;border-radius:12px;cursor:pointer;font-size:16px;margin-top:6px}
    .btn-main:disabled{opacity:.6}
    .links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px}
    .links a{color:var(--ac);cursor:pointer}
    .msg{padding:9px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none;text-align:center;line-height:1.5}
    .err{background:rgba(231,76,60,.15);border:1px solid var(--err);color:#ff7b6b}
    .okm{background:rgba(46,204,113,.15);border:1px solid var(--ok);color:var(--ok)}
    .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99;justify-content:center;align-items:flex-start;padding:16px;overflow-y:auto}
    .ov.show{display:flex}
    .cbox{background:var(--card);border:2px solid var(--ac);border-radius:18px;padding:20px;max-width:420px;width:100%;margin:auto;text-align:center}
    .code-big{background:#0b0b0d;border:2px dashed var(--ac);border-radius:12px;color:var(--ac);font-size:20px;font-weight:900;letter-spacing:2px;padding:14px 6px;margin:12px 0;word-break:break-all}
    .btn2{width:100%;background:#222;color:#fff;border:1.5px solid var(--border);padding:11px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:8px;font-size:13px}
  </style>
</head>
<body>
<div class="auth-box">
  <div class="header">
    <div class="badge">UNIVERSAL SAAS PORTAL</div>
    <h2 id="formTitle">Welcome Back</h2>
    <p id="formSub">Email / Mobile + Password ya Security Code se Sign In karein</p>
  </div>

  <div class="tabs">
    <div class="tab on" id="tabIn" onclick="setMode('in')">Sign In</div>
    <div class="tab" id="tabUp" onclick="setMode('up')">Sign Up</div>
  </div>

  <div id="errBox" class="msg err"></div>
  <div id="okBox" class="msg okm"></div>

  <form id="authForm" onsubmit="submitForm(event)" autocomplete="on">
    <div class="field" id="nameField" style="display:none">
      <label>Gym / Organization Name *</label>
      <input type="text" id="gymName" placeholder="अपने जिम का नाम">
    </div>

    <div class="seg" id="seg">
      <button type="button" id="mEmail" class="on" onclick="setMethod('email')">📧 Email</button>
      <button type="button" id="mMobile" onclick="setMethod('mobile')">📱 Mobile</button>
      <button type="button" id="mCode" onclick="setMethod('code')">🔑 Security Code</button>
    </div>

    <div class="field" id="idField">
      <label id="idLabel">Email Address *</label>
      <input type="text" id="idInput" placeholder="name@example.com" autocomplete="username">
    </div>

    <div class="field" id="pwField">
      <label>Password * <span id="pwHint" style="color:var(--mut);font-weight:400"></span></label>
      <div class="wrap"><input type="password" id="pwInput" placeholder="Password" autocomplete="current-password"><button type="button" class="eye" onclick="eye('pwInput',this)">👁</button></div>
    </div>

    <div class="field" id="codeField" style="display:none">
      <label style="color:var(--ac)">Unique Security Code *</label>
      <div class="wrap"><input type="password" id="codeInput" class="code-in" placeholder="SEC-XXXX-XXXX-XXXX" autocomplete="off"><button type="button" class="eye" onclick="eye('codeInput',this)">👁</button></div>
    </div>

    <div class="hint" id="upHint" style="display:none">Signup par aapke liye ek Unique Security Code banega.</div>

    <button type="submit" class="btn-main" id="submitBtn">Sign In</button>
  </form>

  <div class="links">
    <a onclick="forgot()">Forgot Password?</a>
    <span id="swText">Naya account? <a onclick="setMode('up')">Sign Up</a></span>
  </div>
</div>

<div class="ov" id="codeOv"><div class="cbox">
  <div class="badge">YOUR UNIQUE SECURITY CODE</div>
  <h3 style="color:var(--ac);margin:6px 0 2px">🔑 Ise save kar lein</h3>
  <div class="code-big" id="codeShow">-</div>
  <button class="btn2" onclick="copyCode()">📋 Copy karein</button>
  <label style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:12px">
    <input type="checkbox" id="savedChk" style="width:auto" onchange="document.getElementById('contBtn').disabled=!this.checked"> Maine code save kar liya hai
  </label>
  <button class="btn-main" id="contBtn" disabled onclick="goNext()">Aage badhein ➔</button>
</div></div>

<script>
  var CFG = { apiKey:"AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ", authDomain:"bfc-gym-215ae.firebaseapp.com", projectId:"bfc-gym-215ae", storageBucket:"bfc-gym-215ae.firebasestorage.app", messagingSenderId:"886920088571", appId:"1:886920088571:web:c4bc478d246a2700b0d95e" };
  if (!firebase.apps.length) firebase.initializeApp(CFG);
  var auth = firebase.auth(), db = firebase.firestore();
  var LS = localStorage, mode = 'in', method = 'email', nextUrl = 'index.html', pendingCode = '';
  var $ = function (i) { return document.getElementById(i); };

  function setMode(m) {
    mode = m; hide();
    $('tabIn').classList.toggle('on', m === 'in'); $('tabUp').classList.toggle('on', m === 'up');
    $('nameField').style.display = m === 'up' ? 'block' : 'none';
    $('upHint').style.display = m === 'up' ? 'block' : 'none';
    $('mCode').style.display = m === 'up' ? 'none' : 'block';
    if (m === 'up' && method === 'code') method = 'email';
    $('formTitle').textContent = m === 'up' ? 'Create Account' : 'Welcome Back';
    $('submitBtn').textContent = m === 'up' ? 'Create Account' : 'Sign In';
    $('pwHint').textContent = m === 'up' ? '(kam se kam 6 akshar)' : '';
    $('swText').innerHTML = m === 'up' ? 'Pehle se account hai? <a onclick="setMode(\'in\')">Sign In</a>' : 'Naya account? <a onclick="setMode(\'up\')">Sign Up</a>';
    setMethod(method);
  }
  function setMethod(x) {
    method = x; hide();
    ['Email', 'Mobile', 'Code'].forEach(function (n) { $('m' + n).classList.toggle('on', n.toLowerCase() === x); });
    var isCode = x === 'code';
    $('idField').style.display = isCode ? 'none' : 'block';
    $('pwField').style.display = isCode ? 'none' : 'block';
    $('codeField').style.display = isCode ? 'block' : 'none';
    $('idLabel').textContent = x === 'mobile' ? 'Mobile Number *' : 'Email Address *';
    $('idInput').placeholder = x === 'mobile' ? '10 ank ka mobile' : 'name@example.com';
    $('idInput').inputMode = x === 'mobile' ? 'numeric' : 'email';
  }
  function eye(id, b) { var i = $(id); i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? '👁' : '🙈'; }
  function hide() { $('errBox').style.display = 'none'; $('okBox').style.display = 'none'; }
  function err(t) { var e = $('errBox'); e.textContent = t; e.style.display = 'block'; $('okBox').style.display = 'none'; }
  function ok(t) { var e = $('okBox'); e.textContent = t; e.style.display = 'block'; $('errBox').style.display = 'none'; }
  function busy(b) { var s = $('submitBtn'); s.disabled = b; s.textContent = b ? 'Please wait…' : (mode === 'up' ? 'Create Account' : 'Sign In'); }

  function friendly(e) {
    var c = (e && e.code) || '';
    if (c === 'auth/email-already-in-use') return 'Yeh Email/Mobile pehle se registered hai — Sign In karein.';
    if (c === 'auth/invalid-email') return 'Email sahi nahi hai.';
    if (c === 'auth/weak-password') return 'Password kam se kam 6 akshar ka rakhein.';
    if (c === 'auth/user-not-found' || c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return 'Email/Mobile ya Password galat hai.';
    if (c === 'auth/network-request-failed') return 'Internet connection check karein.';
    return (e && e.message) || 'Login/Signup mein error aaya.';
  }

  function idToCred(raw) { raw = (raw || '').trim(); return /^\d{10}$/.test(raw) ? raw + '@orgdesk.phone' : raw; }
  async function sha(s) { var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function genCode() {
    var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint8Array(12); crypto.getRandomValues(r);
    var s = Array.prototype.map.call(r, function (x) { return A[x % 32]; }).join('');
    return 'SEC-' + s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8, 12);
  }
  function normCode(c) {
    c = (c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c.indexOf('SEC') === 0) c = c.slice(3);
    if (c.length !== 12) return '';
    return 'SEC-' + c.slice(0, 4) + '-' + c.slice(4, 8) + '-' + c.slice(8, 12);
  }
  async function codeEmail(code) { return 'c' + (await sha(code)).slice(0, 32) + '@code.orgdesk.app'; }

  function saveLocalSession(orgId, gymName) {
    var prev = {}; try { prev = JSON.parse(LS.getItem('om_org_profile') || '{}') || {}; } catch (e) {}
    var o = Object.assign({}, prev, {
      orgId: orgId,
      orgName: gymName || prev.orgName || prev.gymName || 'My Gym',
      gymName: gymName || prev.gymName || prev.orgName || 'My Gym',
      createdAt: prev.createdAt || new Date().toISOString()
    });
    LS.setItem('om_org_profile', JSON.stringify(o));
    LS.setItem('bfc_org_id', orgId);
    LS.setItem('bfc_role', 'owner');
  }

  async function afterAuth(user, justSignedUp, signupGym) {
    var orgId = user.uid;
    var gymName = signupGym || '';
    try {
      var s = await db.collection('orgs').doc(orgId).get();
      if (s.exists && s.data().gymName) gymName = s.data().gymName;
    } catch (e) {}

    saveLocalSession(orgId, gymName);
    nextUrl = 'index.html';

    if (justSignedUp) {
      pendingCode = genCode();
      try {
        await db.collection('orgs').doc(orgId).set({
          ownerUid: orgId,
          gymName: gymName,
          securityCode: pendingCode,
          createdAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {}
      var p = JSON.parse(LS.getItem('om_org_profile') || '{}');
      p.securityCode = pendingCode;
      LS.setItem('om_org_profile', JSON.stringify(p));
      $('codeShow').textContent = pendingCode;
      $('codeOv').classList.add('show');
      busy(false);
      return;
    }

    window.location.replace(nextUrl);
  }

  function goNext() { window.location.replace(nextUrl); }
  function copyCode() { try { navigator.clipboard.writeText(pendingCode); } catch (e) {} ok('Copy ho gaya ✔'); }

  async function submitForm(e) {
    e.preventDefault(); hide(); busy(true);
    try {
      if (mode === 'up') {
        var gym = $('gymName').value.trim();
        if (!gym) throw { message: 'Gym / Organization ka naam likhein.' };
        var raw = $('idInput').value.trim(), pw = $('pwInput').value;
        if (!raw) throw { message: (method === 'mobile' ? 'Mobile' : 'Email') + ' likhein.' };
        if (method === 'mobile' && !/^\d{10}$/.test(raw)) throw { message: '10 ank ka sahi mobile number likhein.' };
        var cred = await auth.createUserWithEmailAndPassword(idToCred(raw), pw);
        try { await cred.user.updateProfile({ displayName: gym }); } catch (x) {}
        await afterAuth(cred.user, true, gym);
      } else if (method === 'code') {
        var code = normCode($('codeInput').value);
        if (!code) throw { message: 'Security Code sahi format mein likhein (SEC-XXXX-XXXX-XXXX).' };
        var c2 = await auth.signInWithEmailAndPassword(await codeEmail(code), code);
        await afterAuth(c2.user, false);
      } else {
        var raw2 = $('idInput').value.trim(), pw2 = $('pwInput').value;
        if (!raw2 || !pw2) throw { message: 'Email/Mobile aur Password dono likhein.' };
        var c3 = await auth.signInWithEmailAndPassword(idToCred(raw2), pw2);
        await afterAuth(c3.user, false);
      }
    } catch (x) {
      err(friendly(x));
      busy(false);
    }
  }

  async function forgot() {
    hide();
    var raw = $('idInput').value.trim();
    if (!raw || /^\d{10}$/.test(raw)) { err('Pehle upar apna Email likhein.'); return; }
    try { await auth.sendPasswordResetEmail(raw); ok('Password reset link aapke Email par bhej diya gaya.'); } catch (x) { err(friendly(x)); }
  }

  (function init() {
    var q = new URLSearchParams(location.search);
    if (q.get('logout')) {
      ['om_org_profile', 'bfc_org_profile', 'bfc_org_id', 'bfc_role', 'bfc_active_staff', 'bfc_admin_logged_in'].forEach(function (k) { LS.removeItem(k); });
      auth.signOut().catch(function () {});
      return;
    }
    var off = auth.onAuthStateChanged(function (u) {
      off();
      if (u && !u.isAnonymous && LS.getItem('bfc_org_id')) {
        window.location.replace('index.html');
      }
    });
  })();
  setMode('in');
</script>
</body>
</html>
