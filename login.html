<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Om Software ERP — Secure Login &amp; Identity Desk</title>
  <style>
    :root {
      --bg: #050813; --card: #0A1124; --card2: #0E172F; --border: #1B294B;
      --gold: #F5A623; --gold2: #D97706; --cyan: #22D3EE; --emerald: #34D399;
      --rose: #FB7185; --tx: #FFFFFF; --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: radial-gradient(1000px 600px at 50% -10%, #152238 0%, #050813 70%);
      color: var(--tx); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 22px; padding: 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }
    .hdr-center { text-align: center; margin-bottom: 16px; }
    .om-logo {
      width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #050813; font-size: 25px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 20px; font-weight: 800; color: #fff; }
    p.sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .fg { margin-bottom: 11px; text-align: left; }
    label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
    input, select {
      width: 100%; background: #070D1C; border: 1.5px solid var(--border);
      border-radius: 11px; padding: 10px 12px; color: #fff; font-size: 13px; outline: none;
    }
    input:focus, select:focus { border-color: var(--cyan); }
    .cap-field { text-transform: uppercase; }
    .btn-gold {
      width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #050813; border: 0; border-radius: 12px; padding: 12px;
      font-size: 13.5px; font-weight: 900; cursor: pointer; margin-top: 6px;
    }
    .btn-sec {
      width: 100%; background: var(--card2); color: var(--cyan);
      border: 1px solid var(--border); border-radius: 11px; padding: 9px 12px;
      font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 6px;
    }
    .btn-link {
      background: none; border: 0; color: var(--cyan); font-size: 11.5px;
      font-weight: 700; cursor: pointer; text-decoration: underline; padding: 2px 0;
    }
    .btn-link.gold { color: var(--gold); }
    .btn-link.rose { color: var(--rose); }
    .sess-box {
      display: none; background: rgba(34,211,238,0.1); border: 1px solid var(--cyan);
      border-radius: 12px; padding: 11px; margin-bottom: 13px; font-size: 12px;
    }
    .sess-row { display: flex; gap: 8px; margin-top: 8px; }
    .sess-row button { flex: 1; padding: 8px; border-radius: 9px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .panel-box {
      display: none; background: #070D1C; border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; margin-top: 12px; font-size: 12px;
    }
    .panel-box.open { display: block; }
    .alert-err {
      display: none; background: rgba(251,113,133,0.15); border: 1px solid var(--rose);
      color: #FECDD3; border-radius: 10px; padding: 9px 11px; font-size: 11.5px; margin-top: 10px; line-height: 1.4;
    }
    .alert-ok {
      display: none; background: rgba(52,211,153,0.14); border: 1px solid var(--emerald);
      color: #D1FAE5; border-radius: 10px; padding: 9px 11px; font-size: 11.5px; margin-top: 10px; line-height: 1.4;
    }
    .forgot-bar {
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hdr-center">
      <div class="om-logo">ॐ</div>
      <h1>Om Software ERP</h1>
      <p class="sub">Admin Login First &bull; Staff Login Below</p>
    </div>

    <div id="sessionChoiceBox" class="sess-box">
      <b>Previous Session Detected:</b>
      <div id="sessionMetaText" style="font-size:11px;color:var(--muted);margin-top:3px;"></div>
      <div class="sess-row">
        <button type="button" style="background:var(--cyan);color:#050813;border:0;" onclick="resumeLastSession()">Last Session</button>
        <button type="button" style="background:#132142;color:#fff;border:1px solid var(--border);" onclick="startNewSession()">New Session</button>
      </div>
    </div>

    <form id="mainLoginForm" onsubmit="handleSignIn(event)" autocomplete="off">
      <div class="fg">
        <label>Login Mode</label>
        <select id="loginMode" onchange="switchLoginMode()">
          <option value="admin" selected>Admin Login (Email + Password + Security Question)</option>
          <option value="management">Management Login (Manager Code + Branch Code + ID + Password)</option>
          <option value="staff">Staff Login (Employee ID + Mobile No + Security Question)</option>
        </select>
      </div>

      <!-- ADMIN LOGIN FIRST -->
      <div id="adminLoginFields">
        <div class="fg">
          <label>Role</label>
          <select id="admRole">
            <option value="owner">Admin / Owner</option>
            <option value="manager">Branch Manager</option>
          </select>
        </div>
        <div class="fg">
          <label>Admin Email ID *</label>
          <input type="email" id="admEmail" placeholder="admin@gym.com" required autocomplete="off" spellcheck="false">
        </div>
        <div class="fg">
          <label>Password *</label>
          <input type="password" id="admPass" placeholder="••••••••" required autocomplete="off">
        </div>
        <div class="fg">
          <label>Security Question ❓ *</label>
          <select id="admSecQ">
            <option value="Favourite Song">Favourite Song</option>
            <option value="Favourite Person">Favourite Person</option>
            <option value="Favourite Pet">Favourite Pet</option>
          </select>
        </div>
        <div class="fg">
          <label>Security Answer *</label>
          <input type="text" id="admSecA" placeholder="Enter answer" required autocomplete="off" spellcheck="false">
        </div>
      </div>

      <!-- STAFF LOGIN BELOW -->
      <div id="staffLoginFields" style="display:none;">
        <div class="fg">
          <label>Staff Code (Capital Letters) *</label>
          <input type="text" id="stfCode" class="cap-field" placeholder="e.g. STF001UNNAO1"
                 autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
                 oninput="this.value = this.value.toUpperCase();">
        </div>
        <div class="fg">
          <label>Branch Code (Numbers Only) *</label>
          <input type="text" id="stfBranch" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 placeholder="e.g. 001" autocomplete="off" autocorrect="off" spellcheck="false"
                 oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        </div>
        <div class="fg">
          <label>Employee ID (Capital Letters) *</label>
          <input type="text" id="stfEmpId" class="cap-field" placeholder="e.g. STF0011"
                 autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
                 oninput="this.value = this.value.toUpperCase();">
        </div>
        <div class="fg">
          <label>Security Question ❓ *</label>
          <select id="stfSecQ">
            <option value="Favourite Song">Favourite Song</option>
            <option value="Favourite Person">Favourite Person</option>
            <option value="Favourite Pet">Favourite Pet</option>
          </select>
        </div>
        <div class="fg">
          <label>Security Answer *</label>
          <input type="text" id="stfSecA" placeholder="Enter security answer" autocomplete="off" spellcheck="false">
        </div>
        <div class="fg">
          <label>Password *</label>
          <input type="password" id="stfPass" placeholder="••••••••" autocomplete="off">
        </div>
      </div>

      <button type="submit" class="btn-gold">Sign In</button>

      <div style="text-align:center;margin-top:10px;">
        <button type="button" class="btn-link gold" onclick="togglePanel('firstTimePanel')">
          ✨ First Time User? Create Your Password (Max 2 Attempts)
        </button>
      </div>

      <div class="forgot-bar">
        <button type="button" class="btn-link" onclick="openForgotBox('Password')">Forgot Password</button>
        <button type="button" class="btn-link" onclick="openForgotBox('Employee ID')">Forgot Employee ID</button>
        <button type="button" class="btn-link" onclick="openForgotBox('Branch Code')">Forgot Branch Code</button>
      </div>

      <div style="text-align:center;margin-top:8px;">
        <button type="button" class="btn-link rose" onclick="togglePanel('adminResetPanel')">
          🔐 Admin Reset Password (Verify Email, DOB &amp; Mobile)
        </button>
      </div>
    </form>

    <div id="loginErrBox" class="alert-err"></div>
    <div id="loginOkBox" class="alert-ok"></div>

    <div id="firstTimePanel" class="panel-box">
      <b style="color:var(--gold);display:block;margin-bottom:8px;">Create Password (Max 2 Attempts Allowed)</b>
      <div class="fg">
        <label>Staff Code (Capital Letters) *</label>
        <input type="text" id="ftCode" class="cap-field" placeholder="e.g. STF001UNNAO1"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               oninput="this.value = this.value.toUpperCase();">
      </div>
      <div class="fg">
        <label>Branch Code (Numbers Only) *</label>
        <input type="text" id="ftBranch" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               placeholder="e.g. 001" autocomplete="off" spellcheck="false"
               oninput="this.value = this.value.replace(/[^0-9]/g, '');">
      </div>
      <div class="fg">
        <label>Employee ID (Capital Letters) *</label>
        <input type="text" id="ftEmpId" class="cap-field" placeholder="e.g. STF0011"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               oninput="this.value = this.value.toUpperCase();">
      </div>
      <div class="fg">
        <label>Choose Security Question ❓ *</label>
        <select id="ftSecQ">
          <option value="Favourite Song">Favourite Song</option>
          <option value="Favourite Person">Favourite Person</option>
          <option value="Favourite Pet">Favourite Pet</option>
        </select>
      </div>
      <div class="fg">
        <label>Your Security Answer *</label>
        <input type="text" id="ftSecA" placeholder="Answer required" autocomplete="off" spellcheck="false">
      </div>
      <div class="fg">
        <label>Create New Password *</label>
        <input type="password" id="ftNewPass" placeholder="Enter password" autocomplete="off">
      </div>
      <button type="button" class="btn-gold" onclick="saveFirstTimeStaffPassword()">Save Password</button>
    </div>

    <div id="forgotPanel" class="panel-box">
      <b id="forgotTitle" style="color:var(--cyan);display:block;margin-bottom:6px;">Forgot Details — Sent to Admin</b>
      <div class="fg">
        <label>Your Name / Mobile / Partial Detail *</label>
        <input type="text" id="fgDetail" placeholder="Enter name or mobile number" autocomplete="off">
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button type="button" class="btn-sec" style="flex:1;margin-top:0;" onclick="dispatchForgotToAdmin('Email')">✉️ Email Admin</button>
        <button type="button" class="btn-sec" style="flex:1;margin-top:0;" onclick="dispatchForgotToAdmin('Telegram')">✈️ Telegram Admin</button>
        <button type="button" class="btn-sec" style="flex:1;margin-top:0;color:var(--emerald);" onclick="dispatchForgotToAdmin('WhatsApp')">📲 WhatsApp Admin</button>
      </div>
    </div>

    <div id="adminResetPanel" class="panel-box">
      <b style="color:var(--rose);display:block;margin-bottom:6px;">Reset Password — 3-Point Document Verification</b>
      <div class="fg">
        <label>Registered Email ID *</label>
        <input type="email" id="rstEmail" placeholder="registered@email.com" autocomplete="off">
      </div>
      <div class="fg">
        <label>Date of Birth (DOB) *</label>
        <input type="date" id="rstDob">
      </div>
      <div class="fg">
        <label>Registered Mobile No *</label>
        <input type="tel" id="rstMobile" maxlength="10" placeholder="10-digit mobile" autocomplete="off">
      </div>
      <div class="fg">
        <label>Enter New Password *</label>
        <input type="password" id="rstNewPass" placeholder="New password" autocomplete="off">
      </div>
      <button type="button" class="btn-gold" onclick="verifyAndResetPassword()">Verify Documents &amp; Reset</button>
    </div>
  </div>

  <script>
    const CREDS_KEY = "om_staff_auth_records_v1";
    const LOCK_KEY = "om_staff_lock_map_v1";
    const CREATE_ATTEMPTS_KEY = "om_staff_create_attempts_v1";
    const ADMIN_LOGS_KEY = "om_admin_recovery_logs_v1";
    let forgotTargetField = "Password";

    function loadJ(k, def) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
      catch (e) { return def; }
    }
    function saveJ(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

    function seedAuthRecords() {
      const existing = loadJ(CREDS_KEY, []);
      if (!existing.length) {
        saveJ(CREDS_KEY, [
          {
            role: "owner", staffCode: "ADM001", branchCode: "001", empId: "ADM001",
            name: "Saurabh Singh Chandel", email: "admin@omsoftware.com", dob: "1992-06-01",
            mobile: "9876501100", secQ: "Favourite Song", secA: "Kesariya",
            password: "Admin@123", passwordCreated: true
          },
          {
            role: "staff", staffCode: "STF001UNNAO1", branchCode: "001", empId: "STF0011",
            name: "Vikram Yadav", email: "vikram.yadav@gmail.com", dob: "1995-05-14",
            mobile: "9876503344", secQ: "Favourite Pet", secA: "Bruno",
            password: "Staff@123", passwordCreated: true
          }
        ]);
      }
    }

    function showErr(msg) {
      const e = document.getElementById("loginErrBox");
      const ok = document.getElementById("loginOkBox");
      ok.style.display = "none"; e.style.display = "block"; e.textContent = msg;
    }

    function showOk(msg) {
      const e = document.getElementById("loginErrBox");
      const ok = document.getElementById("loginOkBox");
      e.style.display = "none"; ok.style.display = "block"; ok.textContent = msg;
    }

    function togglePanel(id) {
      ["firstTimePanel", "forgotPanel", "adminResetPanel"].forEach(pid => {
        const el = document.getElementById(pid);
        if (pid === id) el.classList.toggle("open");
        else el.classList.remove("open");
      });
    }

    function openForgotBox(field) {
      forgotTargetField = field;
      document.getElementById("forgotTitle").textContent = "Forgot " + field + " — Sent to Admin";
      ["firstTimePanel", "adminResetPanel"].forEach(pid => document.getElementById(pid).classList.remove("open"));
      document.getElementById("forgotPanel").classList.add("open");
    }

    function switchLoginMode() {
      const isStaff = document.getElementById("loginMode").value === "staff";
      document.getElementById("adminLoginFields").style.display = isStaff ? "none" : "block";
      document.getElementById("staffLoginFields").style.display = isStaff ? "block" : "none";
      ["admEmail", "admPass", "admSecA"].forEach(id => { document.getElementById(id).required = !isStaff; });
      ["stfCode", "stfBranch", "stfEmpId", "stfSecA", "stfPass"].forEach(id => { document.getElementById(id).required = isStaff; });
    }

    function saveFirstTimeStaffPassword() {
      const sc = document.getElementById("ftCode").value.trim().toUpperCase();
      const bc = document.getElementById("ftBranch").value.trim();
      const eid = document.getElementById("ftEmpId").value.trim().toUpperCase();
      const secQ = document.getElementById("ftSecQ").value;
      const secA = document.getElementById("ftSecA").value.trim();
      const pass = document.getElementById("ftNewPass").value;

      if (!sc || !bc || !eid || !secA || !pass) {
        showErr("Staff Code, Branch Code, Employee ID, Security Answer aur Password sabhi zaroori hain.");
        return;
      }

      const key = eid.toLowerCase();
      const attemptsMap = loadJ(CREATE_ATTEMPTS_KEY, {});
      const used = attemptsMap[key] || 0;

      if (used >= 2) {
        showErr("❌ Blocked! Aap 2 baar password create kar chuke hain. Contact To Admin.");
        return;
      }

      attemptsMap[key] = used + 1;
      saveJ(CREATE_ATTEMPTS_KEY, attemptsMap);

      const list = loadJ(CREDS_KEY, []);
      const idx = list.findIndex(x => x.empId.toUpperCase() === eid || x.staffCode.toUpperCase() === sc);
      const rec = {
        role: "staff", staffCode: sc, branchCode: bc, empId: eid, name: eid,
        email: "", dob: "", mobile: "", secQ, secA, password: pass, passwordCreated: true
      };
      if (idx >= 0) list[idx] = Object.assign({}, list[idx], rec);
      else list.push(rec);

      saveJ(CREDS_KEY, list);
      showOk(`Password created (${attemptsMap[key]}/2 attempts used). Ab aap login kar sakte hain.`);
      document.getElementById("firstTimePanel").classList.remove("open");
      document.getElementById("loginMode").value = "staff";
      switchLoginMode();
      document.getElementById("stfCode").value = sc;
      document.getElementById("stfBranch").value = bc;
      document.getElementById("stfEmpId").value = eid;
      document.getElementById("stfSecQ").value = secQ;
    }

    function check24HrLock(keyId) {
      const locks = loadJ(LOCK_KEY, {});
      const entry = locks[keyId];
      if (!entry) return { locked: false, remMs: 0 };
      if (entry.lockUntil && Date.now() < entry.lockUntil) return { locked: true, remMs: entry.lockUntil - Date.now() };
      if (entry.lockUntil && Date.now() >= entry.lockUntil) { delete locks[keyId]; saveJ(LOCK_KEY, locks); }
      return { locked: false, remMs: 0 };
    }

    function recordFailedAttempt(keyId) {
      const locks = loadJ(LOCK_KEY, {});
      const cur = locks[keyId] || { fails: 0, lockUntil: 0 };
      cur.fails += 1;
      if (cur.fails >= 3) {
        cur.lockUntil = Date.now() + (24 * 60 * 60 * 1000);
        locks[keyId] = cur; saveJ(LOCK_KEY, locks);
        return { blocked24h: true, fails: cur.fails };
      }
      locks[keyId] = cur; saveJ(LOCK_KEY, locks);
      return { blocked24h: false, fails: cur.fails };
    }

    function clearFailedAttempts(keyId) {
      const locks = loadJ(LOCK_KEY, {});
      if (locks[keyId]) { delete locks[keyId]; saveJ(LOCK_KEY, locks); }
    }

    function handleSignIn(e) {
      e.preventDefault();
      const mode = document.getElementById("loginMode").value;
      const list = loadJ(CREDS_KEY, []);

      if (mode === "admin") {
        const role = document.getElementById("admRole").value;
        const em = document.getElementById("admEmail").value.trim();
        const pass = document.getElementById("admPass").value;
        const secQ = document.getElementById("admSecQ").value;
        const secA = document.getElementById("admSecA").value.trim();
        if (!secA) { showErr("Security Question ka answer dalna zaroori hai."); return; }

        const lockKey = (em || "admin").toLowerCase();
        const st = check24HrLock(lockKey);
        if (st.locked) { showErr(`Account 24 hours ke liye block hai. Contact To Admin.`); return; }

        clearFailedAttempts(lockKey);
        localStorage.setItem("bfc_role", role);
        localStorage.setItem("om_logged_user", em);
        localStorage.setItem("om_last_session_info", JSON.stringify({ user: em, role, savedAt: new Date().toLocaleString("en-IN") }));
        localStorage.removeItem("om_splash_shown");
        localStorage.setItem("om_last_active_time", String(Date.now()));
        localStorage.setItem("om_bg_timestamp", String(Date.now()));
        location.replace("index.html");
      } else {
        const sc = document.getElementById("stfCode").value.trim().toUpperCase();
        const bc = document.getElementById("stfBranch").value.trim();
        const eid = document.getElementById("stfEmpId").value.trim().toUpperCase();
        const secQ = document.getElementById("stfSecQ").value;
        const secA = document.getElementById("stfSecA").value.trim();
        const pass = document.getElementById("stfPass").value;
        if (!secA) { showErr("Security Question ka answer dalna zaroori hai."); return; }

        const lockKey = (eid || sc || "unknown").toLowerCase();
        const st = check24HrLock(lockKey);
        if (st.locked) { showErr(`Account 24 hours ke liye block hai. Contact To Admin.`); return; }

        const matched = list.find(u =>
          u.role === "staff" && u.staffCode.toUpperCase() === sc && u.branchCode === bc &&
          u.empId.toUpperCase() === eid && u.password === pass && u.secQ === secQ &&
          u.secA.toLowerCase() === secA.toLowerCase()
        );

        if (!matched) {
          const res = recordFailedAttempt(lockKey);
          showErr(res.blocked24h ? "3 galat attempts! Account 24 hours ke liye block. Contact To Admin." : `Invalid credentials (${res.fails}/3 attempts).`);
          return;
        }

        clearFailedAttempts(lockKey);
        localStorage.setItem("bfc_role", "staff");
        localStorage.setItem("om_logged_user", `${matched.empId} (${matched.name})`);
        localStorage.setItem("om_last_session_info", JSON.stringify({ user: `${matched.empId} (${matched.name})`, role: "staff", branch: matched.branchCode, savedAt: new Date().toLocaleString("en-IN") }));
        localStorage.removeItem("om_splash_shown");
        localStorage.setItem("om_last_active_time", String(Date.now()));
        localStorage.setItem("om_bg_timestamp", String(Date.now()));
        location.replace("index.html");
      }
    }

    function dispatchForgotToAdmin(channel) {
      const info = document.getElementById("fgDetail").value.trim();
      if (!info) { showErr("Kripya apna naam ya mobile number dalein."); return; }
      const logs = loadJ(ADMIN_LOGS_KEY, []);
      logs.unshift({ type: "Forgot " + forgotTargetField, detail: info, channel, time: new Date().toLocaleString("en-IN") });
      saveJ(ADMIN_LOGS_KEY, logs);
      const msg = `Sent to Admin to Know Your ${forgotTargetField}: ${info}`;
      showOk(`${msg} (${channel})`);
      if (channel === "Email") window.location.href = `mailto:admin@omsoftware.com?subject=${encodeURIComponent(forgotTargetField)}&body=${encodeURIComponent(msg)}`;
      else if (channel === "WhatsApp") window.open(`https://wa.me/919140417259?text=${encodeURIComponent(msg)}`, "_blank");
      else if (channel === "Telegram") window.open(`https://t.me/share/url?url=${encodeURIComponent("Om Software ERP")}&text=${encodeURIComponent(msg)}`, "_blank");
    }

    function verifyAndResetPassword() {
      const em = document.getElementById("rstEmail").value.trim().toLowerCase();
      const dob = document.getElementById("rstDob").value.trim();
      const mob = document.getElementById("rstMobile").value.trim();
      const newPass = document.getElementById("rstNewPass").value;
      if (!em || !dob || !mob || !newPass) { showErr("Email ID, DOB, Mobile No aur New Password sab zaroori hain."); return; }

      const list = loadJ(CREDS_KEY, []);
      const idx = list.findIndex(u => (u.email || "").toLowerCase() === em && (u.dob || "") === dob && (u.mobile || "") === mob);
      if (idx === -1) { showErr("Rok diya gaya: Email ID, DOB aur Mobile No record se match nahi karte."); return; }

      list[idx].password = newPass;
      saveJ(CREDS_KEY, list);
      clearFailedAttempts(em);
      showOk(`Verified! ${list[idx].name} ka password reset ho gaya hai.`);
      document.getElementById("adminResetPanel").classList.remove("open");
    }

    function resumeLastSession() {
      const last = loadJ("om_last_session_info", null);
      if (last && last.user) {
        localStorage.setItem("om_logged_user", last.user);
        localStorage.setItem("bfc_role", last.role || "owner");
        localStorage.setItem("om_last_active_time", String(Date.now()));
        localStorage.setItem("om_bg_timestamp", String(Date.now()));
        location.replace("index.html");
      }
    }

    function startNewSession() {
      localStorage.removeItem("om_logged_user");
      document.getElementById("sessionChoiceBox").style.display = "none";
    }

    
    // 10-minute inactivity check on login page & back button confirmation
    (function setupLoginGuards() {
      const TEN_MIN = 10 * 60 * 1000;
      let loginIdleStart = Date.now();
      ["click", "touchstart", "keydown", "mousemove", "scroll"].forEach(ev => {
        window.addEventListener(ev, () => { loginIdleStart = Date.now(); }, { passive: true });
      });
      setInterval(() => {
        if (Date.now() - loginIdleStart >= TEN_MIN) {
          localStorage.removeItem("om_logged_user");
          const frm = document.getElementById("mainLoginForm");
          if (frm) frm.reset();
          showErr("10 minute se koi activity na hone par session logout/reset kar diya gaya hai.");
          loginIdleStart = Date.now();
        }
      }, 15000);

      try {
        history.pushState({ omLoginGuard: true }, "", location.href);
        window.addEventListener("popstate", function () {
          const ok = confirm("Kya aap Logout karna chahte hain? (OK = Yes, Cancel = No)");
          if (ok) {
            localStorage.removeItem("om_logged_user");
            const frm = document.getElementById("mainLoginForm");
            if (frm) frm.reset();
          } else {
            history.pushState({ omLoginGuard: true }, "", location.href);
          }
        });
      } catch (e) {}
    })();

    window.addEventListener("DOMContentLoaded", function() {
      seedAuthRecords();
      switchLoginMode();
      const last = loadJ("om_last_session_info", null);
      if (last && last.user) {
        document.getElementById("sessionChoiceBox").style.display = "block";
        document.getElementById("sessionMetaText").textContent = `${last.user} (${last.role}) • ${last.savedAt || ""}`;
      }
    });
  </script>
</body>
</html>
