<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Login — Om Software</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#050814;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:460px;background:#0b1226;border:1.5px solid #26365e;border-radius:18px;padding:22px 18px}
.badge{display:inline-block;background:rgba(245,166,35,.15);border:1px solid #f5a623;color:#ffd166;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px;cursor:pointer}
h1{font-size:20px;font-weight:900;color:#ffd166;margin-bottom:4px}
.sub{font-size:12px;color:#94a3b8;margin-bottom:14px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rtab{padding:9px 6px;border-radius:10px;border:1.5px solid #2b3a63;background:#070c1a;color:#cbd5e1;font-size:12px;font-weight:800;cursor:pointer}
.rtab.active{background:#f5a623;color:#050814;border-color:#f5a623}
.auth-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mbtn{padding:8px 6px;border-radius:9px;border:1px solid #26365e;background:#0e1730;color:#e2e8f0;font-size:11.5px;font-weight:800;cursor:pointer}
.mbtn.active{background:#22d3ee;color:#050814;border-color:#22d3ee}
.fg{margin-bottom:11px}
label{display:block;font-size:11.5px;color:#cbd5e1;font-weight:700;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:13px;outline:none}
.chk-row{display:flex;align-items:center;gap:8px;margin:8px 0 12px;background:#070c1a;border:1px solid #1e2d52;border-radius:10px;padding:9px 11px;cursor:pointer}
.chk-row input{width:16px;height:16px;accent-color:#22d3ee}
.chk-row span{font-size:12px;color:#e2e8f0;font-weight:700}
.primary-btn{width:100%;padding:12px;border-radius:11px;border:none;background:linear-gradient(135deg,#ffd166,#f5a623);color:#050814;font-size:13.5px;font-weight:900;cursor:pointer}
.links-row{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}
.link-btn{background:none;border:none;color:#38bdf8;font-weight:800;cursor:pointer;text-decoration:underline}
.msg-box{display:none;margin-top:10px;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700}
.err-box{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5}
.ok-box{background:rgba(34,211,238,.12);border:1px solid #22d3ee;color:#bae6fd}
.saved-bar{display:none;margin-bottom:10px;background:#081426;border:1px dashed #22d3ee;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#bae6fd;justify-content:space-between;align-items:center}
.saved-bar button{background:#22d3ee;color:#050814;border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<script>
(function () {
  var MODE_KEY = "om_locked_app_mode_v1";
  var LOGGED_KEY = "om_session_active_v1";

  function getLockedMode() {
    try {
      var m = localStorage.getItem(MODE_KEY);
      if (m === "light" || m === "full") return m;
      var legacy = localStorage.getItem("om_app_display_mode");
      if (legacy === "light" || legacy === "full") {
        localStorage.setItem(MODE_KEY, legacy);
        return legacy;
      }
    } catch (e) {}
    return "light";
  }

  function setLockedMode(mode, explicitSwitch) {
    if (!explicitSwitch) return;
    var target = (mode === "full") ? "full" : "light";
    try {
      localStorage.setItem(MODE_KEY, target);
      localStorage.setItem("om_app_display_mode", target);
      localStorage.setItem(LOGGED_KEY, "1");
    } catch (e) {}
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: target } }));
  }

  function clearSessionOnLogout() {
    try {
      localStorage.removeItem(LOGGED_KEY);
      localStorage.removeItem("om_session_active");
    } catch (e) {}
  }

  window.omGetLockedMode = getLockedMode;
  window.omSetLockedMode = setLockedMode;
  window.omClearSessionOnLogout = clearSessionOnLogout;

  // Keep mode locked across browser back/forward (pageshow)
  window.addEventListener("pageshow", function () {
    var m = getLockedMode();
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: m } }));
  });
})();
</script>

<div class="card">
  <div style="text-align:center">
    <span class="badge" id="devBadge">OM SOFTWARE • MULTI-BUSINESS</span>
    <h1 id="portalTitle">Owner Login Portal</h1>
    <div class="sub" id="portalSub">Sign In or Owner Sign Up</div>
  </div>

  <div class="role-tabs">
    <button type="button" class="rtab active" data-role="owner" id="tabOwner">Owner</button>
    <button type="button" class="rtab" data-role="manager" id="tabManager">Manager</button>
    <button type="button" class="rtab" data-role="staff" id="tabStaff">Staff</button>
  </div>

  <div class="auth-modes" id="authModeBar">
    <button type="button" class="mbtn active" data-mode="signin" id="btnSignInMode">Sign In</button>
    <button type="button" class="mbtn" data-mode="signup" id="btnSignUpMode">New Sign Up</button>
  </div>

  <div class="saved-bar" id="savedCredBar">
    <span id="savedCredText">Saved login</span>
    <button type="button" id="btnQuickFill">Quick Fill</button>
  </div>

  <form id="loginForm">
    <div class="fg" id="empIdGroup" style="display:none">
      <label id="empIdLabel">Employee / Manager ID *</label>
      <input type="text" id="empIdInput" placeholder="Enter STF / MGR Code">
    </div>

    <div id="ownerSignUpBox" style="display:none">
      <div class="fg">
        <label>Business Name *</label>
        <input type="text" id="suBizName" placeholder="Gym / Shop / Dealership Name">
      </div>
      <div class="fg">
        <label>Staff Count *</label>
        <input type="number" id="suStaffCount" min="1" placeholder="e.g. 10 or 120">
      </div>
      <div class="fg">
        <label>App Mode</label>
        <select id="suModeSel">
          <option value="light">Light Mode (&lt;100 Staff / Single)</option>
          <option value="full">Full App Mode (Commercial)</option>
        </select>
      </div>
    </div>

    <div class="fg">
      <label>Email ID / Mobile Number *</label>
      <input type="text" id="emailInput" required placeholder="Enter email or mobile">
    </div>

    <div class="fg">
      <label>Password / MPIN *</label>
      <input type="password" id="passInput" required placeholder="Enter password or MPIN">
    </div>

    <label class="chk-row" for="savePassChk">
      <input type="checkbox" id="savePassChk">
      <span>Save password for faster next login</span>
    </label>

    <button type="submit" class="primary-btn" id="submitBtn">Login to Dashboard</button>
  </form>

  <div class="msg-box err-box" id="errBox"></div>
  <div class="msg-box ok-box" id="okBox"></div>

  <div class="links-row">
    <button type="button" class="link-btn" id="btnForgotPass">Forgot Password</button>
    <button type="button" class="link-btn" id="btnForgotMpin">Forgot MPIN</button>
  </div>
</div>

<script>
(function () {
  var role = "owner";
  var mode = "signin";
  var ACC_KEY = "om_accounts_v2";
  var SAVED_KEY = "om_saved_by_role_v2";

  function readAcc() {
    try { return JSON.parse(localStorage.getItem(ACC_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function writeAcc(a) {
    try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) {}
  }
  function readSaved() {
    try { return JSON.parse(localStorage.getItem(SAVED_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function writeSaved(s) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function setErr(t) {
    var e = document.getElementById("errBox"), o = document.getElementById("okBox");
    if (o) o.style.display = "none";
    if (e) { e.style.display = "block"; e.textContent = t; }
  }
  function setOk(t) {
    var e = document.getElementById("errBox"), o = document.getElementById("okBox");
    if (e) e.style.display = "none";
    if (o) { o.style.display = "block"; o.textContent = t; }
  }
  function clearMsg() {
    var e = document.getElementById("errBox"), o = document.getElementById("okBox");
    if (e) { e.style.display = "none"; e.textContent = ""; }
    if (o) { o.style.display = "none"; o.textContent = ""; }
  }

  function refreshSavedUI() {
    var bar = document.getElementById("savedCredBar");
    var txt = document.getElementById("savedCredText");
    if (!bar || !txt) return;
    var item = readSaved()[role];
    if (item && item.id) {
      bar.style.display = "flex";
      txt.textContent = "Saved (" + role.toUpperCase() + "): " + item.id;
    } else {
      bar.style.display = "none";
    }
  }

  function applyRole(newRole) {
    role = newRole;
    clearMsg();
    document.getElementById("emailInput").value = "";
    document.getElementById("passInput").value = "";
    document.getElementById("empIdInput").value = "";
    document.getElementById("savePassChk").checked = false;

    ["owner", "manager", "staff"].forEach(function (r) {
      var b = document.getElementById("tab" + r.charAt(0).toUpperCase() + r.slice(1));
      if (b) b.classList.toggle("active", r === role);
    });

    var signUpBtn = document.getElementById("btnSignUpMode");
    var signInBtn = document.getElementById("btnSignInMode");
    var suBox = document.getElementById("ownerSignUpBox");
    var empGrp = document.getElementById("empIdGroup");
    var empLbl = document.getElementById("empIdLabel");
    var title = document.getElementById("portalTitle");
    var subBtn = document.getElementById("submitBtn");

    if (role !== "owner") {
      mode = "signin";
      if (signUpBtn) signUpBtn.style.display = "none";
      if (signInBtn) { signInBtn.classList.add("active"); signInBtn.style.gridColumn = "1 / -1"; }
      if (suBox) suBox.style.display = "none";
      if (empGrp) empGrp.style.display = "block";
      if (empLbl) empLbl.textContent = (role === "manager" ? "Manager ID / Code *" : "Employee ID *");
      if (title) title.textContent = (role === "manager" ? "Manager Sign In" : "Staff Sign In");
      if (subBtn) subBtn.textContent = (role === "manager" ? "Manager Sign In" : "Staff Sign In");
    } else {
      if (signUpBtn) { signUpBtn.style.display = ""; signUpBtn.classList.toggle("active", mode === "signup"); }
      if (signInBtn) { signInBtn.style.gridColumn = ""; signInBtn.classList.toggle("active", mode === "signin"); }
      if (suBox) suBox.style.display = (mode === "signup") ? "block" : "none";
      if (empGrp) empGrp.style.display = "none";
      if (title) title.textContent = "Owner Portal";
      if (subBtn) subBtn.textContent = (mode === "signup") ? "Create Owner Account" : "Login to Dashboard";
    }
    refreshSavedUI();
  }

  document.querySelectorAll("[data-role]").forEach(function (btn) {
    btn.addEventListener("click", function () { applyRole(btn.getAttribute("data-role")); });
  });

  document.getElementById("btnSignInMode").addEventListener("click", function () {
    if (role === "owner") { mode = "signin"; applyRole("owner"); }
  });
  document.getElementById("btnSignUpMode").addEventListener("click", function () {
    if (role === "owner") { mode = "signup"; applyRole("owner"); }
  });

  document.getElementById("suStaffCount").addEventListener("input", function () {
    var cnt = Number(this.value || 0);
    var sel = document.getElementById("suModeSel");
    if (sel && cnt > 0) sel.value = (cnt < 100) ? "light" : "full";
  });

  document.getElementById("btnQuickFill").addEventListener("click", function () {
    var item = readSaved()[role];
    if (!item) return;
    document.getElementById("emailInput").value = item.id || "";
    document.getElementById("passInput").value = item.pass || "";
    if (item.empId) document.getElementById("empIdInput").value = item.empId;
    setOk("Saved credentials filled.");
  });

  document.getElementById("btnForgotPass").addEventListener("click", function () {
    var idVal = document.getElementById("emailInput").value.trim() || prompt("Email ID ya Mobile Number darj karein:") || "";
    idVal = idVal.trim();
    if (!idVal) return setErr("Email ID ya Mobile Number zaroori hai.");
    var norm = idVal.toLowerCase();
    var digits = norm.replace(/\D/g, "");
    var found = readAcc().some(function (a) {
      return String(a.id || "").toLowerCase() === norm || (digits.length >= 10 && String(a.phone || "") === digits.slice(-10));
    });
    if (found) {
      setOk(digits.length >= 10 ? "already Mobile no registered" : "already registered");
    } else {
      setOk("Reset request sent for " + idVal + ".");
    }
  });

  document.getElementById("btnForgotMpin").addEventListener("click", function () {
    setOk(role === "owner" ? "MPIN reset link/request sent." : "MPIN reset request sent to Owner for approval.");
  });

  document.getElementById("loginForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    clearMsg();
    var idVal = document.getElementById("emailInput").value.trim();
    var passVal = document.getElementById("passInput").value.trim();
    var empId = document.getElementById("empIdInput").value.trim();
    if (!idVal || !passVal) return setErr("Wrong pass Please enter correct pass");
    if (role !== "owner" && !empId) return setErr("Employee / Manager ID zaroori hai.");

    var norm = idVal.toLowerCase();
    var digits = norm.replace(/\D/g, "");
    var accs = readAcc();
    var chosenMode = "light";

    if (role === "owner" && mode === "signup") {
      var exists = accs.some(function (a) {
        return String(a.id || "").toLowerCase() === norm || (digits.length >= 10 && String(a.phone || "") === digits.slice(-10));
      });
      if (exists) return setErr(digits.length >= 10 ? "already Mobile no registered" : "already registered");

      var bizName = document.getElementById("suBizName").value.trim();
      var staffCnt = Number(document.getElementById("suStaffCount").value || 0);
      chosenMode = document.getElementById("suModeSel").value || (staffCnt < 100 ? "light" : "full");
      accs.push({
        role: "owner",
        id: idVal,
        phone: digits.length >= 10 ? digits.slice(-10) : "",
        password: passVal,
        bizName: bizName,
        mode: chosenMode
      });
      writeAcc(accs);
      if (bizName) {
        try { localStorage.setItem("om_active_gym_profile", JSON.stringify({ gymName: bizName, mode: chosenMode })); } catch (e) {}
      }
    } else {
      var match = accs.find(function (a) {
        return String(a.id || "").toLowerCase() === norm || (digits.length >= 10 && String(a.phone || "") === digits.slice(-10));
      });
      if (match && match.password && match.password !== passVal) {
        return setErr("Wrong pass Please enter correct pass");
      }
      if (passVal.length < 4) return setErr("Wrong pass Please enter correct pass");
      if (match && match.mode) chosenMode = match.mode;
    }

    if (document.getElementById("savePassChk").checked) {
      var sMap = readSaved();
      sMap[role] = { id: idVal, pass: passVal, empId: empId };
      writeSaved(sMap);
    }

    window.omSetLockedMode(chosenMode, true);
    try {
      localStorage.setItem("om_active_role", role);
      localStorage.setItem("om_logged_user", empId ? (empId + " (" + idVal + ")") : idVal);
    } catch (e) {}
    location.href = "app.html";
  });

  var taps = 0, tmr = null;
  document.getElementById("devBadge").addEventListener("click", function () {
    taps++;
    clearTimeout(tmr);
    tmr = setTimeout(function () { taps = 0; }, 2200);
    if (taps >= 5) { taps = 0; location.href = "prime-master-login.html"; }
  });

  applyRole("owner");
})();
</script>
</body>
</html>
