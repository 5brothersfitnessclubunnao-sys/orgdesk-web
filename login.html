<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gym ERP — Login &amp; Gym Registration</title>
<style>
  :root {
    --gold: #ffcc00;
    --gold-dark: #d4a000;
    --bg: #07090f;
    --card: #111622;
    --card-2: #171e2e;
    --border: #263046;
    --green: #00ff66;
    --red: #ff4d4d;
    --cyan: #38bdf8;
    --text: #ffffff;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  body {
    background: radial-gradient(circle at top, #1b2234 0%, #07090f 75%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .shell {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1.5px solid var(--gold);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  }
  .top-badge {
    display: inline-block;
    background: rgba(255, 204, 0, 0.14);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 10px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .hdr { text-align: center; margin-bottom: 14px; border-bottom: 1px dashed var(--border); padding-bottom: 12px; }
  .hdr h1 { font-size: 19px; color: var(--gold); font-weight: 900; }
  .hdr p { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .mode-btn {
    padding: 10px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--card-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .mode-btn.active {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
  }
  .role-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    background: #0b0f19;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .role-btn {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 800;
    padding: 7px 4px;
    border-radius: 7px;
    cursor: pointer;
  }
  .role-btn.active {
    background: var(--cyan);
    color: #050813;
  }
  .fg { margin-bottom: 10px; }
  label { display: block; font-size: 11px; color: #cbd5e1; font-weight: 700; margin-bottom: 4px; }
  input, select {
    width: 100%;
    background: #090d16;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 10px 11px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--gold); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #000;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-secondary {
    width: 100%;
    background: var(--card-2);
    color: var(--cyan);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .msg-box {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: 9px;
    font-size: 11.5px;
    line-height: 1.45;
  }
  .msg-err { background: rgba(255, 77, 77, 0.14); border: 1px solid var(--red); color: #fecaca; }
  .msg-ok { background: rgba(0, 255, 102, 0.14); border: 1px solid var(--green); color: #bbf7d0; }
  .active-gym-banner {
    background: rgba(0, 255, 102, 0.08);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 11.5px;
    color: #bbf7d0;
  }
  .quick-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .quick-nav a {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #101726;
    border: 1px solid #334155;
    color: #fff;
    padding: 9px;
    border-radius: 9px;
    font-size: 11.5px;
    font-weight: 800;
  }
  .quick-nav a:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div class="top-badge">Universal Gym ERP</div>
    <h1 id="loginGymTitle">GYM LOGIN &amp; REGISTRATION</h1>
    <p id="loginGymSub">Jis gym ke naam se login ya register karenge, wahi data chalega</p>
  </div>

  <div id="activeGymBox" class="active-gym-banner" style="display:none;"></div>

  <div class="mode-switch">
    <button type="button" class="mode-btn active" id="btnTabLogin" onclick="switchAuthTab('login')">🔑 Login</button>
    <button type="button" class="mode-btn" id="btnTabRegister" onclick="switchAuthTab('register')">📝 Gym Registration</button>
  </div>

  <!-- LOGIN SECTION -->
  <form id="loginSection" onsubmit="handleLoginSubmit(event)">
    <div class="role-bar">
      <button type="button" class="role-btn active" data-role="owner" onclick="selectRole('owner')">Owner</button>
      <button type="button" class="role-btn" data-role="master" onclick="selectRole('master')">Master</button>
      <button type="button" class="role-btn" data-role="manager" onclick="selectRole('manager')">Manager</button>
      <button type="button" class="role-btn" data-role="staff" onclick="selectRole('staff')">Staff</button>
    </div>

    <div class="fg">
      <label>Gym Name *</label>
      <input type="text" id="loginGymName" required placeholder="Apne Gym ka naam likhein">
    </div>
    <div class="row2">
      <div class="fg">
        <label>Email / ID *</label>
        <input type="text" id="loginUser" required placeholder="user@gym.com or ID">
      </div>
      <div class="fg">
        <label>Password *</label>
        <input type="password" id="loginPass" required placeholder="Password">
      </div>
    </div>

    <button type="submit" class="btn-primary">🚀 Login &amp; Set Active Gym</button>
    <button type="button" class="btn-secondary" onclick="switchAuthTab('register')">➕ Naya Gym Register Karein</button>
  </form>

  <!-- REGISTRATION SECTION -->
  <form id="registerSection" style="display:none;" onsubmit="handleRegisterSubmit(event)">
    <div class="fg">
      <label>New Gym Name *</label>
      <input type="text" id="regGymName" required placeholder="Gym ka naam darj karen">
    </div>
    <div class="row2">
      <div class="fg">
        <label>Owner / Admin Name *</label>
        <input type="text" id="regOwnerName" required placeholder="Owner ka naam">
      </div>
      <div class="fg">
        <label>Mobile Number *</label>
        <input type="tel" id="regPhone" maxlength="10" required placeholder="10-digit mobile">
      </div>
    </div>
    <div class="fg">
      <label>Gym Address / City *</label>
      <input type="text" id="regAddress" required placeholder="City / Locality">
    </div>
    <div class="row2">
      <div class="fg">
        <label>Login Email *</label>
        <input type="email" id="regEmail" required placeholder="admin@gym.com">
      </div>
      <div class="fg">
        <label>Create Password *</label>
        <input type="password" id="regPass" required placeholder="Create password">
      </div>
    </div>

    <button type="submit" class="btn-primary">✅ Register Gym &amp; Continue</button>
    <button type="button" class="btn-secondary" onclick="switchAuthTab('login')">← Wapas Login Par Jayein</button>
  </form>

  <div id="authMsg" class="msg-box"></div>

  <div class="quick-nav">
    <a href="attendance.html">📸 Attendance Kiosk</a>
    <a href="admission.html">📝 Admission Form</a>
    <a href="pay.html">💳 Fees &amp; Billing</a>
    <a href="#" onclick="clearActiveGymSession(); return false;">🔄 Reset Gym</a>
  </div>
</div>

<script>
  let selectedRole = "owner";

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll(".role-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-role") === role);
    });
  }

  function switchAuthTab(tab) {
    const isReg = tab === "register";
    document.getElementById("loginSection").style.display = isReg ? "none" : "block";
    document.getElementById("registerSection").style.display = isReg ? "block" : "none";
    document.getElementById("btnTabLogin").classList.toggle("active", !isReg);
    document.getElementById("btnTabRegister").classList.toggle("active", isReg);
    hideMsg();
  }

  function showMsg(text, isErr) {
    const el = document.getElementById("authMsg");
    el.style.display = "block";
    el.className = "msg-box " + (isErr ? "msg-err" : "msg-ok");
    el.textContent = text;
  }

  function hideMsg() {
    const el = document.getElementById("authMsg");
    if (el) el.style.display = "none";
  }

  function gymStorageKey(gymName, baseKey) {
    const slug = String(gymName || "default").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_");
    return "gym_" + slug + "_" + baseKey;
  }

  function activateGymProfile(profile, role) {
    const cleanGym = String(profile.gymName || "").trim();
    const active = {
      gymName: cleanGym,
      ownerName: String(profile.ownerName || "Gym Admin").trim(),
      phone: String(profile.phone || "").trim(),
      address: String(profile.address || "").trim(),
      email: String(profile.email || "").trim(),
      role: role || "owner",
      loggedAt: new Date().toISOString()
    };
    localStorage.setItem("om_active_gym_profile", JSON.stringify(active));
    localStorage.setItem("om_role", active.role);
    localStorage.setItem("om_logged_user", active.gymName + " (" + active.role + ")");

    // Save in registered gyms map
    let gyms = [];
    try { gyms = JSON.parse(localStorage.getItem("om_registered_gyms_v1") || "[]"); } catch (e) {}
    const idx = gyms.findIndex(g => g.gymName.toLowerCase() === cleanGym.toLowerCase());
    if (idx >= 0) gyms[idx] = Object.assign({}, gyms[idx], active);
    else gyms.unshift(active);
    localStorage.setItem("om_registered_gyms_v1", JSON.stringify(gyms));

    // Ensure per-gym member & staff lists exist cleanly
    const memKey = gymStorageKey(cleanGym, "members");
    const stfKey = gymStorageKey(cleanGym, "staff");
    if (!localStorage.getItem(memKey)) localStorage.setItem(memKey, "[]");
    if (!localStorage.getItem(stfKey)) localStorage.setItem(stfKey, "[]");

    renderActiveGymBanner();
  }

  function renderActiveGymBanner() {
    const box = document.getElementById("activeGymBox");
    try {
      const p = JSON.parse(localStorage.getItem("om_active_gym_profile") || "null");
      if (p && p.gymName) {
        document.getElementById("loginGymTitle").textContent = p.gymName.toUpperCase();
        box.style.display = "block";
        box.innerHTML = "✅ Active Gym: <b>" + escapeHtml(p.gymName) + "</b> | Role: <b>" + escapeHtml(p.role || "owner") + "</b>";
        return;
      }
    } catch (e) {}
    box.style.display = "none";
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    const gymName = document.getElementById("loginGymName").value.trim();
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    if (!gymName || !user || !pass) {
      showMsg("Kripya Gym Name, Email/ID aur Password bharein.", true);
      return;
    }
    activateGymProfile({ gymName, email: user }, selectedRole);
    showMsg("✅ " + gymName + " ke liye login safal! Attendance Kiosk khul raha hai...", false);
    setTimeout(() => { window.location.href = "attendance.html"; }, 600);
  }

  function handleRegisterSubmit(e) {
    e.preventDefault();
    const gymName = document.getElementById("regGymName").value.trim();
    const ownerName = document.getElementById("regOwnerName").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const address = document.getElementById("regAddress").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const pass = document.getElementById("regPass").value.trim();

    if (!gymName || !ownerName || !phone || !address || !email || !pass) {
      showMsg("Kripya registration ke sabhi zaroori fields bharein.", true);
      return;
    }

    activateGymProfile({ gymName, ownerName, phone, address, email, password: pass }, "owner");
    showMsg("✅ " + gymName + " successfully register ho gaya! Ab Admission aur Attendance use kar sakte hain.", false);
    setTimeout(() => { window.location.href = "admission.html"; }, 700);
  }

  function clearActiveGymSession() {
    localStorage.removeItem("om_active_gym_profile");
    localStorage.removeItem("om_logged_user");
    renderActiveGymBanner();
    document.getElementById("loginGymTitle").textContent = "GYM LOGIN & REGISTRATION";
    showMsg("Active gym session reset ho gaya. Naya gym name enter karein.", false);
  }

  window.addEventListener("DOMContentLoaded", renderActiveGymBanner);
</script>
</body>
</html>
