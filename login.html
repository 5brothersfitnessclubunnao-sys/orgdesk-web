<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Om Software SaaS Portal — Secure Multi-Category Access</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:#050814;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:480px;background:#0b1226;border:1.5px solid #26365e;border-radius:18px;padding:22px 18px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.badge{display:inline-block;background:rgba(245,166,35,.15);border:1px solid #f5a623;color:#ffd166;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px}
h1{font-size:21px;font-weight:900;color:#ffd166;margin-bottom:4px}
.sub{font-size:12px;color:#94a3b8;margin-bottom:14px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.role-tabs.team-only{grid-template-columns:1fr 1fr}
.rtab{padding:9px 6px;border-radius:10px;border:1.5px solid #2b3a63;background:#070c1a;color:#cbd5e1;font-size:12px;font-weight:800;cursor:pointer;text-align:center}
.rtab.active{background:#f5a623;color:#050814;border-color:#f5a623}
.auth-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mbtn{padding:8px 6px;border-radius:9px;border:1px solid #26365e;background:#0e1730;color:#e2e8f0;font-size:11.5px;font-weight:800;cursor:pointer}
.mbtn.active{background:#22d3ee;color:#050814;border-color:#22d3ee}
.fg{margin-bottom:11px}
label{display:block;font-size:11.5px;color:#cbd5e1;font-weight:700;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:13px;outline:none}
input:focus,select:focus{border-color:#f5a623}
.primary-btn{width:100%;padding:12px;border-radius:11px;border:none;background:linear-gradient(135deg,#ffd166,#f5a623);color:#050814;font-size:13.5px;font-weight:900;cursor:pointer;margin-top:6px}
.links-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.link-btn{background:none;border:none;color:#38bdf8;font-weight:800;cursor:pointer;text-decoration:underline;padding:0;font-size:12px}
.info-box{display:none;margin-top:12px;background:#071326;border:1px solid #22d3ee;border-radius:11px;padding:10px;font-size:11.5px;color:#e0f2fe;line-height:1.45}
.dept-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:170px;overflow-y:auto;background:#050814;border:1px solid #22345e;padding:8px;border-radius:8px;margin-top:5px}
.dept-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#e2e8f0;cursor:pointer}
.dept-item input{width:15px;height:15px;accent-color:#f5a623;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center">
    <span class="badge" id="devSecretTapBadge" style="cursor:pointer" title="Developer Mode: 5-Tap">OM SOFTWARE &bull; MULTI-BUSINESS ERP</span>
    <h1 id="portalTitle">Business Owner Portal</h1>
    <div class="sub" id="portalSub">Sign In or New Sign Up</div>
  </div>

  <div class="role-tabs" id="roleTabsBar">
    <button type="button" class="rtab active" id="tabOwner" onclick="setRoleTab('owner')">Owner</button>
    <button type="button" class="rtab" id="tabManager" onclick="setRoleTab('manager')">Manager</button>
    <button type="button" class="rtab" id="tabStaff" onclick="setRoleTab('staff')">Staff</button>
  </div>

  <div class="auth-modes" id="authModeBar">
    <button type="button" class="mbtn active" id="btnSignInMode" onclick="setAuthMode('signin')">Sign In</button>
    <button type="button" class="mbtn" id="btnSignUpMode" onclick="setAuthMode('signup')">New Sign Up</button>
  </div>

  <form id="loginForm" onsubmit="handleAuthSubmit(event)">
    <div class="fg" id="empIdGroup" style="display:none">
      <label id="empIdLabel">Employee ID / Manager ID *</label>
      <input type="text" id="empIdInput" placeholder="Enter STF / MGR Code">
    </div>

    <!-- SIGN UP ONLY SETUP FIELDS (3 CATEGORIES + STAFF COUNT + DEPTS + ALL-INDIA LOCATION) -->
    <div id="signUpSetupFields" style="display:none">
      <div class="fg">
        <label>🏢 Business Category / व्यापार श्रेणी *</label>
        <select id="suCategorySelect" onchange="onBusinessCategoryChange()">
          <option value="gym" selected>🏋️ Gym / Fitness Club</option>
          <option value="car_dealership">🚗 Car Dealership</option>
          <option value="general_shop">🛒 General Shop / Retail Store</option>
        </select>
      </div>

      <div class="fg">
        <label>Business / Enterprise Name *</label>
        <input type="text" id="suGymName" placeholder="e.g. Speed Wheels Motors / Apex Fitness / Daily Mart">
      </div>

      <div class="fg">
        <label>👥 How many staff do you have? / आपके पास कितने लोगों का स्टाफ है? *</label>
        <input type="number" id="suStaffCountInput" placeholder="Manual Staff Number (e.g. 15, 45, 120)" min="1" oninput="onStaffNumberInput()">
      </div>

      <div class="fg">
        <label>✅ Select Applicable Departments / विभाग चुनें (Tick Karein):</label>
        <div class="dept-grid" id="deptCheckboxList">
          <!-- Populated dynamically: Cleaner, Peon, Sweeper, Receptionist, Electrician, Plumber, Accountant, HR Manager, General Manager, Team Leader, Trainer, Nutritionist, Front Desk, Back Office, Service Team -->
        </div>
      </div>

      <div class="grid2">
        <div class="fg">
          <label>Branch Code *</label>
          <input type="text" id="suBranchCode" value="BR-001" placeholder="BR-001">
        </div>
        <div class="fg">
          <label>City (शहर) *</label>
          <input type="text" id="suCity" placeholder="e.g. Unnao / Kanpur / Lucknow" required>
        </div>
      </div>

      <div class="grid2">
        <div class="fg">
          <label>State (राज्य) *</label>
          <input type="text" id="suState" placeholder="e.g. Uttar Pradesh" required>
        </div>
        <div class="fg">
          <label>Pin Code *</label>
          <input type="tel" maxlength="6" id="suPinCode" placeholder="6-digit PIN Code" required>
        </div>
      </div>

      <div class="fg">
        <label>Auto-Selected Mode (आधारित स्टाफ):</label>
        <select id="suScaleSelect">
          <option value="light">Single Branch / Less than 100 Staff (Light Mode)</option>
          <option value="full">Multi-Branch / 100+ Staff (Full App Mode)</option>
        </select>
      </div>
    </div>

    <div class="fg">
      <label id="idLabel">Email ID / Mobile Number *</label>
      <input type="text" id="emailInput" required placeholder="Enter email or mobile">
    </div>

    <div class="fg">
      <label>Password / MPIN *</label>
      <input type="password" id="passInput" required placeholder="Enter password or MPIN">
    </div>

    <button type="submit" class="primary-btn" id="submitLoginBtn">Login to Business Dashboard</button>
  </form>

  <div class="links-row">
    <button type="button" class="link-btn" onclick="handleForgotPassword()">Forgot Password</button>
    <button type="button" class="link-btn" onclick="handleForgotMpin()">Forgot MPIN</button>
  </div>

  <div class="info-box" id="authFeedbackBox"></div>
</div>

<script>
(function saasLoginController() {
  var currentRole = "owner";
  var currentAuthMode = "signin";
  var params = new URLSearchParams(location.search);
  var isTeamShareLink = (params.get("invite") === "team" || params.get("teamOnly") === "1" || params.get("share") === "team");

  // Standard Departments Requested by user
  var DEPARTMENTS = [
    { id: "cleaner", name: "Cleaner" },
    { id: "peon", name: "Peon" },
    { id: "sweeper", name: "Sweeper" },
    { id: "receptionist", name: "Receptionist" },
    { id: "electrician", name: "Electrician" },
    { id: "plumber", name: "Plumber" },
    { id: "accountant", name: "Accountant" },
    { id: "hr_manager", name: "HR Manager" },
    { id: "general_manager", name: "General Manager" },
    { id: "team_leader", name: "Team Leader" },
    { id: "trainer", name: "Trainer" },
    { id: "nutritionist", name: "Nutritionist" },
    { id: "front_desk", name: "Front Desk" },
    { id: "back_office", name: "Back Office" },
    { id: "service_team", name: "Service Team" }
  ];

  function renderDeptCheckboxes() {
    var box = document.getElementById("deptCheckboxList");
    if (!box) return;
    box.innerHTML = DEPARTMENTS.map(function(d) {
      return '<label class="dept-item">' +
        '<input type="checkbox" class="su-dept-chk" value="' + d.name + '" checked>' +
        '<span>' + d.name + '</span>' +
      '</label>';
    }).join("");
  }

  function showMsg(txt) {
    var box = document.getElementById("authFeedbackBox");
    if (!box) return;
    box.style.display = "block";
    box.textContent = txt;
  }

  window.setRoleTab = function (role) {
    if (isTeamShareLink && role === "owner") role = "manager";
    currentRole = role;
    ["owner", "manager", "staff"].forEach(function (r) {
      var el = document.getElementById("tab" + r.charAt(0).toUpperCase() + r.slice(1));
      if (el) el.classList.toggle("active", r === role);
    });
    var title = document.getElementById("portalTitle");
    var sub = document.getElementById("portalSub");
    var empGrp = document.getElementById("empIdGroup");
    var empLbl = document.getElementById("empIdLabel");
    var subBtn = document.getElementById("submitLoginBtn");
    var cat = (document.getElementById("suCategorySelect") || {}).value || "gym";
    var catLabel = cat === "car_dealership" ? "Car Dealership" : (cat === "general_shop" ? "General Store" : "Gym & Fitness");

    if (role === "owner") {
      if (title) title.textContent = catLabel + " Owner Portal";
      if (sub) sub.textContent = (currentAuthMode === "signup") ? "Create New Owner Account" : "Sign In or New Sign Up";
      if (empGrp) empGrp.style.display = "none";
      if (subBtn) subBtn.textContent = (currentAuthMode === "signup") ? "Create Owner Account" : "Login to Dashboard";
    } else if (role === "manager") {
      if (title) title.textContent = "Manager Login";
      if (sub) sub.textContent = "Branch Manager Sign In";
      if (empGrp) empGrp.style.display = "block";
      if (empLbl) empLbl.textContent = "Manager ID / Code *";
      if (subBtn) subBtn.textContent = "Manager Login";
    } else {
      if (title) title.textContent = "Staff Login";
      if (sub) sub.textContent = "Login with Employee ID & Password";
      if (empGrp) empGrp.style.display = "block";
      if (empLbl) empLbl.textContent = "Employee ID (Provided by Owner) *";
      if (subBtn) subBtn.textContent = "Staff Login";
    }
  };

  window.setAuthMode = function (mode) {
    if (isTeamShareLink) mode = "signin";
    currentAuthMode = mode;
    document.getElementById("btnSignInMode").classList.toggle("active", mode === "signin");
    document.getElementById("btnSignUpMode").classList.toggle("active", mode === "signup");
    var suBox = document.getElementById("signUpSetupFields");
    if (suBox) suBox.style.display = (mode === "signup" && currentRole === "owner") ? "block" : "none";
    setRoleTab(currentRole);
  };

  window.onBusinessCategoryChange = function () {
    setRoleTab(currentRole);
  };

  window.onStaffNumberInput = function () {
    var count = Number((document.getElementById("suStaffCountInput") || {}).value || 0);
    var scaleSel = document.getElementById("suScaleSelect");
    if (scaleSel) {
      if (count > 0 && count < 100) {
        scaleSel.value = "light";
      } else if (count >= 100) {
        scaleSel.value = "full";
      }
    }
  };

  window.handleForgotPassword = function () {
    var email = String((document.getElementById("emailInput") || {}).value || "").trim();
    if (currentRole === "owner") {
      if (!email || email.indexOf("@") === -1) {
        email = String(prompt("Apna registered Owner Email ID darj karein jahan reset link bhejna hai:") || "").trim();
      }
      if (!email || email.indexOf("@") === -1) {
        showMsg("Kripya valid Email ID darj karein taaki reset link bheja ja sake.");
        return;
      }
      if (window.firebase && firebase.auth) {
        firebase.auth().sendPasswordResetEmail(email).then(function () {
          showMsg("Password reset link aapke email (" + email + ") par bhej diya gaya hai. Inbox / Spam check karein.");
        }).catch(function () {
          showMsg("Password reset request " + email + " ke liye initiate kar di gayi hai. Kripya email check karein.");
        });
      } else {
        showMsg("Password reset link " + email + " ke liye bhej diya gaya hai.");
      }
      return;
    }

    // Manager or Staff: send approval request to Owner
    var empCode = String((document.getElementById("empIdInput") || {}).value || "").trim() || email || "Team Member";
    var reqs = [];
    try { reqs = JSON.parse(localStorage.getItem("om_pwd_reset_requests_v1") || "[]") || []; } catch (e) {}
    reqs.unshift({
      role: currentRole,
      identifier: empCode,
      requestedAt: new Date().toISOString(),
      status: "Pending Owner Approval"
    });
    try { localStorage.setItem("om_pwd_reset_requests_v1", JSON.stringify(reqs)); } catch (e) {}
    showMsg("Aapki password reset/new password request Owner ke paas approval ke liye bhej di gayi hai. Owner approve karke naya password set karenge.");
  };

  window.handleForgotMpin = function () {
    if (currentRole === "owner") {
      handleForgotPassword();
    } else {
      showMsg("MPIN / Password reset ke liye Owner approval zaroori hai. Request bhej di gayi hai.");
    }
  };

  window.handleAuthSubmit = function (ev) {
    ev.preventDefault();
    var email = String((document.getElementById("emailInput") || {}).value || "").trim();
    var empId = String((document.getElementById("empIdInput") || {}).value || "").trim();
    try {
      localStorage.setItem("bfc_role", currentRole);
      localStorage.setItem("om_active_role", currentRole);
      localStorage.setItem("om_logged_user", empId ? (empId + " (" + email + ")") : email);
      localStorage.setItem("om_session_active", "1");
      localStorage.setItem("om_last_activity_time", String(Date.now()));

      if (currentAuthMode === "signup" && currentRole === "owner") {
        var cat = (document.getElementById("suCategorySelect") || {}).value || "gym";
        var gName = String((document.getElementById("suGymName") || {}).value || "").trim();
        var staffCnt = Number((document.getElementById("suStaffCountInput") || {}).value || 0);
        var sc = (document.getElementById("suScaleSelect") || {}).value || (staffCnt < 100 ? "light" : "full");
        var brCode = String((document.getElementById("suBranchCode") || {}).value || "BR-001").trim();
        var city = String((document.getElementById("suCity") || {}).value || "").trim();
        var state = String((document.getElementById("suState") || {}).value || "").trim();
        var pin = String((document.getElementById("suPinCode") || {}).value || "").trim();

        var checkedDepts = [];
        document.querySelectorAll(".su-dept-chk:checked").forEach(function(c) {
          checkedDepts.push(c.value);
        });

        localStorage.setItem("om_business_category", cat);
        localStorage.setItem("om_app_display_mode", sc);
        localStorage.setItem("om_selected_departments", JSON.stringify(checkedDepts));
        localStorage.setItem("om_active_gym_profile", JSON.stringify({
          gymName: gName,
          category: cat,
          role: "Business Owner",
          staffCount: staffCnt,
          branchCode: brCode,
          city: city,
          state: state,
          pinCode: pin
        }));
      }
    } catch (e) {}
    location.href = "app.html";
  };

  window.addEventListener("DOMContentLoaded", function () {
    renderDeptCheckboxes();
    if (isTeamShareLink) {
      var tabOwner = document.getElementById("tabOwner");
      var rTabs = document.getElementById("roleTabsBar");
      var modeBar = document.getElementById("authModeBar");
      if (tabOwner) tabOwner.style.display = "none";
      if (rTabs) rTabs.classList.add("team-only");
      if (modeBar) modeBar.style.display = "none";
      currentRole = "manager";
      currentAuthMode = "signin";
    }
    setRoleTab(currentRole);
  });
})();

  // 5-Tap Secret Entry for App Developer
  (function initDeveloper5TapTrigger() {
    var taps = 0;
    var tapTimer = null;
    var badge = document.getElementById("devSecretTapBadge");
    if (!badge) return;
    badge.addEventListener("click", function () {
      taps++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function () { taps = 0; }, 2500);
      if (taps >= 5) {
        taps = 0;
        alert("🔒 Developer Security Trigger Detected! Opening Multi-Factor Authentication Gate...");
        location.href = "prime-master-login.html";
      }
    });
  })();

</script>
</body>
</html>
