<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Om Software ERP — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #050813; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .box { width: 100%; max-width: 420px; background: #0A1124; border: 1px solid #1B294B; border-radius: 20px; padding: 22px; }
    h1 { font-size: 20px; color: #F5A623; text-align: center; margin-bottom: 4px; }
    p { font-size: 12px; color: #94A3B8; text-align: center; margin-bottom: 14px; }
    .fg { margin-bottom: 11px; }
    label { display: block; font-size: 11.5px; color: #94A3B8; margin-bottom: 4px; font-weight: 700; }
    input, select { width: 100%; background: #070D1C; border: 1px solid #1B294B; border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; }
    .btn { width: 100%; background: #F5A623; color: #050813; border: 0; border-radius: 11px; padding: 12px; font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Om Software ERP</h1>
    <p>Admin / Manager &amp; Staff Login</p>
    <form onsubmit="onLogin(event)">
      <div class="fg">
        <label>Login Mode</label>
        <select id="modeSel" onchange="toggleMode()">
          <option value="admin">Admin / Manager (Email + Password + Security Q)</option>
          <option value="staff">Staff (Branch Code + Employee ID + Password)</option>
        </select>
      </div>
      <div id="adminBox">
        <div class="fg">
          <label>Role</label>
          <select id="roleSel"><option value="owner">Admin / Owner</option><option value="manager">Branch Manager</option></select>
        </div>
        <div class="fg"><label>Email ID *</label><input type="email" id="emailInp" required placeholder="admin@gym.com"></div>
        <div class="fg"><label>Password *</label><input type="password" id="passInp" required placeholder="••••••••"></div>
        <div class="fg">
          <label>Security Question *</label>
          <select id="secQ"><option value="Favourite Person">Favourite Person</option><option value="Favourite Pet">Favourite Pet</option><option value="Favourite Song">Favourite Song</option></select>
        </div>
        <div class="fg"><label>Security Answer *</label><input type="text" id="secA" required placeholder="Answer"></div>
      </div>
      <div id="staffBox" style="display:none">
        <div class="fg"><label>Branch Code *</label><input type="text" id="brCode" placeholder="001"></div>
        <div class="fg"><label>Employee ID *</label><input type="text" id="empId" placeholder="STF-001-1"></div>
        <div class="fg"><label>Password *</label><input type="password" id="stfPass" placeholder="••••••••"></div>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>
  <script>
    function toggleMode() {
      const isStf = document.getElementById("modeSel").value === "staff";
      document.getElementById("adminBox").style.display = isStf ? "none" : "block";
      document.getElementById("staffBox").style.display = isStf ? "block" : "none";
      document.getElementById("emailInp").required = !isStf;
      document.getElementById("passInp").required = !isStf;
      document.getElementById("secA").required = !isStf;
      document.getElementById("brCode").required = isStf;
      document.getElementById("empId").required = isStf;
      document.getElementById("stfPass").required = isStf;
    }
    function onLogin(e) {
      e.preventDefault();
      const isStf = document.getElementById("modeSel").value === "staff";
      if (isStf) {
        localStorage.setItem("bfc_role", "staff");
        localStorage.setItem("om_logged_user", document.getElementById("empId").value.trim() + "@" + document.getElementById("brCode").value.trim());
      } else {
        localStorage.setItem("bfc_role", document.getElementById("roleSel").value);
        localStorage.setItem("om_logged_user", document.getElementById("emailInp").value.trim());
      }
      localStorage.removeItem("om_splash_shown");
      localStorage.setItem("om_last_active_time", String(Date.now()));
      location.replace("index.html");
    }
  </script>
</body>
</html>
