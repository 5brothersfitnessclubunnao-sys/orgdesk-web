<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OM SOFTWARE — Trust, Technology &amp; Innovation</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #050811;
      --card: #0B1120;
      --card-2: #111A2E;
      --gold: #FACC15;
      --gold-2: #EAB308;
      --cyan: #22D3EE;
      --emerald: #34D399;
      --rose: #FB7185;
      --bd: #1E2D4A;
      --tx: #F8FAFC;
      --mut: #94A3B8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(960px 540px at 50% -5%, #152342 0%, #070C18 62%, #04060C 100%);
      color: var(--tx);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .auth-box {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border: 1.5px solid rgba(250, 204, 21, 0.75);
      border-radius: 22px;
      padding: 26px 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 28px rgba(34, 211, 238, 0.08);
    }
    .top-pill {
      display: inline-block;
      background: rgba(34, 211, 238, 0.14);
      color: var(--cyan);
      border: 1px solid rgba(34, 211, 238, 0.35);
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }
    .hdr { text-align: center; margin-bottom: 18px; }
    .hdr h1 { margin: 10px 0 4px; font-size: 25px; font-weight: 900; color: #FFFFFF; letter-spacing: 0.6px; }
    .tagline { margin: 0; font-size: 12.5px; color: var(--gold); font-weight: 700; letter-spacing: 0.4px; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1.5px solid var(--bd);
      margin-bottom: 16px;
    }
    .tab {
      background: none;
      border: 0;
      color: var(--mut);
      padding: 10px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
    }
    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-btn {
      background: var(--card-2);
      border: 1.5px solid var(--bd);
      color: #E2E8F0;
      padding: 9px 10px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .mode-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #090C12;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #CBD5E1;
      margin-bottom: 5px;
      letter-spacing: 0.2px;
    }
    .pw-wrap { position: relative; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1.5px solid var(--bd);
      background: var(--card-2);
      color: #FFFFFF;
      font-size: 13.5px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.16);
    }
    .eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: var(--mut);
      cursor: pointer;
      font-size: 15px;
    }

    .btn-gold {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #090C12;
      font-size: 14.5px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-demo {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1.5px solid rgba(34, 211, 238, 0.45);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), rgba(250, 204, 21, 0.08));
      color: var(--gold);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-demo:hover {
      border-color: var(--gold);
      color: #FFFFFF;
    }

    .msg {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .err { background: rgba(251, 113, 133, 0.14); border: 1px solid var(--rose); color: #FECDD3; }
    .ok { background: rgba(52, 211, 153, 0.14); border: 1px solid var(--emerald); color: #A7F3D0; }

    .links {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.8;
      color: var(--mut);
    }
    .links a {
      color: var(--gold);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="auth-box">
  <div class="hdr">
    <span class="top-pill">ENTERPRISE FITNESS PLATFORM</span>
    <h1>OM SOFTWARE</h1>
    <p class="tagline">Trust, Technology &amp; Innovation</p>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
    <button type="button" class="tab" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
  </div>

  <div id="errBox" class="msg err"></div>
  <div id="okBox" class="msg ok"></div>

  <!-- SIGN IN -->
  <div id="viewSignIn">
    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="btnModeEmail" onclick="setLoginMode('email')">📧 Email / Mobile</button>
      <button type="button" class="mode-btn" id="btnModeStaff" onclick="setLoginMode('staff')">🎫 Staff Code</button>
    </div>

    <form id="formSignIn" onsubmit="handleSignIn(event)">
      <div id="emailLoginFields">
        <div class="field">
          <label>Email or 10-Digit Mobile *</label>
          <input type="text" id="siIdentity" placeholder="name@example.com or 9876543210" autocomplete="username">
        </div>
        <div class="field">
          <label>Password *</label>
          <div class="pw-wrap">
            <input type="password" id="siPassword" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="eye" onclick="togglePw('siPassword', this)">👁</button>
          </div>
        </div>
        <div class="field">
          <label>Security Question *</label>
          <select id="siSecQuestion">
            <option value="Favourite Person">Favourite Person</option>
            <option value="Favourite Song">Favourite Song</option>
            <option value="Favourite Pet">Favourite Pet</option>
            <option value="Birth Place">Birth Place / City</option>
          </select>
        </div>
        <div class="field">
          <label>Security Answer *</label>
          <input type="text" id="siSecAnswerDirect" placeholder="Enter security answer" autocomplete="off">
        </div>
      </div>

      <div id="staffLoginFields" style="display:none">
        <div class="field">
          <label>Staff Access Code *</label>
          <input type="text" id="siStaffCode" placeholder="STF-001-XXXXXX" autocomplete="off">
        </div>
        <div class="field">
          <label>Employee Code (Optional)</label>
          <input type="text" id="siEmpCode" placeholder="EMP-001-MGR" autocomplete="off">
        </div>
      </div>



      <button type="submit" class="btn-gold" id="btnSubmitSignIn">Sign In</button>
    </form>

    <div class="links">
      <div><a onclick="alert('Use your registered security question or contact your administrator for account recovery.')">Forgot Password or Security Question?</a></div>
      <div>First-time setup? <a onclick="switchAuthTab('signup')">Create Account</a></div>
    </div>

    <button type="button" class="btn-demo" onclick="startCleanZeroDataDemo()">
      🎬 Quick Demo (Zero Personal Data)
    </button>
  </div>

  <!-- CREATE ACCOUNT (ADMIN / FIRST-TIME SETUP) -->
  <div id="viewSignUp" style="display:none">
    <form id="formSignUp" onsubmit="handleSignUp(event)">
      <div class="field">
        <label>Organization / Gym Name *</label>
        <input type="text" id="suOrgName" placeholder="e.g. Om Fitness Club" required>
      </div>
      <div class="field">
        <label>Email or 10-Digit Mobile *</label>
        <input type="text" id="suIdentity" placeholder="admin@example.com or 9876543210" required>
      </div>
      <div class="field">
        <label>Create Password (Min. 6 Characters) *</label>
        <input type="password" id="suPassword" placeholder="Create strong password" minlength="6" required>
      </div>
      <div class="field">
        <label>Security Question *</label>
        <select id="suSecQ" required>
          <option value="Favourite Person">Favourite Person</option>
          <option value="Favourite Song">Favourite Song</option>
          <option value="Favourite Pet">Favourite Pet</option>
          <option value="Birth Place">Birth Place / City</option>
        </select>
      </div>
      <div class="field">
        <label>Security Answer *</label>
        <input type="text" id="suSecA" placeholder="Required answer for login verification" required>
      </div>
      <button type="submit" class="btn-gold">Create Account &amp; Password</button>
    </form>
    <div class="links">
      <div>Already registered? <a onclick="switchAuthTab('signin')">Sign In</a></div>
    </div>
  </div>
</div>

<script>
const LS = localStorage;
const $ = id => document.getElementById(id);
let currentMode = "email";

function showErr(t) { $("errBox").textContent = t; $("errBox").style.display = "block"; $("okBox").style.display = "none"; }
function showOk(t) { $("okBox").textContent = t; $("okBox").style.display = "block"; $("errBox").style.display = "none"; }
function clearMsgs() { $("errBox").style.display = "none"; $("okBox").style.display = "none"; }

function switchAuthTab(tab) {
  clearMsgs();
  $("tabSignIn").classList.toggle("active", tab === "signin");
  $("tabSignUp").classList.toggle("active", tab === "signup");
  $("viewSignIn").style.display = tab === "signin" ? "block" : "none";
  $("viewSignUp").style.display = tab === "signup" ? "block" : "none";
}

function setLoginMode(mode) {
  clearMsgs();
  currentMode = mode;
  $("btnModeEmail").classList.toggle("active", mode === "email");
  $("btnModeStaff").classList.toggle("active", mode === "staff");
  $("emailLoginFields").style.display = mode === "email" ? "block" : "none";
  $("staffLoginFields").style.display = mode === "staff" ? "block" : "none";
}

function togglePw(id, btn) {
  const inp = $(id);
  if (inp.type === "password") { inp.type = "text"; btn.textContent = "🙈"; }
  else { inp.type = "password"; btn.textContent = "👁"; }
}

function startCleanZeroDataDemo() {
  clearMsgs();
  ["5BFC_MEMBERS", "bbf_master_records_v4", "5bfc_admissions", "bfc_staff_list", "om_fees_payments_v1", "om_erp_members_v1", "om_erp_expenses_v1", "om_erp_orders_v1", "om_erp_mem_v2", "om_erp_exp_v2", "om_erp_prod_v2"].forEach(k => LS.removeItem(k));
  LS.removeItem("om_staff_session");
  LS.setItem("bfc_role", "owner");
  LS.setItem("om_demo_mode", "1");
  LS.setItem("bfc_org_id", "demo_clean_workspace");
  LS.setItem("om_org_profile", JSON.stringify({ orgId: "demo_clean_workspace", orgName: "OM SOFTWARE", role: "demo" }));
  showOk("Quick Demo initialized with zero personal data.");
  setTimeout(() => location.href = "index.html?demo=1", 250);
}

async function handleSignIn(e) {
  e.preventDefault();
  clearMsgs();
  if (currentMode === "staff") {
    const code = String($("siStaffCode").value || "").trim().toUpperCase();
    if (!code) { showErr("Please enter your Staff Access Code."); return; }
    const emp = String($("siEmpCode").value || "").trim().toUpperCase();
    const brMatch = code.match(/(\d{3})/);
    const br = (brMatch && brMatch[1]) || "001";
    const sess = { code, employeeCode: emp, branchCode: br, role: "staff", verifiedAt: new Date().toISOString() };
    LS.setItem("bfc_role", "staff");
    LS.setItem("om_staff_session", JSON.stringify(sess));
    LS.setItem("om_verified_mgr_session_" + br, JSON.stringify(sess));
    showOk("Staff access verified.");
    setTimeout(() => location.href = "index.html?role=staff&branch=" + encodeURIComponent(br), 250);
    return;
  }

  const rawId = String($("siIdentity").value || "").trim();
  const pw = String($("siPassword").value || "");
  if (!rawId || !pw) { showErr("Please enter both Email/Mobile and Password."); return; }

  const secQVal = String(($("siSecQuestion") && $("siSecQuestion").value) || "").trim();
  const directAns = String(($("siSecAnswerDirect") && $("siSecAnswerDirect").value) || "").trim().toLowerCase();
  if (!secQVal || !directAns) {
    showErr("Please select a Security Question and enter its answer.");
    return;
  }
  let savedSec = null;
  try { savedSec = JSON.parse(LS.getItem("om_last_sec_setup") || "null"); } catch(e) {}
  if (savedSec && savedSec.a && directAns !== String(savedSec.a).trim().toLowerCase()) {
    showErr("Incorrect security question answer.");
    return;
  }

  try {
    const CFG = { apiKey:"AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ", authDomain:"bfc-gym-215ae.firebaseapp.com", projectId:"bfc-gym-215ae", storageBucket:"bfc-gym-215ae.firebasestorage.app", messagingSenderId:"886920088571", appId:"1:886920088571:web:c4bc478d246a2700b0d95e" };
    if (!firebase.apps.length) firebase.initializeApp(CFG);
    const emailCred = /^\d{10}$/.test(rawId) ? rawId + "@orgdesk.phone" : rawId;
    const res = await firebase.auth().signInWithEmailAndPassword(emailCred, pw);
    LS.removeItem("om_staff_session");
    LS.setItem("bfc_role", "owner");
    LS.setItem("bfc_org_id", res.user.uid);
    LS.setItem("om_org_profile", JSON.stringify({ orgId: res.user.uid, orgName: "OM SOFTWARE", email: res.user.email || rawId }));
    showOk("Signed in successfully.");
    setTimeout(() => location.href = "index.html", 250);
  } catch (err) {
    showErr((err && err.message) || "Authentication failed.");
  }
}

async function handleSignUp(e) {
  e.preventDefault();
  clearMsgs();
  const orgName = String($("suOrgName").value || "").trim();
  const rawId = String($("suIdentity").value || "").trim();
  const pw = String($("suPassword").value || "");
  const secQ = String(($("suSecQ") && $("suSecQ").value) || "Favourite Person");
  const secA = String(($("suSecA") && $("suSecA").value) || "").trim().toLowerCase();
  if (!orgName || !rawId || pw.length < 6 || !secA) { showErr("Please complete all required fields including password and security answer."); return; }

  try {
    const CFG = { apiKey:"AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ", authDomain:"bfc-gym-215ae.firebaseapp.com", projectId:"bfc-gym-215ae", storageBucket:"bfc-gym-215ae.firebasestorage.app", messagingSenderId:"886920088571", appId:"1:886920088571:web:c4bc478d246a2700b0d95e" };
    if (!firebase.apps.length) firebase.initializeApp(CFG);
    const emailCred = /^\d{10}$/.test(rawId) ? rawId + "@orgdesk.phone" : rawId;
    const res = await firebase.auth().createUserWithEmailAndPassword(emailCred, pw);
    LS.removeItem("om_staff_session");
    LS.setItem("bfc_role", "owner");
    LS.setItem("bfc_org_id", res.user.uid);
    LS.setItem("om_org_profile", JSON.stringify({ orgId: res.user.uid, orgName: orgName, email: emailCred }));
    LS.setItem("om_first_time_sec_" + res.user.uid, JSON.stringify({ q: secQ, a: secA, mustAnswerOnLogin: true }));
    LS.setItem("om_last_sec_setup", JSON.stringify({ q: secQ, a: secA, mustAnswerOnLogin: true }));
    showOk("Account and password configured.");
    setTimeout(() => location.href = "index.html", 250);
  } catch (err) {
    showErr((err && err.message) || "Account creation failed.");
  }
}
</script>

</body>
</html>
