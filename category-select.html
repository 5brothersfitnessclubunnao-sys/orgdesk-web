<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal SaaS Portal - Organization Setup</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <style>
    :root { --bg: #0b0b0d; --card: #16161a; --border: #2c2c35; --ac: #ffcc00; --tx: #f0f0f5; --mut: #9999a8; --ok: #2ecc71; --err: #e74c3c; }
    body { background: var(--bg); color: var(--tx); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .setup-box { max-width: 480px; width: 100%; background: var(--card); border: 2px solid var(--ac); border-radius: 18px; padding: 24px; box-sizing: border-box; box-shadow: 0 0 30px rgba(255,204,0,0.15); }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 1.5px dashed var(--border); padding-bottom: 12px; }
    .header h2 { color: var(--ac); margin: 0; font-size: 20px; font-weight: 900; }
    .header p { color: var(--mut); font-size: 11.5px; margin: 4px 0 0; }
    
    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .cat-card { background: #0b0b0d; border: 2px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
    .cat-card.active { border-color: var(--ac); background: rgba(255, 204, 0, 0.08); }
    .cat-card .icon { font-size: 28px; margin-bottom: 6px; }
    .cat-card .title { font-size: 12.5px; font-weight: bold; color: #fff; }

    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #ccc; margin-bottom: 4px; font-weight: 600; }
    input, textarea { width: 100%; background: #0b0b0d; border: 1.5px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; outline: none; }
    input:focus, textarea:focus { border-color: var(--ac); }
    
    .btn-main { width: 100%; background: var(--ac); color: #000; font-weight: 900; padding: 13px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 10px; }
    .btn-main:hover { opacity: 0.9; }
    
    .error-msg { background: rgba(231, 76, 60, 0.15); border: 1px solid var(--err); color: var(--err); padding: 8px; border-radius: 6px; font-size: 11.5px; margin-bottom: 12px; display: none; text-align: center; }
    .success-msg { background: rgba(46, 204, 113, 0.15); border: 1px solid var(--ok); color: var(--ok); padding: 8px; border-radius: 6px; font-size: 11.5px; margin-bottom: 12px; display: none; text-align: center; }
    
    #gymSetupForm { display: none; }
  </style>
</head>
<body>

<div class="setup-box">
  <div class="header">
    <div style="background:var(--ac); color:#000; font-size:9px; font-weight:900; padding:2px 8px; border-radius:10px; display:inline-block; margin-bottom:6px;">STEP 2 : ONBOARDING</div>
    <h2>Select Your Business Type</h2>
    <p>Choose your management category to configure workspace</p>
  </div>

  <div id="errorAlert" class="error-msg"></div>
  <div id="successAlert" class="success-msg"></div>

  <!-- Category Selection Screen -->
  <div id="categoryStep">
    <div class="category-grid">
      <div class="cat-card active" id="catGym" onclick="selectCategory('gym')">
        <div class="icon">🏋️‍♂️</div>
        <div class="title">Gym & Fitness</div>
      </div>
      <div class="cat-card" id="catSchool" onclick="selectCategory('school')">
        <div class="icon">🏫</div>
        <div class="title">School / College</div>
      </div>
    </div>
    <button type="button" class="btn-main" onclick="proceedToSetup()">Continue to Setup ➔</button>
  </div>

  <!-- Gym Setup Form -->
  <form id="gymSetupForm" onsubmit="handleGymSetupSubmit(event)">
    <div style="font-size: 12px; font-weight: bold; color: var(--ac); margin-bottom: 10px;">🏋️‍♂️ Gym Profile Configuration</div>
    
    <div class="field">
      <label>Gym / Fitness Club Name *</label>
      <input type="text" id="setupGymName" required placeholder="e.g. 5 Brother's Fitness Club">
    </div>

    <div class="field">
      <label>Owner Name *</label>
      <input type="text" id="setupOwnerName" required placeholder="e.g. Saurabh Singh Chandel">
    </div>

    <div class="field">
      <label>Contact Number (WhatsApp) *</label>
      <input type="tel" id="setupPhone" required placeholder="10-digit mobile number" maxlength="10">
    </div>

    <div class="field">
      <label>Full Address / Location *</label>
      <textarea id="setupAddress" rows="2" required placeholder="e.g. Umrao Khera, Akrampur, Unnao, UP"></textarea>
    </div>

    <div class="field">
      <label>Default UPI ID (For Fee Collection) *</label>
      <input type="text" id="setupUpiId" required placeholder="e.g. 9140417259@okbizaxis">
    </div>

    <button type="submit" class="btn-main" id="saveSetupBtn">Save & Launch Dashboard 🚀</button>
  </form>
</div>

<script>
  // Firebase Initialization
  const firebaseConfig = {
    apiKey: "AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ",
    authDomain: "bfc-gym-215ae.firebaseapp.com",
    projectId: "bfc-gym-215ae",
    storageBucket: "bfc-gym-215ae.firebasestorage.app",
    messagingSenderId: "886920088571",
    appId: "1:886920088571:web:c4bc478d246a2700b0d95e"
  };
  if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
  const db = firebase.firestore();

  let selectedCategory = "gym";

  function selectCategory(cat) {
    selectedCategory = cat;
    document.getElementById("catGym").classList.toggle("active", cat === "gym");
    document.getElementById("catSchool").classList.toggle("active", cat === "school");
  }

  function proceedToSetup() {
    if (selectedCategory === "school") {
      alert("School/College management module is coming soon! Proceeding with Gym configuration.");
    }
    document.getElementById("categoryStep").style.display = "none";
    document.getElementById("gymSetupForm").style.display = "block";
  }

  function showError(msg) {
    const el = document.getElementById("errorAlert");
    el.innerText = msg;
    el.style.display = "block";
    document.getElementById("successAlert").style.display = "none";
  }

  function showSuccess(msg) {
    const el = document.getElementById("successAlert");
    el.innerText = msg;
    el.style.display = "block";
    document.getElementById("errorAlert").style.display = "none";
  }

  async function handleGymSetupSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("saveSetupBtn");
    btn.disabled = true;
    btn.innerText = "Saving configuration...";

    const gymData = {
      category: "gym",
      gymName: document.getElementById("setupGymName").value.trim(),
      ownerName: document.getElementById("setupOwnerName").value.trim(),
      phone: document.getElementById("setupPhone").value.trim(),
      address: document.getElementById("setupAddress").value.trim(),
      upiId: document.getElementById("setupUpiId").value.trim(),
      updatedAt: new Date().toISOString()
    };

    // Consistent tenant ID
    const orgId = "5brothersfitness";

    // 1. Save locally first (Guarantees instant success)
    localStorage.setItem("bfc_org_profile", JSON.stringify(gymData));
    localStorage.setItem("bfc_org_id", orgId);

    try {
      // 2. Try syncing with Cloud Firestore
      await db.collection("orgs").doc(orgId).set(gymData, { merge: true });
      showSuccess("Configuration saved successfully! Launching dashboard...");
    } catch (err) {
      console.warn("Cloud warning:", err.message);
      showSuccess("Saved locally! Launching dashboard...");
    }

    setTimeout(() => {
      window.location.href = "index.html"; // Launch main dashboard instantly
    }, 1000);
  }
</script>

</body>
</html>
