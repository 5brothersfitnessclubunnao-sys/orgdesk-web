<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Om Software - Organization Setup</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <style>
    :root { --bg: #0b0b0d; --card: #16161a; --border: #2c2c35; --ac: #ffcc00; --tx: #f0f0f5; --mut: #9999a8; --ok: #2ecc71; --err: #e74c3c; }
    body { background: var(--bg); color: var(--tx); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .setup-box { max-width: 480px; width: 100%; background: var(--card); border: 2px solid var(--ac); border-radius: 18px; padding: 24px; box-sizing: border-box; box-shadow: 0 0 30px rgba(255,204,0,0.15); }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 1.5px dashed var(--border); padding-bottom: 12px; }
    .header h2 { color: var(--ac); margin: 0; font-size: 20px; font-weight: 900; }
    .header p { color: var(--mut); font-size: 11.5px; margin: 4px 0 0; }
    
    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .cat-card { background: #0b0b0d; border: 2px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
    .cat-card.active { border-color: var(--ac); background: rgba(255, 204, 0, 0.08); }
    .cat-card .icon { font-size: 26px; margin-bottom: 4px; }
    .cat-card .title { font-size: 12px; font-weight: bold; color: #fff; }

    .field { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #ccc; margin-bottom: 4px; font-weight: 600; }
    input, textarea, select { width: 100%; background: #0b0b0d; border: 1.5px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--ac); }
    
    .btn-main { width: 100%; background: var(--ac); color: #000; font-weight: 900; padding: 13px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 10px; }
    .success-msg { background: rgba(46, 204, 113, 0.15); border: 1px solid var(--ok); color: var(--ok); padding: 8px; border-radius: 6px; font-size: 11.5px; margin-bottom: 12px; display: none; text-align: center; }
    #orgSetupForm { display: none; }
  </style>
</head>
<body>

<div class="setup-box">
  <div class="header">
    <div style="background:var(--ac); color:#000; font-size:9px; font-weight:900; padding:2px 8px; border-radius:10px; display:inline-block; margin-bottom:6px;">OM SOFTWARE SETUP</div>
    <h2>Select Your Business Type</h2>
    <p>Configure your secure management workspace</p>
  </div>

  <div id="successAlert" class="success-msg"></div>

  <!-- Step A: Category Selection -->
  <div id="categoryStep">
    <div class="category-grid">
      <div class="cat-card active" id="catGym" onclick="selectCategory('gym')">
        <div class="icon">🏋️‍♂️</div>
        <div class="title">Gym & Fitness</div>
      </div>
      <div class="cat-card" id="catSchool" onclick="selectCategory('school')">
        <div class="icon">🏫</div>
        <div class="title">School</div>
      </div>
      <div class="cat-card" id="catCollege" onclick="selectCategory('college')">
        <div class="icon">🎓</div>
        <div class="title">College</div>
      </div>
      <div class="cat-card" id="catCompany" onclick="selectCategory('company')">
        <div class="icon">🏢</div>
        <div class="title">Company</div>
      </div>
    </div>
    <button type="button" class="btn-main" onclick="proceedToSetup()">Continue to Details ➔</button>
  </div>

  <!-- Step B: Organization Details Form -->
  <form id="orgSetupForm" onsubmit="handleOrgSetupSubmit(event)">
    <div style="font-size: 12px; font-weight: bold; color: var(--ac); margin-bottom: 10px;" id="formTitleLabel">🏢 Organization Configuration</div>
    
    <div class="field">
      <label id="lblOrgName">Organization Name *</label>
      <input type="text" id="setupOrgName" required placeholder="e.g. 5 Brother's Fitness Club">
    </div>

    <div class="field">
      <label>Owner / Director Name *</label>
      <input type="text" id="setupOwnerName" required placeholder="e.g. Saurabh Singh Chandel">
    </div>

    <div class="field">
      <label>Contact Number (WhatsApp) *</label>
      <input type="tel" id="setupPhone" required placeholder="10-digit mobile number" maxlength="10">
    </div>

    <div class="field">
      <label>Full Address / Location *</label>
      <textarea id="setupAddress" rows="2" required placeholder="Enter complete address"></textarea>
    </div>

    <div class="field">
      <label>Default UPI ID (For Fee / Payments) *</label>
      <input type="text" id="setupUpiId" required placeholder="e.g. 9140417259@okbizaxis">
    </div>

    <button type="submit" class="btn-main" id="saveSetupBtn">Save & Launch Dashboard 🚀</button>
  </form>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAHEMISEIDSzZz-m2OQT5EPyhTRF-mXqjQ",
    authDomain: "bfc-gym-215ae.firebaseapp.com",
    projectId: "bfc-gym-215ae",
    storageBucket: "bfc-gym-215ae.firebasestorage.app",
    messagingSenderId: "886920088571",
    appId: "1:886920088571:web:c4bc478d246a2700b0d95e"
  };
  if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
  const db = firebase.firestore();
  const auth = firebase.auth();

  let selectedCategory = "gym";

  window.addEventListener("DOMContentLoaded", () => {
    // If already configured, skip setup
    const existingOrg = localStorage.getItem("om_org_profile");
    if (existingOrg) {
      window.location.href = "index.html";
    }
  });

  function selectCategory(cat) {
    selectedCategory = cat;
    ['gym', 'school', 'college', 'company'].forEach(c => {
      document.getElementById('cat' + c.charAt(0).toUpperCase() + c.slice(1)).classList.toggle('active', c === cat);
    });
  }

  function proceedToSetup() {
    document.getElementById("categoryStep").style.display = "none";
    document.getElementById("orgSetupForm").style.display = "block";
    const labels = { gym: "🏋️‍♂️ Gym Profile", school: "🏫 School Profile", college: "🎓 College Profile", company: "🏢 Company Profile" };
    document.getElementById("formTitleLabel").innerText = labels[selectedCategory];
  }

  function showSuccess(msg) {
    const el = document.getElementById("successAlert");
    el.innerText = msg;
    el.style.display = "block";
  }

  async function handleOrgSetupSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("saveSetupBtn");
    btn.disabled = true;
    btn.innerText = "Saving configuration...";

    const currentUser = auth.currentUser;
    const orgId = currentUser ? currentUser.uid : "org_" + Date.now(); // Secure Unique Tenant ID

    const orgData = {
      orgId: orgId,
      category: selectedCategory,
      orgName: document.getElementById("setupOrgName").value.trim(),
      ownerName: document.getElementById("setupOwnerName").value.trim(),
      phone: document.getElementById("setupPhone").value.trim(),
      address: document.getElementById("setupAddress").value.trim(),
      upiId: document.getElementById("setupUpiId").value.trim(),
      createdAt: new Date().toISOString()
    };

    // Save locally and isolate securely
    localStorage.setItem("om_org_profile", JSON.stringify(orgData));
    localStorage.setItem("om_org_id", orgId);

    try {
      await db.collection("organizations").doc(orgId).set(orgData, { merge: true });
      showSuccess("Configuration saved securely! Launching dashboard...");
    } catch (err) {
      console.warn("Cloud sync warning:", err.message);
      showSuccess("Saved locally! Launching dashboard...");
    }

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);
  }
</script>

</body>
</html>
