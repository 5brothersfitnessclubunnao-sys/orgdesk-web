<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Form</title>
  <script src="gym-scope.js"></script>
  <script src="admform.js"></script>
  <style>
    :root{--bg:#0b0b0d;--card:#151519;--border:#2c2c36;--ac:#ffcc00;--tx:#f4f4f8;--mut:#9a9aa8;--ok:#2ecc71}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Arial,sans-serif;padding:16px}
    .wrap{max-width:520px;margin:0 auto;background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:18px}
    h2{margin:0;color:var(--ac);font-size:19px;font-weight:900}
    .sub{color:var(--mut);font-size:11.5px;margin:4px 0 14px}
    .field{margin-bottom:11px}
    label{display:block;font-size:11px;color:#ccc;margin-bottom:4px;font-weight:700}
    input,select,textarea{width:100%;background:#0b0b0e;border:1.5px solid var(--border);color:#fff;padding:10px 12px;border-radius:8px;font-size:12.5px;outline:none}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{width:100%;background:var(--ac);color:#000;border:0;border-radius:9px;padding:12px;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px}
    .btn-top{background:#222;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800;text-decoration:none}
    .rec-card{background:#0e0e13;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <h2>Admission Form</h2>
    <a href="index.html" class="btn-top">Dashboard</a>
  </div>
  <p class="sub">Single unified Admission Form (saved &amp; searchable by name or mobile).</p>

  <div class="field">
    <label>Search Saved Admissions (Name or Mobile)</label>
    <input type="text" id="admSearch" oninput="renderAdmissions()" placeholder="Search member name or phone...">
    <div id="admResults"></div>
  </div>

  <form id="admForm" onsubmit="submitAdmission(event)">
    <div class="row">
      <div class="field">
        <label>Member Name *</label>
        <input type="text" id="aName" required placeholder="Full Name">
      </div>
      <div class="field">
        <label>Mobile Number *</label>
        <input type="tel" id="aPhone" required maxlength="10" placeholder="10-digit mobile">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Joining Date *</label>
        <input type="date" id="aDate" required>
      </div>
      <div class="field">
        <label>Plan &amp; Fee (₹) *</label>
        <input type="text" id="aPlan" required placeholder="e.g. 1 Month - ₹500">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Amount Paid (₹) *</label>
        <input type="number" id="aPaid" required value="500">
      </div>
      <div class="field">
        <label>Due Amount (₹)</label>
        <input type="number" id="aDue" value="0">
      </div>
    </div>
    <div class="field">
      <label>Address</label>
      <textarea id="aAddr" rows="2" placeholder="Member address"></textarea>
    </div>
    <button type="submit" class="btn">Save Admission Form</button>
  </form>
</div>
<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const readAdm = () => { try { return JSON.parse(localStorage.getItem("5bfc_admissions") || "[]") || []; } catch (e) { return []; } };
  const writeAdm = arr => {
    try {
      localStorage.setItem("5bfc_admissions", JSON.stringify(arr));
      localStorage.setItem("5BFC_MEMBERS", JSON.stringify(arr));
    } catch (e) {}
  };
  function submitAdmission(e) {
    e.preventDefault();
    const item = {
      id: "adm_" + Date.now(),
      formType: "Admission Form",
      name: $("aName").value.trim(),
      phone: $("aPhone").value.replace(/\D/g, "").slice(-10),
      joinDate: $("aDate").value || new Date().toISOString().slice(0, 10),
      planName: $("aPlan").value.trim(),
      amount: Number($("aPaid").value || 0),
      dueAmount: Number($("aDue").value || 0),
      address: $("aAddr").value.trim(),
      status: Number($("aDue").value || 0) > 0 ? "Pending" : "Paid",
      nonDeletable: true
    };
    const arr = readAdm();
    arr.unshift(item);
    writeAdm(arr);
    $("admForm").reset();
    $("aDate").value = new Date().toISOString().slice(0, 10);
    renderAdmissions();
    alert("Admission saved!");
  }
  function renderAdmissions() {
    const q = ($("admSearch").value || "").trim().toLowerCase();
    const rows = readAdm().filter(r => !q || String(r.name || "").toLowerCase().includes(q) || String(r.phone || "").includes(q));
    $("admResults").innerHTML = rows.slice(0, 6).map(r =>
      `<div class="rec-card"><div><b style="color:var(--ac)">${esc(r.name)}</b> • <small>${esc(r.phone || "-")}</small></div><div style="font-size:11px;color:#ccc;margin-top:2px">Plan: ${esc(r.planName || "-")} • Paid: ₹${Number(r.amount || 0)} • Due: ₹${Number(r.dueAmount || 0)}</div></div>`
    ).join("");
  }
  window.addEventListener("DOMContentLoaded", () => {
    $("aDate").value = new Date().toISOString().slice(0, 10);
    renderAdmissions();
  });
</script>
</body>
</html>
