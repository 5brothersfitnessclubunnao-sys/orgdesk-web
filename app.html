<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>App Dashboard — Om Software</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#050814;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:14px;padding-bottom:60px}
.wrap{max-width:580px;margin:0 auto}
header{background:#0b1226;border:2px solid #f5a623;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:10px}
.menu-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid #22d3ee;background:#070d1d;color:#22d3ee;font-size:18px;font-weight:900;cursor:pointer}
header h1{font-size:16px;font-weight:900;color:#ffd166;cursor:pointer}
header p{font-size:11px;color:#94a3b8}
.top-btns{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{padding:7px 10px;border-radius:9px;border:1px solid #334155;background:#111b33;color:#fff;font-size:11.5px;font-weight:800;cursor:pointer;text-decoration:none}
.sbtn.gold{background:#f5a623;color:#050814;border-color:#f5a623}
.sbtn.cyan{background:#082f49;color:#38bdf8;border-color:#38bdf8}
.sbtn.red{background:#450a0a;color:#fca5a5;border-color:#ef4444}

.drawer-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000}
.drawer-ov.open{display:block}
.drawer{position:fixed;top:0;left:-310px;width:290px;max-width:85vw;height:100vh;background:#070c1a;border-right:1.5px solid #26365e;z-index:2001;padding:14px;overflow-y:auto;transition:left .2s}
.drawer.open{left:0}
.drw-item{width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin-bottom:6px;border-radius:9px;border:1px solid #1e2d52;background:#0b1226;color:#fff;font-size:12px;font-weight:700;cursor:pointer;text-align:left}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:108px;padding:12px 10px;background:#0b1226;border:1.5px solid #26365e;border-radius:14px;color:#fff;font-weight:800;font-size:13.5px;text-align:center;cursor:pointer;text-decoration:none}
.tile .ico{font-size:26px}
.tile .sub{font-size:10.5px;color:#94a3b8;font-weight:500}
.tile.gold{border-color:#f5a623;color:#ffd166}
.tile.green{border-color:#22c55e;color:#4ade80}
.tile.cyan{border-color:#22d3ee;color:#22d3ee}
.tile.blue{border-color:#38bdf8;color:#7dd3fc}
.tile.purple{border-color:#a855f7;color:#d8b4fe}
.tile.red{border-color:#ef4444;color:#fca5a5}
.tile.orange{border-color:#f97316;color:#fdba74}
.tile.full{grid-column:1/-1;min-height:64px;flex-direction:row}

.panel{margin-top:12px;background:#0b1226;border:1.5px solid #26365e;border-radius:14px;padding:14px}
.panel h3{font-size:14px;color:#ffd166;margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{margin-bottom:8px}
.fg label{display:block;font-size:11px;color:#94a3b8;margin-bottom:3px;font-weight:700}
.fc{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #2c3e6b;background:#070c1a;color:#fff;font-size:12.5px}
.act-btn{width:100%;padding:10px;border-radius:10px;border:none;font-weight:900;font-size:12.5px;cursor:pointer;margin-top:4px}
.act-btn.gold{background:#f5a623;color:#050814}
.act-btn.green{background:#22c55e;color:#050814}
.act-btn.cyan{background:#22d3ee;color:#050814}
.rec{background:#070c1a;border:1px solid #1e2d52;border-radius:9px;padding:8px 10px;margin-top:6px;font-size:12px}
</style>
</head>
<body>

<script>
(function () {
  var MODE_KEY = "om_locked_app_mode_v1";
  var LOGGED_KEY = "om_session_active_v1";

  function getLockedMode() {
    try {
      var m = localStorage.getItem(MODE_KEY);
      if (m === "light" || m === "full") return m;
      var legacy = localStorage.getItem("om_app_display_mode");
      if (legacy === "light" || legacy === "full") {
        localStorage.setItem(MODE_KEY, legacy);
        return legacy;
      }
    } catch (e) {}
    return "light";
  }

  function setLockedMode(mode, explicitSwitch) {
    if (!explicitSwitch) return;
    var target = (mode === "full") ? "full" : "light";
    try {
      localStorage.setItem(MODE_KEY, target);
      localStorage.setItem("om_app_display_mode", target);
      localStorage.setItem(LOGGED_KEY, "1");
    } catch (e) {}
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: target } }));
  }

  function clearSessionOnLogout() {
    try {
      localStorage.removeItem(LOGGED_KEY);
      localStorage.removeItem("om_session_active");
    } catch (e) {}
  }

  window.omGetLockedMode = getLockedMode;
  window.omSetLockedMode = setLockedMode;
  window.omClearSessionOnLogout = clearSessionOnLogout;

  // Keep mode locked across browser back/forward (pageshow)
  window.addEventListener("pageshow", function () {
    var m = getLockedMode();
    window.dispatchEvent(new CustomEvent("om:mode-changed", { detail: { mode: m } }));
  });
})();
</script>

<div class="drawer-ov" id="drawerOv"></div>
<aside class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26365e;padding-bottom:8px;margin-bottom:10px">
    <b style="color:#ffd166">Menu (18)</b>
    <button type="button" id="btnCloseDrawer" style="background:none;border:none;color:#fb7185;font-size:20px;cursor:pointer">&times;</button>
  </div>
  <div id="drawerList"></div>
</aside>

<div class="wrap">
  <header>
    <div class="hdr-left">
      <button type="button" class="menu-btn" id="btnOpenDrawer">&#9776;</button>
      <div>
        <h1 id="appHdrTitle">OM SOFTWARE</h1>
        <p id="appModeSub">Mode Locked: Light Mode</p>
      </div>
    </div>
    <div class="top-btns">
      <button type="button" class="sbtn cyan" id="btnSwitchMode">Switch Mode</button>
      <a href="plans.html" class="sbtn gold">Plans</a>
      <button type="button" class="sbtn red" id="btnLogout">Logout</button>
    </div>
  </header>

  <div id="lightView">
    <div class="grid">
      <button type="button" class="tile gold" data-panel="admission"><span class="ico">📝</span>1. Admission Form<span class="sub">नया सदस्य</span></button>
      <button type="button" class="tile green" data-panel="attendance"><span class="ico">✅</span>2. Attendance<span class="sub">सदस्य हाजिरी</span></button>
      <button type="button" class="tile cyan" data-panel="staff_att"><span class="ico">🧑‍💼</span>3. Staff Attendance<span class="sub">Employee ID</span></button>
      <button type="button" class="tile red" data-panel="pay_fees"><span class="ico">💳</span>Pay Fees<span class="sub">फीस जमा</span></button>
      <button type="button" class="tile blue" data-panel="new_adm"><span class="ico">🆕</span>4. New Admission<span class="sub">नया एडमिशन</span></button>
      <button type="button" class="tile purple" data-panel="enquiry"><span class="ico">📞</span>5. Enquiry<span class="sub">इन्क्वायरी</span></button>
      <button type="button" class="tile orange full" data-panel="collection"><span class="ico">💰</span><span>Total Collection<br><span class="sub">Fees • New Admission • Old Customer</span></span></button>
    </div>
  </div>

  <div id="fullView" style="display:none">
    <div class="grid">
      <a class="tile gold" href="index.html"><span class="ico">📊</span>Master Control<span class="sub">Live Overview</span></a>
      <a class="tile green" href="fees-pending.html"><span class="ico">📅</span>Fees Pending<span class="sub">1-31 Register</span></a>
      <a class="tile cyan" href="attendance.html"><span class="ico">✅</span>Attendance Kiosk<span class="sub">Check-in</span></a>
      <a class="tile blue" href="fees-collection.html"><span class="ico">💳</span>Fees Portal<span class="sub">Receipts</span></a>
      <a class="tile purple" href="staff-salary.html"><span class="ico">💼</span>Salary &amp; HR<span class="sub">Payroll</span></a>
      <a class="tile orange" href="manager-portal.html"><span class="ico">👔</span>Manager Portal<span class="sub">Approvals</span></a>
    </div>
  </div>

  <div class="panel" id="activePanel"></div>
</div>

<script>
(function () {
  var DATA_KEY = "om_app_working_data_v1";
  var MENU_18 = [
    "1. Dashboard", "2. Admission", "3. Attendance", "4. Staff Attendance",
    "5. Pay Fees", "6. New Admission", "7. Enquiry", "8. Total Collection",
    "9. Fees Pending", "10. Salary Register", "11. Manager Portal", "12. Plans",
    "13. Export Excel", "14. Branch Info", "15. Staff Setup", "16. Reports",
    "17. Settings", "18. Help"
  ];

  function readData() {
    try { return JSON.parse(localStorage.getItem(DATA_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function writeData(d) {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(d)); } catch (e) {}
  }

  function applyLockedModeView() {
    var m = window.omGetLockedMode();
    var isFull = (m === "full");
    document.getElementById("lightView").style.display = isFull ? "none" : "block";
    document.getElementById("fullView").style.display = isFull ? "block" : "none";
    document.getElementById("appModeSub").textContent = isFull ? "Mode Locked: Full App Mode" : "Mode Locked: Light Mode";
  }

  function renderPanel(key) {
    var d = readData();
    d.admissions = d.admissions || [];
    d.attendance = d.attendance || [];
    d.staffAtt = d.staffAtt || [];
    d.fees = d.fees || [];
    d.newAdm = d.newAdm || [];
    d.oldPay = d.oldPay || [];
    d.enquiries = d.enquiries || [];

    var box = document.getElementById("activePanel");
    if (key === "admission") {
      box.innerHTML = '<h3>1. Admission Form</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pAdmName"></div><div class="fg"><label>Mobile *</label><input class="fc" id="pAdmPhone"></div></div>' +
        '<button type="button" class="act-btn gold" id="btnSaveAdm">Save Admission</button>' +
        d.admissions.map(function (x) { return '<div class="rec"><b>' + x.name + '</b> • ' + x.phone + '</div>'; }).join("");
      document.getElementById("btnSaveAdm").onclick = function () {
        var n = document.getElementById("pAdmName").value.trim(), p = document.getElementById("pAdmPhone").value.trim();
        if (!n) return alert("Name darj karein.");
        d.admissions.unshift({ name: n, phone: p }); writeData(d); renderPanel("admission");
      };
    } else if (key === "attendance") {
      box.innerHTML = '<h3>2. Attendance</h3>' +
        '<div class="fg"><label>Member Name *</label><input class="fc" id="pAttName"></div>' +
        '<button type="button" class="act-btn green" id="btnSaveAtt">Mark Present</button>' +
        d.attendance.map(function (x) { return '<div class="rec"><b>' + x.name + '</b> • ' + x.date + '</div>'; }).join("");
      document.getElementById("btnSaveAtt").onclick = function () {
        var n = document.getElementById("pAttName").value.trim();
        if (!n) return alert("Name darj karein.");
        d.attendance.unshift({ name: n, date: new Date().toISOString().slice(0, 10) }); writeData(d); renderPanel("attendance");
      };
    } else if (key === "staff_att") {
      box.innerHTML = '<h3>3. Staff Attendance</h3>' +
        '<div class="fg"><label>Employee ID / Code *</label><input class="fc" id="pStfId" placeholder="e.g. STF-01"></div>' +
        '<button type="button" class="act-btn cyan" id="btnSaveStfAtt">Mark Staff Attendance</button>' +
        d.staffAtt.map(function (x) { return '<div class="rec"><b>' + x.code + '</b> • ' + x.date + '</div>'; }).join("");
      document.getElementById("btnSaveStfAtt").onclick = function () {
        var c = document.getElementById("pStfId").value.trim();
        if (!c) return alert("Employee ID zaroori hai.");
        d.staffAtt.unshift({ code: c, date: new Date().toISOString().slice(0, 10) }); writeData(d); renderPanel("staff_att");
      };
    } else if (key === "pay_fees") {
      box.innerHTML = '<h3>Pay Fees</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pFeeName"></div><div class="fg"><label>Amount (₹) *</label><input type="number" class="fc" id="pFeeAmt" value="500"></div></div>' +
        '<div class="fg"><label>Type</label><select class="fc" id="pFeeType"><option value="old">Old Customer</option><option value="new">New Admission</option></select></div>' +
        '<button type="button" class="act-btn green" id="btnSaveFee">Collect Fees</button>';
      document.getElementById("btnSaveFee").onclick = function () {
        var n = document.getElementById("pFeeName").value.trim(), a = Number(document.getElementById("pFeeAmt").value || 0), t = document.getElementById("pFeeType").value;
        if (!n || a <= 0) return alert("Name aur amount darj karein.");
        d.fees.unshift({ name: n, amount: a });
        if (t === "new") d.newAdm.unshift({ name: n, amount: a }); else d.oldPay.unshift({ name: n, amount: a });
        writeData(d); renderPanel("collection");
      };
    } else if (key === "new_adm") {
      box.innerHTML = '<h3>4. New Admission</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pNaName"></div><div class="fg"><label>Amount (₹) *</label><input type="number" class="fc" id="pNaAmt" value="500"></div></div>' +
        '<button type="button" class="act-btn cyan" id="btnSaveNa">Save New Admission</button>';
      document.getElementById("btnSaveNa").onclick = function () {
        var n = document.getElementById("pNaName").value.trim(), a = Number(document.getElementById("pNaAmt").value || 0);
        if (!n || a <= 0) return alert("Name aur amount darj karein.");
        d.newAdm.unshift({ name: n, amount: a }); d.fees.unshift({ name: n, amount: a });
        writeData(d); renderPanel("collection");
      };
    } else if (key === "enquiry") {
      box.innerHTML = '<h3>5. Enquiry</h3>' +
        '<div class="row2"><div class="fg"><label>Name *</label><input class="fc" id="pEnqName"></div><div class="fg"><label>Mobile *</label><input class="fc" id="pEnqPhone"></div></div>' +
        '<button type="button" class="act-btn gold" id="btnSaveEnq">Save Enquiry</button>' +
        d.enquiries.map(function (x) { return '<div class="rec"><b>' + x.name + '</b> • ' + x.phone + '</div>'; }).join("");
      document.getElementById("btnSaveEnq").onclick = function () {
        var n = document.getElementById("pEnqName").value.trim(), p = document.getElementById("pEnqPhone").value.trim();
        if (!n) return alert("Name darj karein.");
        d.enquiries.unshift({ name: n, phone: p }); writeData(d); renderPanel("enquiry");
      };
    } else {
      var fSum = d.fees.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      var nSum = d.newAdm.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      var oSum = d.oldPay.reduce(function (s, x) { return s + Number(x.amount || 0); }, 0);
      box.innerHTML = '<h3>Total Collection</h3>' +
        '<div class="rec">Fees Earning: <b>₹' + fSum + '</b></div>' +
        '<div class="rec">New Admission Payment: <b>₹' + nSum + '</b></div>' +
        '<div class="rec">Old Customer Payment: <b>₹' + oSum + '</b></div>';
    }
  }

  document.getElementById("drawerList").innerHTML = MENU_18.map(function (label, i) {
    return '<button type="button" class="drw-item" data-drw="' + i + '"><span>' + label + '</span><span>&rarr;</span></button>';
  }).join("");

  document.getElementById("btnOpenDrawer").onclick = function () {
    document.getElementById("drawerOv").classList.add("open");
    document.getElementById("drawer").classList.add("open");
  };
  document.getElementById("btnCloseDrawer").onclick = document.getElementById("drawerOv").onclick = function () {
    document.getElementById("drawerOv").classList.remove("open");
    document.getElementById("drawer").classList.remove("open");
  };

  document.getElementById("drawerList").onclick = function (ev) {
    var b = ev.target.closest("[data-drw]");
    if (!b) return;
    var idx = Number(b.getAttribute("data-drw"));
    document.getElementById("drawerOv").classList.remove("open");
    document.getElementById("drawer").classList.remove("open");
    if (idx === 1) renderPanel("admission");
    else if (idx === 2) renderPanel("attendance");
    else if (idx === 3) renderPanel("staff_att");
    else if (idx === 4) renderPanel("pay_fees");
    else if (idx === 5) renderPanel("new_adm");
    else if (idx === 6) renderPanel("enquiry");
    else if (idx === 7) renderPanel("collection");
    else if (idx === 8) location.href = "fees-pending.html";
    else if (idx === 9) location.href = "staff-salary.html";
    else if (idx === 10) location.href = "manager-portal.html";
    else if (idx === 11) location.href = "plans.html";
    else if (idx === 12 && typeof XLSX !== "undefined") {
      var wb = XLSX.utils.book_new();
      var ws = XLSX.utils.json_to_sheet(readData().fees || [{ Info: "Empty" }]);
      XLSX.utils.book_append_sheet(wb, ws, "Export");
      XLSX.writeFile(wb, "Om_Software_Export.xlsx");
    }
  };

  document.getElementById("lightView").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-panel]");
    if (t) renderPanel(t.getAttribute("data-panel"));
  });

  // Explicit mode switch only when user clicks Switch Mode
  document.getElementById("btnSwitchMode").onclick = function () {
    var cur = window.omGetLockedMode();
    var next = (cur === "light") ? "full" : "light";
    window.omSetLockedMode(next, true);
    applyLockedModeView();
  };

  document.getElementById("btnLogout").onclick = function () {
    if (!confirm("Logout karna hai?")) return;
    window.omClearSessionOnLogout();
    location.href = "login.html";
  };

  var taps = 0, tmr = null;
  document.getElementById("appHdrTitle").onclick = function () {
    taps++;
    clearTimeout(tmr);
    tmr = setTimeout(function () { taps = 0; }, 2200);
    if (taps >= 5) { taps = 0; location.href = "prime-master-login.html"; }
  };

  window.addEventListener("om:mode-changed", applyLockedModeView);
  applyLockedModeView();
  renderPanel("collection");
})();
</script>
</body>
</html>
