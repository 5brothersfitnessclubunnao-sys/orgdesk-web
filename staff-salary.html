<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Om Software - Staff Salary Folders</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070B14;
      --bg-grad: radial-gradient(1200px 600px at 50% -10%, #152244 0%, #080D1A 60%, #05070D 100%);
      --card: #0F172A;
      --sub: #0B1224;
      --border: #23355C;
      --gold: #FFB800;
      --cyan: #38BDF8;
      --green: #22C55E;
      --red: #EF4444;
      --tx: #FFFFFF;
      --tx-sub: #CBD5E1;
      --mut: #8494B2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; max-width: 100vw; overflow-x: hidden; background: var(--bg-grad) fixed; color: var(--tx); min-height: 100vh; }
    body { padding: clamp(10px, 2vw, 18px) clamp(10px, 2.5vw, 20px) 70px; }

    .wrap { max-width: 1160px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.95); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 14px;
    }
    .top-bar h1 { font-size: 15px; font-weight: 900; color: #fff; }
    .btn {
      background: #162340; color: #fff; border: 1px solid var(--border); padding: 6px 11px;
      border-radius: 8px; font-size: 11.5px; font-weight: 800; text-decoration: none; cursor: pointer;
    }
    .btn:hover { border-color: var(--gold); }
    .btn.gold { background: var(--gold); color: #000; border: none; font-weight: 900; }
    .btn.green { background: var(--green); color: #04140C; border: none; font-weight: 900; }

    /* Folder Cards */
    .folder-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 13px; overflow: hidden;
    }
    .folder-head {
      padding: 13px 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: rgba(18, 28, 52, 0.92); cursor: pointer; user-select: none;
    }
    .folder-head:hover { background: rgba(25, 38, 70, 0.98); }
    .fh-left { font-size: 13.5px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
    .fh-right { font-size: 11.5px; font-weight: 800; color: var(--gold); }

    .folder-body { padding: 14px; border-top: 1px solid var(--border); display: none; flex-direction: column; gap: 11px; }
    .folder-body.open { display: flex; }

    .sel-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .sel-row label { font-size: 11px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
    .sel-row select {
      flex: 1 1 240px; background: var(--sub); border: 1.5px solid var(--border); color: #fff;
      padding: 9px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 700; outline: none;
    }

    /* Professional Staff Name Card */
    .staff-card {
      background: var(--sub); border: 1.5px solid rgba(51, 78, 129, 0.45); border-radius: 11px;
      padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      cursor: pointer; transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .staff-card:hover { border-color: var(--gold); transform: translateY(-1px); }
    .sc-name { font-size: 14px; font-weight: 900; color: #fff; }
    .sc-sub { font-size: 11.5px; color: var(--mut); margin-top: 3px; }
    .sc-sub b { color: var(--tx-sub); }
    .emp-badge {
      background: rgba(56, 189, 248, 0.14); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
    }

    /* Modals */
    .ov {
      display: none; position: fixed; inset: 0; background: rgba(3, 6, 15, 0.94);
      z-index: 99999; padding: 14px; align-items: center; justify-content: center; overflow-y: auto;
    }
    .ov.show { display: flex; }
    .bx {
      background: #101B33; border: 1.5px solid var(--gold); border-radius: 15px;
      padding: 18px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
    }
    .bx h3 { color: var(--gold); font-size: 15px; font-weight: 900; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* Choice buttons (Joining Details vs See Salary Slip) */
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .choice-btn {
      background: var(--sub); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 16px 12px; color: #fff; font-weight: 900; font-size: 13px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    }
    .choice-btn:hover { border-color: var(--gold); background: rgba(255, 184, 0, 0.1); }

    /* Proper Corporate Salary Slip Sheet */
    .slip-sheet {
      background: #FFFFFF; color: #111111; border: 2.5px solid #111111;
      border-radius: 4px; padding: 18px 20px; font-size: 12px; line-height: 1.5;
    }
    .slip-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      border-bottom: 2px solid #111111; padding-bottom: 10px; margin-bottom: 12px;
    }
    .slip-top h2 { font-size: 17px; font-weight: 900; color: #000; }
    .slip-top p { font-size: 11px; color: #444; font-weight: 700; margin-top: 2px; }
    .slip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 12px; }
    .slip-cell { border-bottom: 1px dotted #999; padding-bottom: 4px; }
    .slip-cell .sl { font-size: 10px; color: #555; font-weight: 700; }
    .slip-cell .sv { font-size: 12px; color: #000; font-weight: 800; margin-top: 1px; }
    .slip-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11.5px; }
    .slip-table th, .slip-table td { border: 1px solid #222; padding: 7px 9px; text-align: left; }
    .slip-table th { background: #F3F4F6; color: #000; font-weight: 900; }
    .slip-net-row { background: #FFFBEB; font-weight: 900; font-size: 13px; }

    @media (max-width: 600px) {
      .choice-grid { grid-template-columns: 1fr; }
      .slip-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="top-bar">
    <h1>💼 Staff Salary Desk</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="branch-report.html" class="btn">📂 Branch ERP</a>
      <a href="index.html" class="btn">⬅️ Dashboard</a>
    </div>
  </header>

  <!-- FOLDER 1: BRANCH WISE SALARY -->
  <section class="folder-card">
    <div class="folder-head" onclick="toggleFolder('fBranchWiseBody', 'arrBranchWise')">
      <div class="fh-left"><span>📂</span> <span>Branch Wise Salary</span></div>
      <div class="fh-right" id="arrBranchWise">▼ Open</div>
    </div>

    <div class="folder-body open" id="fBranchWiseBody">
      <div class="sel-row">
        <label>Select Branch:</label>
        <select id="branchSel" onchange="onBranchSelect()"></select>
      </div>
      <div id="branchStaffCardsBox" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </section>

  <!-- FOLDER 2: TOTAL STAFF SALARY -->
  <section class="folder-card">
    <div class="folder-head" onclick="toggleFolder('fTotalStaffBody', 'arrTotalStaff')">
      <div class="fh-left"><span>📂</span> <span>Total Staff Salary</span></div>
      <div class="fh-right" id="arrTotalStaff">▶ Expand</div>
    </div>

    <div class="folder-body" id="fTotalStaffBody">
      <div id="totalStaffRegisterBox" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </section>
</div>

<!-- ACTION CHOICE MODAL: JOINING DETAILS vs SEE SALARY SLIP -->
<div class="ov" id="staffActionOv">
  <div class="bx" style="max-width:440px">
    <h3>
      <span id="actionModalStaffName">Staff Name</span>
      <button type="button" onclick="closeOv('staffActionOv')" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
    </h3>
    <div style="font-size:11.5px;color:var(--mut);margin-bottom:8px" id="actionModalStaffMeta"></div>
    <div class="choice-grid">
      <button type="button" class="choice-btn" onclick="openJoiningDetailsFromChoice()">
        <span style="font-size:22px">📄</span>
        <span>Joining Details</span>
        <small style="font-weight:600;color:var(--mut);font-size:10.5px">Joining Form &amp; KYC</small>
      </button>
      <button type="button" class="choice-btn" onclick="openSalarySlipFromChoice()">
        <span style="font-size:22px">🧾</span>
        <span>See Salary Slip</span>
        <small style="font-weight:600;color:var(--mut);font-size:10.5px">Month-Wise Slip &amp; Download</small>
      </button>
    </div>
  </div>
</div>

<!-- JOINING DETAILS MODAL -->
<div class="ov" id="joiningDetailsOv">
  <div class="bx" style="max-width:520px">
    <h3>
      <span>📄 Staff Joining Form &amp; Details</span>
      <button type="button" onclick="closeOv('joiningDetailsOv')" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
    </h3>
    <div id="joiningDetailsContent" style="background:var(--sub);border:1px solid var(--border);border-radius:11px;padding:14px;font-size:12px;line-height:1.6"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button type="button" class="btn" onclick="closeOv('joiningDetailsOv')">Close</button>
      <a href="staff-join.html" class="btn gold">Full Joining Form</a>
    </div>
  </div>
</div>

<!-- SALARY SLIP MODAL (PROPER CORPORATE SLIP WITH MONTH SELECTOR + PRESENT/ABSENT/LATE DAYS) -->
<div class="ov" id="salarySlipOv">
  <div class="bx" style="max-width:650px">
    <h3>
      <span>🧾 Official Staff Salary Slip</span>
      <button type="button" onclick="closeOv('salarySlipOv')" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
    </h3>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <label style="font-size:11px;font-weight:800;color:var(--gold)">Select Month:</label>
        <select id="slipMonthSel" onchange="renderSelectedStaffSlip()" style="background:var(--sub);border:1px solid var(--border);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700">
          <option value="2026-11">November 2026 (Current Month)</option>
          <option value="2026-10">October 2026</option>
          <option value="2026-09">September 2026</option>
          <option value="2026-08">August 2026</option>
        </select>
      </div>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn green" onclick="downloadProperSlipFile()">⬇ Download Slip</button>
        <button type="button" class="btn gold" onclick="window.print()">🖨️ Print</button>
      </div>
    </div>

    <div class="slip-sheet" id="properSlipSheetBox"></div>
  </div>
</div>

<script>
const BRANCHES = [
  { code: "001", name: "5 Brother's Fitness Club - Akrampur", city: "Unnao" },
  { code: "002", name: "5 Brother's Fitness Club - Kanpur", city: "Kanpur" },
  { code: "003", name: "5 Brother's Fitness Club - Lucknow", city: "Lucknow" }
];

const STAFF_RECORDS = [
  {
    id: "EMP-001-01", branchCode: "001", branchName: "5 Brother's Fitness Club - Akrampur", city: "Unnao",
    name: "Rameshwar Prasad", role: "Sweeper & Cleaner", joinDate: "2024-03-15", phone: "9876501122",
    baseSalary: 8500, presentDays: 28, absentDays: 2, lateDays: 2, lateMinutes: 40,
    ta: 0, da: 0, pf: 0, esi: 0, advance: 500,
    history: {
      "2026-11": { present: 28, absent: 2, lateDays: 2, lateMins: 40, base: 8500, adv: 500 },
      "2026-10": { present: 29, absent: 2, lateDays: 1, lateMins: 15, base: 8500, adv: 0 },
      "2026-09": { present: 27, absent: 3, lateDays: 2, lateMins: 30, base: 8500, adv: 500 },
      "2026-08": { present: 30, absent: 1, lateDays: 0, lateMins: 0, base: 8500, adv: 0 }
    }
  },
  {
    id: "EMP-001-02", branchCode: "001", branchName: "5 Brother's Fitness Club - Akrampur", city: "Unnao",
    name: "Vikram Yadav", role: "Senior Strength Trainer", joinDate: "2023-08-01", phone: "9876503344",
    baseSalary: 16000, presentDays: 28, absentDays: 2, lateDays: 1, lateMinutes: 30,
    ta: 1200, da: 800, pf: 1800, esi: 250, advance: 1000,
    history: {
      "2026-11": { present: 28, absent: 2, lateDays: 1, lateMins: 30, base: 16000, adv: 1000 },
      "2026-10": { present: 30, absent: 1, lateDays: 1, lateMins: 20, base: 16000, adv: 0 },
      "2026-09": { present: 29, absent: 1, lateDays: 0, lateMins: 0, base: 16000, adv: 1000 },
      "2026-08": { present: 28, absent: 3, lateDays: 2, lateMins: 35, base: 16000, adv: 0 }
    }
  },
  {
    id: "EMP-001-03", branchCode: "001", branchName: "5 Brother's Fitness Club - Akrampur", city: "Unnao",
    name: "Pooja Sharma", role: "Front Desk & Billing", joinDate: "2024-01-10", phone: "9876504455",
    baseSalary: 11000, presentDays: 27, absentDays: 3, lateDays: 1, lateMinutes: 15,
    ta: 0, da: 0, pf: 0, esi: 0, advance: 0,
    history: {
      "2026-11": { present: 27, absent: 3, lateDays: 1, lateMins: 15, base: 11000, adv: 0 },
      "2026-10": { present: 29, absent: 2, lateDays: 0, lateMins: 0, base: 11000, adv: 500 },
      "2026-09": { present: 28, absent: 2, lateDays: 1, lateMins: 20, base: 11000, adv: 0 },
      "2026-08": { present: 29, absent: 2, lateDays: 0, lateMins: 0, base: 11000, adv: 0 }
    }
  },
  {
    id: "EMP-002-01", branchCode: "002", branchName: "5 Brother's Fitness Club - Kanpur", city: "Kanpur",
    name: "Arjun Verma", role: "Fitness & Crossfit Coach", joinDate: "2023-11-01", phone: "9876506677",
    baseSalary: 18000, presentDays: 29, absentDays: 1, lateDays: 1, lateMinutes: 40,
    ta: 1500, da: 1000, pf: 1800, esi: 300, advance: 1500,
    history: {
      "2026-11": { present: 29, absent: 1, lateDays: 1, lateMins: 40, base: 18000, adv: 1500 },
      "2026-10": { present: 30, absent: 1, lateDays: 0, lateMins: 0, base: 18000, adv: 0 }
    }
  },
  {
    id: "EMP-003-01", branchCode: "003", branchName: "5 Brother's Fitness Club - Lucknow", city: "Lucknow",
    name: "Kailash Chand", role: "Cleaner & Support", joinDate: "2024-07-01", phone: "9876508899",
    baseSalary: 9000, presentDays: 26, absentDays: 4, lateDays: 0, lateMinutes: 0,
    ta: 0, da: 0, pf: 0, esi: 0, advance: 500,
    history: {
      "2026-11": { present: 26, absent: 4, lateDays: 0, lateMins: 0, base: 9000, adv: 500 },
      "2026-10": { present: 28, absent: 3, lateDays: 1, lateMins: 15, base: 9000, adv: 0 }
    }
  }
];

let selectedBranchCode = BRANCHES[0].code;
let selectedStaffObj = null;

function toggleFolder(bodyId, arrId) {
  const b = document.getElementById(bodyId);
  const arr = document.getElementById(arrId);
  const isOpen = b.classList.contains("open");
  if (isOpen) {
    b.classList.remove("open");
    arr.textContent = "▶ Expand";
  } else {
    b.classList.add("open");
    arr.textContent = "▼ Open";
  }
}

function initBranchSelect() {
  const sel = document.getElementById("branchSel");
  sel.innerHTML = BRANCHES.map(b => `<option value="${b.code}">[${b.code}] ${b.name} (${b.city})</option>`).join("");
  sel.value = selectedBranchCode;
}

function onBranchSelect() {
  selectedBranchCode = document.getElementById("branchSel").value;
  renderBranchWiseCards();
}

function calcSlipForMonth(s, ym) {
  const hist = (s.history && s.history[ym]) ? s.history[ym] : {
    present: s.presentDays, absent: s.absentDays, lateDays: s.lateDays, lateMins: s.lateMinutes, base: s.baseSalary, adv: s.advance
  };
  const daysInMonth = 30;
  const perDay = hist.base / daysInMonth;
  const earnedBase = Math.round(perDay * hist.present);
  const perMin = (perDay / 8) / 60;
  const latePenalty = Math.round((hist.lateMins || 0) * perMin);
  const ta = s.ta || 0;
  const da = s.da || 0;
  const pf = s.pf || 0;
  const esi = s.esi || 0;
  const adv = hist.adv || 0;
  const netPayable = Math.max(0, earnedBase + ta + da - pf - esi - latePenalty - adv);

  return { ym, hist, earnedBase, ta, da, pf, esi, latePenalty, adv, netPayable };
}

function renderBranchWiseCards() {
  const list = STAFF_RECORDS.filter(s => s.branchCode === selectedBranchCode);
  const box = document.getElementById("branchStaffCardsBox");

  box.innerHTML = list.map(s => `
    <div class="staff-card" onclick="openStaffChoiceModal('${s.id}')">
      <div>
        <div class="sc-name">${s.name} <span class="emp-badge">Code: ${s.id}</span></div>
        <div class="sc-sub">Branch: <b>${s.branchName}</b> &bull; Role: <b>${s.role}</b></div>
      </div>
      <div style="font-size:11.5px;font-weight:800;color:var(--gold)">Options →</div>
    </div>
  `).join("");
}

function renderTotalStaffFolder() {
  const box = document.getElementById("totalStaffRegisterBox");
  let grandSal = 0;

  const rowsHtml = BRANCHES.map(b => {
    const bStaff = STAFF_RECORDS.filter(s => s.branchCode === b.code);
    let bTotal = 0;
    const memberLines = bStaff.map(s => {
      const calc = calcSlipForMonth(s, "2026-11");
      bTotal += calc.netPayable;
      return `<div style="font-size:11.5px;color:var(--tx-sub);padding:2px 0">• <b>${s.name}</b> (${s.id}, ${s.role}): <b>₹${calc.netPayable.toLocaleString("en-IN")}</b></div>`;
    }).join("");
    grandSal += bTotal;

    return `
      <div class="staff-card" style="cursor:default;flex-direction:column;align-items:stretch">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div>
            <b style="color:#fff;font-size:13px">${b.city} — ${b.name}</b>
            <div style="font-size:11px;color:var(--mut)">Total Staff: ${bStaff.length}</div>
          </div>
          <div style="font-size:13.5px;font-weight:900;color:var(--green)">Branch Salary: ₹${bTotal.toLocaleString("en-IN")}</div>
        </div>
        <div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)">
          ${memberLines}
        </div>
      </div>
    `;
  }).join("");

  box.innerHTML = `
    <div class="staff-card" style="cursor:default;background:#101C36;border-color:var(--gold)">
      <div><b>Total Staff (All Branches):</b> <span style="color:var(--gold);font-weight:900">${STAFF_RECORDS.length} Employees</span></div>
      <div><b>Grand Total Monthly Salary:</b> <span style="color:var(--green);font-weight:900">₹${grandSal.toLocaleString("en-IN")}</span></div>
    </div>
    ${rowsHtml}
  `;
}

function openStaffChoiceModal(staffId) {
  const s = STAFF_RECORDS.find(x => x.id === staffId);
  if (!s) return;
  selectedStaffObj = s;
  document.getElementById("actionModalStaffName").textContent = s.name;
  document.getElementById("actionModalStaffMeta").textContent = `${s.id} • ${s.role} • ${s.branchName}`;
  document.getElementById("staffActionOv").classList.add("show");
}

function openJoiningDetailsFromChoice() {
  closeOv("staffActionOv");
  if (!selectedStaffObj) return;
  const s = selectedStaffObj;
  document.getElementById("joiningDetailsContent").innerHTML = `
    <div style="font-size:14px;font-weight:900;color:var(--gold);margin-bottom:6px">${s.name} (${s.id})</div>
    <div><b>Branch:</b> ${s.branchName} (${s.city})</div>
    <div><b>Designation / Role:</b> ${s.role}</div>
    <div><b>Joining Date:</b> ${s.joinDate}</div>
    <div><b>Contact Phone:</b> ${s.phone}</div>
    <div><b>Monthly Base Salary:</b> ₹${Number(s.baseSalary).toLocaleString("en-IN")}</div>
  `;
  document.getElementById("joiningDetailsOv").classList.add("show");
}

function openSalarySlipFromChoice() {
  closeOv("staffActionOv");
  if (!selectedStaffObj) return;
  document.getElementById("slipMonthSel").value = "2026-11";
  renderSelectedStaffSlip();
  document.getElementById("salarySlipOv").classList.add("show");
}

function renderSelectedStaffSlip() {
  if (!selectedStaffObj) return;
  const s = selectedStaffObj;
  const ym = document.getElementById("slipMonthSel").value;
  const c = calcSlipForMonth(s, ym);

  document.getElementById("properSlipSheetBox").innerHTML = `
    <div class="slip-top">
      <div>
        <h2>${s.branchName.toUpperCase()}</h2>
        <p>STAFF SALARY SLIP • PERIOD: ${ym} (${s.city})</p>
      </div>
      <div style="text-align:right;font-size:11px;font-weight:800">
        <div>Emp Code: ${s.id}</div>
        <div>Joining: ${s.joinDate}</div>
      </div>
    </div>

    <div class="slip-grid">
      <div class="slip-cell"><div class="sl">Employee Name</div><div class="sv">${s.name}</div></div>
      <div class="slip-cell"><div class="sl">Designation / Role</div><div class="sv">${s.role}</div></div>
      <div class="slip-cell"><div class="sl">Present / Absent Days</div><div class="sv">Present: ${c.hist.present} Days &bull; Absent: ${c.hist.absent} Days</div></div>
      <div class="slip-cell"><div class="sl">Late Days &amp; Minutes</div><div class="sv">Late: ${c.hist.lateDays} Days (${c.hist.lateMins} mins)</div></div>
    </div>

    <table class="slip-table">
      <thead>
        <tr>
          <th>Earnings</th>
          <th>Amount (₹)</th>
          <th>Deductions</th>
          <th>Amount (₹)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Earned Base Salary (${c.hist.present}/30d)</td>
          <td>₹${c.earnedBase.toLocaleString("en-IN")}</td>
          <td>Late Attendance Penalty (${c.hist.lateMins}m)</td>
          <td>₹${c.latePenalty.toLocaleString("en-IN")}</td>
        </tr>
        <tr>
          <td>TA / DA Allowance</td>
          <td>${(c.ta + c.da) > 0 ? '₹' + (c.ta + c.da).toLocaleString("en-IN") : 'Not Applicable'}</td>
          <td>PF / ESI</td>
          <td>${(c.pf + c.esi) > 0 ? '₹' + (c.pf + c.esi).toLocaleString("en-IN") : 'Not Applicable'}</td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td>Advance Taken</td>
          <td>₹${c.adv.toLocaleString("en-IN")}</td>
        </tr>
        <tr class="slip-net-row">
          <td colspan="3">NET PAYABLE SALARY</td>
          <td>₹${c.netPayable.toLocaleString("en-IN")}</td>
        </tr>
      </tbody>
    </table>

    <div style="display:flex;justify-content:space-between;margin-top:20px;padding-top:8px;border-top:1px dashed #222;font-size:11px;font-weight:800">
      <span>Employee Signature: _________________</span>
      <span>Authorized Signatory: _________________</span>
    </div>
  `;
}

function downloadProperSlipFile() {
  if (!selectedStaffObj) return;
  const s = selectedStaffObj;
  const ym = document.getElementById("slipMonthSel").value;
  const c = calcSlipForMonth(s, ym);

  const slipText = [
    s.branchName.toUpperCase(),
    "SALARY SLIP - " + ym + " (" + s.city + ")",
    "==========================================",
    "Employee Name : " + s.name,
    "Employee Code : " + s.id,
    "Designation   : " + s.role,
    "Joining Date  : " + s.joinDate,
    "------------------------------------------",
    "Present Days  : " + c.hist.present + " Days",
    "Absent Days   : " + c.hist.absent + " Days",
    "Late Days     : " + c.hist.lateDays + " Days (" + c.hist.lateMins + " mins)",
    "------------------------------------------",
    "Earned Base   : Rs. " + c.earnedBase,
    "TA / DA       : " + ((c.ta + c.da) > 0 ? "Rs. " + (c.ta + c.da) : "Not Applicable"),
    "PF / ESI      : " + ((c.pf + c.esi) > 0 ? "Rs. " + (c.pf + c.esi) : "Not Applicable"),
    "Late Penalty  : Rs. " + c.latePenalty,
    "Advance       : Rs. " + c.adv,
    "------------------------------------------",
    "NET PAYABLE   : Rs. " + c.netPayable,
    "=========================================="
  ].join("\n");

  const blob = new Blob([slipText], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Salary_Slip_${s.name.replace(/\s+/g, "_")}_${ym}.txt`;
  a.click();
}

function closeOv(id) { document.getElementById(id).classList.remove("show"); }

window.addEventListener("DOMContentLoaded", () => {
  initBranchSelect();
  renderBranchWiseCards();
  renderTotalStaffFolder();
});
</script>
